<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #000000; }

      /* Live Flow Animations */
      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
      .anim-flow-green {
        stroke-dasharray: 10 6;
        animation: flow-dash 1s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. USER / REST CONSUMER ==================== -->
  <g transform="translate(45, 185)">
    <rect width="165" height="240" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <!-- User Icon -->
    <circle cx="82" cy="52" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 46 108 C 46 78, 118 78, 118 108" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="82" y="138" class="txt-title" text-anchor="middle">Consumer</text>
    <text x="82" y="160" class="txt-node-sub" font-style="italic" text-anchor="middle">(Tenant 501 Client)</text>
    
    <!-- Client Tools Box -->
    <rect x="18" y="182" width="129" height="36" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="82" y="205" class="txt-node-code" text-anchor="middle">cURL / Browser</text>
  </g>

  <!-- Flow: User <-> Web App -->
  <!-- Request Arrow (Top) -->
  <path d="M 210 255 L 310 255" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 210 255 L 310 255" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="260" y="245" class="txt-arrow-label" text-anchor="middle">POST /orders</text>

  <!-- Response Arrow (Bottom) -->
  <path d="M 310 325 L 210 325" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 310 325 L 210 325" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="260" y="348" class="txt-arrow-label" text-anchor="middle">Order JSON</text>


  <!-- ==================== 2. WEB APPLICATION BACKEND ==================== -->
  <g transform="translate(310, 115)">
    <rect width="275" height="380" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="137" y="34" class="txt-node-title" text-anchor="middle">Web Application Backend</text>
    <text x="137" y="56" class="txt-node-sub" font-weight="700" text-anchor="middle">Flask REST API</text>

    <!-- Layers / Stack items inside Flask App -->
    <g transform="translate(18, 72)">
      <rect width="239" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="119" y="27" class="txt-node-title" font-size="15" text-anchor="middle">Poridhi Load Balancer</text>
      <line x1="15" y1="38" x2="224" y2="38" stroke="#000000" stroke-width="1"/>
      <text x="119" y="58" class="txt-node-code" text-anchor="middle">*.lb.poridhi.io:5000</text>
    </g>

    <g transform="translate(18, 160)">
      <rect width="239" height="92" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="119" y="26" class="txt-node-title" font-size="15" text-anchor="middle">Flask API Endpoints</text>
      <line x1="15" y1="36" x2="224" y2="36" stroke="#000000" stroke-width="1"/>
      <text x="119" y="56" class="txt-node-sub" text-anchor="middle">POST /orders</text>
      <text x="119" y="78" class="txt-node-code" text-anchor="middle">GET /orders/&lt;tenant_id&gt;</text>
    </g>

    <g transform="translate(18, 268)">
      <rect width="239" height="92" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="119" y="26" class="txt-node-title" font-size="15" text-anchor="middle">SQLAlchemy Driver</text>
      <line x1="15" y1="36" x2="224" y2="36" stroke="#000000" stroke-width="1"/>
      <text x="119" y="56" class="txt-node-sub" text-anchor="middle">Citus Query Router Driver</text>
      <text x="119" y="78" class="txt-node-code" font-size="12" text-anchor="middle">Coordinator Port 5432</text>
    </g>
  </g>

  <!-- Flow: Web App <-> Citus Cluster -->
  <!-- SQL Queries Arrow (Top) -->
  <path d="M 585 250 L 685 250" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 585 250 L 685 250" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="635" y="240" class="txt-arrow-label" text-anchor="middle">SQL Query</text>

  <!-- Query Results Arrow (Bottom) -->
  <path d="M 685 330 L 585 330" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 685 330 L 585 330" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="635" y="352" class="txt-arrow-label" text-anchor="middle">Rows Result</text>


  <!-- ==================== 3. CITUS DATABASE CLUSTER ==================== -->
  <g transform="translate(685, 30)">
    <!-- Cluster Big Boundary -->
    <rect width="535" height="555" rx="16" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="267" y="34" class="txt-title" text-anchor="middle">Citus Database Cluster</text>

    <!-- 3.1 COORDINATOR NODE (Top Center) -->
    <g transform="translate(132, 52)">
      <rect width="270" height="160" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder (Clean Cyan) -->
      <g transform="translate(110, 14)">
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 10 L 3 32 A 22 7 0 0 0 47 32 L 47 10" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 17 A 22 7 0 0 0 47 17" fill="none" stroke="#000000" stroke-width="1.4"/>
        <path d="M 3 24 A 22 7 0 0 0 47 24" fill="none" stroke="#000000" stroke-width="1.4"/>
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="135" y="78" class="txt-node-title" text-anchor="middle">Coordinator Node</text>
      <text x="135" y="100" class="txt-node-sub" text-anchor="middle">citus_coordinator:5432</text>
      <text x="135" y="122" class="txt-node-code" text-anchor="middle">WHERE tenant_id = 501</text>
      <text x="135" y="144" class="txt-node-sub" font-size="12" text-anchor="middle">Point Query Router (Single-Node)</text>
    </g>

    <!-- Connectors: Coordinator -> Workers -->
    <!-- Direct Routed Line to Worker 1 (Active Animated Green Stream) -->
    <path d="M 215 212 L 140 295" fill="none" stroke="#bbf7d0" stroke-width="3"/>
    <path d="M 215 212 L 140 295" fill="none" stroke="#16a34a" stroke-width="3" class="anim-flow-green" marker-end="url(#arrow-green)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(30, 235)">
      <rect width="155" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="77" y="19" class="txt-badge" text-anchor="middle">Direct Point Route</text>
    </g>

    <!-- Idle / Bypassed to Worker 2 (With Muted Arrowhead) -->
    <path d="M 320 212 L 395 295" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
    <g transform="translate(350, 235)">
      <rect width="155" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="77" y="19" class="txt-badge" fill="#64748b" text-anchor="middle">Bypassed (Zero I/O)</text>
    </g>


    <!-- 3.2 WORKER NODE 1 (Target of Query) -->
    <g transform="translate(20, 295)">
      <rect width="235" height="175" rx="14" fill="#ffefe0" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder (Golden Yellow) -->
      <g transform="translate(92, 14)">
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 10 L 3 32 A 22 7 0 0 0 47 32 L 47 10" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 17 A 22 7 0 0 0 47 17" fill="none" stroke="#000000" stroke-width="1.4"/>
        <path d="M 3 24 A 22 7 0 0 0 47 24" fill="none" stroke="#000000" stroke-width="1.4"/>
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="117" y="80" class="txt-node-title" text-anchor="middle">Worker Node 1</text>
      <text x="117" y="102" class="txt-node-sub" text-anchor="middle">citus_worker_1:5432</text>
      <text x="117" y="126" class="txt-node-code" text-anchor="middle">Shard: tenant_id = 501</text>
      <text x="117" y="148" class="txt-node-sub" font-size="12" text-anchor="middle">Fast Local Read / Write</text>
    </g>

    <!-- 3.3 WORKER NODE 2 (Idle) -->
    <g transform="translate(280, 295)">
      <rect width="235" height="175" rx="14" fill="#ffefe0" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder (Golden Yellow) -->
      <g transform="translate(92, 14)">
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 10 L 3 32 A 22 7 0 0 0 47 32 L 47 10" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 17 A 22 7 0 0 0 47 17" fill="none" stroke="#000000" stroke-width="1.4"/>
        <path d="M 3 24 A 22 7 0 0 0 47 24" fill="none" stroke="#000000" stroke-width="1.4"/>
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="117" y="80" class="txt-node-title" text-anchor="middle">Worker Node 2</text>
      <text x="117" y="102" class="txt-node-sub" text-anchor="middle">citus_worker_2:5432</text>
      <text x="117" y="126" class="txt-node-code" text-anchor="middle">Other Tenant Shards</text>
      <text x="117" y="148" class="txt-node-sub" font-size="12" text-anchor="middle">Unaffected by Tenant 501</text>
    </g>

    <!-- Bottom Pill: Point Query Optimization -->
    <g transform="translate(47, 490)">
      <rect width="440" height="42" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
      <text x="220" y="27" class="txt-node-title" font-size="15.5" text-anchor="middle">Point Query Optimization &amp; Single-Node Routing</text>
    </g>
  </g>
</svg>
