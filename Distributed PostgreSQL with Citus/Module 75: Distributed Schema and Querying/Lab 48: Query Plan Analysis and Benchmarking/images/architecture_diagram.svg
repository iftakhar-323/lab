<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #000000; }

      /* Live Flow Animations */
      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1220" height="600" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. CLIENT / BENCHMARK WORKER ==================== -->
  <g transform="translate(45, 185)">
    <rect width="165" height="235" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <!-- User Icon -->
    <circle cx="82" cy="48" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 48 102 C 48 76, 116 76, 116 102" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="82" y="130" class="txt-title" text-anchor="middle">Benchmark</text>
    <text x="82" y="152" class="txt-node-sub" font-style="italic" text-anchor="middle">(Query &amp; Load Client)</text>
    
    <!-- Benchmark Spec Box -->
    <g transform="translate(12, 168)">
      <rect width="141" height="52" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="70" y="22" class="txt-node-code" text-anchor="middle">benchmark.py</text>
      <text x="70" y="42" class="txt-node-code" font-size="12" text-anchor="middle">EXPLAIN (ANALYZE)</text>
    </g>
  </g>

  <!-- Flow: Client <-> Citus Cluster -->
  <!-- Queries Arrow (Top) -->
  <path d="M 210 255 L 315 255" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 210 255 L 315 255" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="262" y="245" class="txt-arrow-label" text-anchor="middle">EXPLAIN / Writes</text>

  <!-- Results Arrow (Bottom) -->
  <path d="M 315 325 L 210 325" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 315 325 L 210 325" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="262" y="348" class="txt-arrow-label" text-anchor="middle">Execution Plan</text>


  <!-- ==================== 2. CITUS CLUSTER CONTAINER ==================== -->
  <g transform="translate(315, 25)">
    <rect width="895" height="565" rx="16" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="447" y="34" class="txt-title" text-anchor="middle">Citus Distributed Query Engine &amp; Cluster</text>

    <!-- 2.1 COORDINATOR NODE (Top) -->
    <g transform="translate(167, 50)">
      <rect width="560" height="165" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>

      <!-- Cylinder Icon (Cyan) -->
      <g transform="translate(258, 12)">
        <ellipse cx="22" cy="9" rx="20" ry="6" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <path d="M 2 9 L 2 29 A 20 6 0 0 0 42 29 L 42 9" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <path d="M 2 15 A 20 6 0 0 0 42 15" fill="none" stroke="#000000" stroke-width="1.4"/>
        <path d="M 2 22 A 20 6 0 0 0 42 22" fill="none" stroke="#000000" stroke-width="1.4"/>
        <ellipse cx="22" cy="9" rx="20" ry="6" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="280" y="68" class="txt-node-title" text-anchor="middle">Citus Coordinator Node</text>
      <text x="280" y="88" class="txt-node-sub" text-anchor="middle">citus_coordinator:5432 • Dual Planner Engine</text>

      <!-- Inner Planners: Router vs Adaptive -->
      <g transform="translate(20, 100)">
        <rect width="245" height="52" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
        <text x="122" y="22" class="txt-node-title" font-size="14.5" text-anchor="middle">Router Executor</text>
        <text x="122" y="41" class="txt-node-code" font-size="12" text-anchor="middle">WHERE tenant_id (Task: 1)</text>
      </g>

      <g transform="translate(295, 100)">
        <rect width="245" height="52" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
        <text x="122" y="22" class="txt-node-title" font-size="14.5" text-anchor="middle">Adaptive Executor</text>
        <text x="122" y="41" class="txt-node-code" font-size="12" text-anchor="middle">Scatter-Gather (Tasks: 32)</text>
      </g>
    </g>

    <!-- Connectors from Coordinator to Workers -->
    <!-- Line to Worker 1 -->
    <path d="M 340 215 L 266 295" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M 340 215 L 266 295" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(90, 240)">
      <rect width="205" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="102" y="19" class="txt-badge" text-anchor="middle">Parallel Shard Tasks (1..N)</text>
    </g>

    <!-- Line to Worker 2 -->
    <path d="M 565 215 L 639 295" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M 565 215 L 639 295" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(610, 240)">
      <rect width="205" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="102" y="19" class="txt-badge" text-anchor="middle">Parallel Shard Tasks (1..N)</text>
    </g>


    <!-- 2.2 WORKER NODE 1 -->
    <g transform="translate(30, 295)">
      <rect width="410" height="195" rx="14" fill="#ffefe0" stroke="#000000" stroke-width="2"/>

      <!-- Cylinder Icon (Yellow) -->
      <g transform="translate(185, 12)">
        <ellipse cx="20" cy="9" rx="18" ry="6" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 2 9 L 2 27 A 18 6 0 0 0 38 27 L 38 9" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 2 15 A 18 6 0 0 0 38 15" fill="none" stroke="#000000" stroke-width="1.4"/>
        <path d="M 2 21 A 18 6 0 0 0 38 21" fill="none" stroke="#000000" stroke-width="1.4"/>
        <ellipse cx="20" cy="9" rx="18" ry="6" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="205" y="66" class="txt-node-title" text-anchor="middle">Worker Node 1</text>
      <text x="205" y="86" class="txt-node-sub" text-anchor="middle">citus_worker_1:5432</text>

      <!-- Task Execution Inside Worker 1 -->
      <g transform="translate(18, 98)">
        <rect width="180" height="82" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
        <text x="90" y="24" class="txt-node-title" font-size="14.5" text-anchor="middle">Point Scan</text>
        <line x1="12" y1="34" x2="168" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="90" y="52" class="txt-node-sub" font-size="12.5" text-anchor="middle">orders_102008</text>
        <text x="90" y="70" class="txt-node-code" font-size="12" text-anchor="middle">Latency: ~1.2 ms</text>
      </g>

      <g transform="translate(212, 98)">
        <rect width="180" height="82" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
        <text x="90" y="24" class="txt-node-title" font-size="14.5" text-anchor="middle">Parallel Insert</text>
        <line x1="12" y1="34" x2="168" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="90" y="52" class="txt-node-sub" font-size="12.5" text-anchor="middle">Tenants 0, 2, 4, 6, 8</text>
        <text x="90" y="70" class="txt-node-code" font-size="12" text-anchor="middle">Thread Pool IO</text>
      </g>
    </g>

    <!-- 2.3 WORKER NODE 2 -->
    <g transform="translate(465, 295)">
      <rect width="410" height="195" rx="14" fill="#ffefe0" stroke="#000000" stroke-width="2"/>

      <!-- Cylinder Icon (Yellow) -->
      <g transform="translate(185, 12)">
        <ellipse cx="20" cy="9" rx="18" ry="6" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 2 9 L 2 27 A 18 6 0 0 0 38 27 L 38 9" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
        <path d="M 2 15 A 18 6 0 0 0 38 15" fill="none" stroke="#000000" stroke-width="1.4"/>
        <path d="M 2 21 A 18 6 0 0 0 38 21" fill="none" stroke="#000000" stroke-width="1.4"/>
        <ellipse cx="20" cy="9" rx="18" ry="6" fill="#facc15" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="205" y="66" class="txt-node-title" text-anchor="middle">Worker Node 2</text>
      <text x="205" y="86" class="txt-node-sub" text-anchor="middle">citus_worker_2:5432</text>

      <!-- Task Execution Inside Worker 2 -->
      <g transform="translate(18, 98)">
        <rect width="180" height="82" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
        <text x="90" y="24" class="txt-node-title" font-size="14.5" text-anchor="middle">Partial Count</text>
        <line x1="12" y1="34" x2="168" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="90" y="52" class="txt-node-sub" font-size="12.5" text-anchor="middle">orders_102009</text>
        <text x="90" y="70" class="txt-node-code" font-size="12" text-anchor="middle">Worker Aggregate</text>
      </g>

      <g transform="translate(212, 98)">
        <rect width="180" height="82" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
        <text x="90" y="24" class="txt-node-title" font-size="14.5" text-anchor="middle">Parallel Insert</text>
        <line x1="12" y1="34" x2="168" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="90" y="52" class="txt-node-sub" font-size="12.5" text-anchor="middle">Tenants 1, 3, 5, 7, 9</text>
        <text x="90" y="70" class="txt-node-code" font-size="12" text-anchor="middle">Thread Pool IO</text>
      </g>
    </g>

    <!-- Bottom Pill: Benchmark Performance -->
    <g transform="translate(215, 505)">
      <rect width="475" height="42" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
      <text x="237" y="27" class="txt-node-title" font-size="15.5" text-anchor="middle">Distributed Query Planning &amp; Write Benchmarking</text>
    </g>
  </g>
</svg>
