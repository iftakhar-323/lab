<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #000000; }
      .txt-box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #000000; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-body-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 800; fill: #000000; }
      .txt-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13.5px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 800; fill: #000000; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="620" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. CLIENT / OPERATOR ==================== -->
  <g transform="translate(35, 140)">
    <rect width="195" height="360" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <!-- User Icon -->
    <circle cx="97" cy="52" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 60 110 C 60 80, 134 80, 134 110" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="97" y="138" class="txt-title" text-anchor="middle">Operator</text>
    <text x="97" y="158" class="txt-node-sub" font-style="italic" text-anchor="middle">(Admin / Developer)</text>
    
    <!-- Access Tools Box -->
    <g transform="translate(15, 175)">
      <rect width="165" height="165" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="82" y="30" class="txt-body-bold" text-anchor="middle">Browser (HTTP)</text>
      <text x="82" y="52" class="txt-body" text-anchor="middle">Port 8080 (pgAdmin)</text>
      <line x1="15" y1="68" x2="150" y2="68" stroke="#000000" stroke-width="1"/>
      <text x="82" y="98" class="txt-body-bold" text-anchor="middle">psql / Docker CLI</text>
      <text x="82" y="120" class="txt-body" text-anchor="middle">Port 5432 (Coordinator)</text>
      <text x="82" y="142" class="txt-code" font-size="12" text-anchor="middle">citus-coordinator</text>
    </g>
  </g>

  <!-- ==================== 2. PGADMIN CONTAINER ==================== -->
  <g transform="translate(305, 90)">
    <rect width="195" height="290" rx="14" fill="#fffbeb" stroke="#000000" stroke-width="2"/>
    <text x="97" y="34" class="txt-node-title" text-anchor="middle">pgAdmin 4</text>
    <text x="97" y="56" class="txt-node-sub" text-anchor="middle">Web GUI Management</text>

    <!-- UI Feature Box -->
    <g transform="translate(15, 70)">
      <rect width="165" height="200" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="82" y="26" class="txt-body-bold" text-anchor="middle">Container: pgadmin</text>
      <text x="82" y="48" class="txt-body" text-anchor="middle">Image: pgadmin4:8.2</text>
      <line x1="12" y1="60" x2="153" y2="60" stroke="#000000" stroke-width="1"/>
      <text x="16" y="86" class="txt-body">• Cluster Visualizer</text>
      <text x="16" y="112" class="txt-body">• SQL Query Tool</text>
      <text x="16" y="138" class="txt-body">• Shard Inspection</text>
      <text x="16" y="164" class="txt-body">• Multi-Host Connect</text>
      <text x="16" y="188" class="txt-body-bold" font-size="12.5">• User: admin@poridhi</text>
    </g>
  </g>

  <!-- ==================== 3. CITUS CLUSTER (DOCKER COMPOSE) ==================== -->
  <g transform="translate(560, 25)">
    <rect width="670" height="590" rx="16" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="335" y="34" class="txt-title" text-anchor="middle">Citus Distributed Cluster (Docker Compose Network)</text>

    <!-- 3.1 COORDINATOR NODE (Top) -->
    <g transform="translate(45, 52)">
      <rect width="580" height="190" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder Icon (Cleanly separated in header) -->
      <g transform="translate(24, 16)">
        <ellipse cx="18" cy="10" rx="16" ry="6" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <path d="M 2 10 L 2 30 A 16 6 0 0 0 34 30 L 34 10" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <ellipse cx="18" cy="20" rx="16" ry="6" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3 2"/>
        <ellipse cx="18" cy="30" rx="16" ry="6" fill="none" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="70" y="32" class="txt-node-title">Citus Coordinator</text>
      <text x="70" y="52" class="txt-node-sub">Container: <tspan font-weight="800">citus_coordinator</tspan> | Port: <tspan font-weight="800">5432</tspan></text>

      <!-- Internal Components (Query Router & Metadata Catalog) -->
      <g transform="translate(18, 72)">
        <rect width="262" height="102" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="14" y="26" class="txt-box-title">Query Router</text>
        <line x1="12" y1="36" x2="250" y2="36" stroke="#000000" stroke-width="1"/>
        <text x="14" y="58" class="txt-body">• Distributed Planner</text>
        <text x="14" y="82" class="txt-body">• Shard Hash Engine</text>
      </g>
      <g transform="translate(300, 72)">
        <rect width="262" height="102" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="14" y="26" class="txt-box-title">Metadata Catalog</text>
        <line x1="12" y1="36" x2="250" y2="36" stroke="#000000" stroke-width="1"/>
        <text x="14" y="58" class="txt-body">• pg_dist_node (Workers)</text>
        <text x="14" y="82" class="txt-body">• citus_shards (Catalog)</text>
      </g>
    </g>

    <!-- Connector Lines from Coordinator to Workers -->
    <!-- Line to Worker 1 -->
    <path d="M 200 242 L 175 350" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- Line to Worker 2 -->
    <path d="M 470 242 L 495 350" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Connector Badges (Beside the lines, no obstruction) -->
    <g transform="translate(30, 276)">
      <rect width="155" height="32" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="77" y="21" class="txt-badge" text-anchor="middle">Shard Placements</text>
    </g>

    <g transform="translate(485, 276)">
      <rect width="155" height="32" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="77" y="21" class="txt-badge" text-anchor="middle">Parallel Execution</text>
    </g>

    <!-- 3.2 WORKER NODE 1 (Bottom Left) -->
    <g transform="translate(25, 350)">
      <rect width="300" height="215" rx="14" fill="#dcfce7" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder Icon (Cleanly separated in header) -->
      <g transform="translate(18, 16)">
        <ellipse cx="16" cy="9" rx="14" ry="5.5" fill="#bbf7d0" stroke="#000000" stroke-width="1.6"/>
        <path d="M 2 9 L 2 27 A 14 5.5 0 0 0 30 27 L 30 9" fill="#bbf7d0" stroke="#000000" stroke-width="1.6"/>
        <ellipse cx="16" cy="18" rx="14" ry="5.5" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2 2"/>
        <ellipse cx="16" cy="27" rx="14" ry="5.5" fill="none" stroke="#000000" stroke-width="1.6"/>
      </g>

      <text x="60" y="31" class="txt-node-title">Worker Node 1</text>
      <text x="60" y="51" class="txt-node-sub">citus_worker_1:5432</text>

      <!-- Data Shards Box (20px clear margin below cylinder!) -->
      <g transform="translate(14, 68)">
        <rect width="272" height="132" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="14" y="24" class="txt-box-title">Storage &amp; Physical Shards</text>
        <line x1="12" y1="34" x2="260" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="14" y="56" class="txt-code">• companies_102008</text>
        <text x="28" y="74" class="txt-body">(Hash partition: id % 2 = 0)</text>
        <text x="14" y="98" class="txt-body">• Local Index &amp; Constraints</text>
        <text x="14" y="120" class="txt-body-bold">• Local Query Executor</text>
      </g>
    </g>

    <!-- 3.3 WORKER NODE 2 (Bottom Right) -->
    <g transform="translate(345, 350)">
      <rect width="300" height="215" rx="14" fill="#dcfce7" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder Icon (Cleanly separated in header) -->
      <g transform="translate(18, 16)">
        <ellipse cx="16" cy="9" rx="14" ry="5.5" fill="#bbf7d0" stroke="#000000" stroke-width="1.6"/>
        <path d="M 2 9 L 2 27 A 14 5.5 0 0 0 30 27 L 30 9" fill="#bbf7d0" stroke="#000000" stroke-width="1.6"/>
        <ellipse cx="16" cy="18" rx="14" ry="5.5" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2 2"/>
        <ellipse cx="16" cy="27" rx="14" ry="5.5" fill="none" stroke="#000000" stroke-width="1.6"/>
      </g>

      <text x="60" y="31" class="txt-node-title">Worker Node 2</text>
      <text x="60" y="51" class="txt-node-sub">citus_worker_2:5432</text>

      <!-- Data Shards Box (20px clear margin below cylinder!) -->
      <g transform="translate(14, 68)">
        <rect width="272" height="132" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="14" y="24" class="txt-box-title">Storage &amp; Physical Shards</text>
        <line x1="12" y1="34" x2="260" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="14" y="56" class="txt-code">• companies_102009</text>
        <text x="28" y="74" class="txt-body">(Hash partition: id % 2 = 1)</text>
        <text x="14" y="98" class="txt-body">• Local Index &amp; Constraints</text>
        <text x="14" y="120" class="txt-body-bold">• Local Query Executor</text>
      </g>
    </g>

  </g>

  <!-- ==================== 4. INTER-CONTAINER FLOWS ==================== -->
  <!-- Flow: Operator -> pgAdmin (Top) -->
  <path d="M 230 200 L 305 200" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="267" y="190" class="txt-arrow-label" text-anchor="middle">Port 8080</text>

  <!-- Flow: Operator -> Coordinator CLI (Bottom) -->
  <path d="M 230 420 L 560 420" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="330" y="406" width="130" height="26" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="395" y="423" class="txt-arrow-label" font-size="12.5" text-anchor="middle">Port 5432 / psql</text>

  <!-- Flow: pgAdmin -> Citus Coordinator (Crosses into Coordinator) -->
  <path d="M 500 200 L 605 200" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="522" y="186" width="76" height="26" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="560" y="203" class="txt-arrow-label" font-size="12" text-anchor="middle">SQL :5432</text>
</svg>
