<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #334155; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; font-weight: 700; fill: #000000; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="600" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. CLIENT / USER ==================== -->
  <g transform="translate(40, 160)">
    <rect width="180" height="280" rx="12" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <!-- User Icon -->
    <circle cx="90" cy="50" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 55 105 C 55 78, 125 78, 125 105" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="90" y="132" class="txt-title" text-anchor="middle">Operator</text>
    <text x="90" y="152" class="txt-node-sub" font-style="italic" font-weight="600" text-anchor="middle">(Admin / Developer)</text>
    
    <!-- Access Tools Box -->
    <g transform="translate(15, 170)">
      <rect width="150" height="92" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="75" y="22" class="txt-node-code" font-weight="700" text-anchor="middle">Browser (HTTP)</text>
      <text x="75" y="42" class="txt-node-sub" font-size="11" text-anchor="middle">Port 8080 (pgAdmin)</text>
      <text x="75" y="64" class="txt-node-code" font-weight="700" text-anchor="middle">psql / Docker CLI</text>
      <text x="75" y="82" class="txt-node-sub" font-size="11" text-anchor="middle">Port 5432 (Coordinator)</text>
    </g>
  </g>

  <!-- ==================== 2. PGADMIN CONTAINER ==================== -->
  <g transform="translate(310, 80)">
    <rect width="180" height="240" rx="12" fill="#fffbeb" stroke="#000000" stroke-width="2"/>
    <text x="90" y="32" class="txt-node-title" text-anchor="middle">pgAdmin 4</text>
    <text x="90" y="52" class="txt-node-sub" text-anchor="middle">Web GUI Management</text>

    <!-- UI Feature Box -->
    <g transform="translate(15, 65)">
      <rect width="150" height="155" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="75" y="24" class="txt-node-code" font-weight="700" text-anchor="middle">Container: pgadmin</text>
      <text x="75" y="44" class="txt-node-sub" text-anchor="middle">Image: pgadmin4:8.2</text>
      <line x1="10" y1="54" x2="140" y2="54" stroke="#e2e8f0" stroke-width="1"/>
      <text x="15" y="74" class="txt-node-sub">• Cluster Visualizer</text>
      <text x="15" y="94" class="txt-node-sub">• SQL Query Tool</text>
      <text x="15" y="114" class="txt-node-sub">• Shard Inspection</text>
      <text x="15" y="134" class="txt-node-sub">• User: admin@poridhi</text>
    </g>
  </g>

  <!-- ==================== 3. CITUS CLUSTER (DOCKER COMPOSE) ==================== -->
  <g transform="translate(530, 30)">
    <rect width="695" height="555" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="347" y="32" class="txt-title" text-anchor="middle">Citus Distributed Cluster (Docker Compose Network)</text>

    <!-- 3.1 COORDINATOR NODE (Top) -->
    <g transform="translate(100, 50)">
      <rect width="495" height="175" rx="12" fill="#ffeaea" stroke="#000000" stroke-width="2"/>

      <!-- Cylinder Icon -->
      <g transform="translate(25, 45)">
        <ellipse cx="25" cy="15" rx="22" ry="10" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 15 L 3 65 A 22 10 0 0 0 47 65 L 47 15" fill="#a5f3fc" stroke="#000000" stroke-width="1.8"/>
        <ellipse cx="25" cy="40" rx="22" ry="10" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3 2"/>
        <ellipse cx="25" cy="65" rx="22" ry="10" fill="none" stroke="#000000" stroke-width="1.8"/>
      </g>

      <text x="90" y="42" class="txt-node-title">Citus Coordinator</text>
      <text x="90" y="62" class="txt-node-sub">Container: <tspan font-weight="700">citus_coordinator</tspan> | Port: 5432</text>

      <!-- Internal Components -->
      <g transform="translate(90, 78)">
        <rect width="185" height="78" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="12" y="22" class="txt-node-code" font-weight="700">Query Router</text>
        <text x="12" y="42" class="txt-node-sub">• Distributed Planner</text>
        <text x="12" y="62" class="txt-node-sub">• Shard Hash Engine</text>
      </g>
      <g transform="translate(285, 78)">
        <rect width="195" height="78" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="12" y="22" class="txt-node-code" font-weight="700">Metadata Catalog</text>
        <text x="12" y="42" class="txt-node-sub">• pg_dist_node</text>
        <text x="12" y="62" class="txt-node-sub">• citus_shards (catalog)</text>
      </g>
    </g>

    <!-- Connector Lines from Coordinator to Workers -->
    <!-- Line to Worker 1 -->
    <path d="M 230 225 L 180 330" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- Line to Worker 2 -->
    <path d="M 465 225 L 515 330" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Connector Badges (Placed BESIDE the lines with clear margin, zero collision) -->
    <g transform="translate(42, 258)">
      <rect width="145" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="72" y="18" class="txt-badge" text-anchor="middle">Shard Placements</text>
    </g>

    <g transform="translate(520, 258)">
      <rect width="145" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="72" y="18" class="txt-badge" text-anchor="middle">Parallel Execution</text>
    </g>

    <!-- 3.2 WORKER NODE 1 (Bottom Left) -->
    <g transform="translate(25, 330)">
      <rect width="310" height="200" rx="12" fill="#dcfce7" stroke="#000000" stroke-width="2"/>

      <!-- Cylinder Icon -->
      <g transform="translate(18, 20)">
        <ellipse cx="20" cy="12" rx="18" ry="8" fill="#bbf7d0" stroke="#000000" stroke-width="1.5"/>
        <path d="M 2 12 L 2 52 A 18 8 0 0 0 38 52 L 38 12" fill="#bbf7d0" stroke="#000000" stroke-width="1.5"/>
        <ellipse cx="20" cy="32" rx="18" ry="8" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2 2"/>
        <ellipse cx="20" cy="52" rx="18" ry="8" fill="none" stroke="#000000" stroke-width="1.5"/>
      </g>

      <text x="68" y="32" class="txt-node-title">Worker Node 1</text>
      <text x="68" y="52" class="txt-node-sub">citus_worker_1:5432</text>

      <!-- Data Shards Box -->
      <g transform="translate(15, 80)">
        <rect width="280" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="12" y="24" class="txt-node-code" font-weight="700">Storage &amp; Physical Shards</text>
        <line x1="10" y1="34" x2="270" y2="34" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="54" class="txt-node-code">• companies_102008 (id % 2 = 0)</text>
        <text x="12" y="74" class="txt-node-code">• Local Index &amp; Constraints</text>
        <text x="12" y="94" class="txt-node-sub">Local PostgreSQL Query Worker</text>
      </g>
    </g>

    <!-- 3.3 WORKER NODE 2 (Bottom Right) -->
    <g transform="translate(360, 330)">
      <rect width="310" height="200" rx="12" fill="#dcfce7" stroke="#000000" stroke-width="2"/>

      <!-- Cylinder Icon -->
      <g transform="translate(18, 20)">
        <ellipse cx="20" cy="12" rx="18" ry="8" fill="#bbf7d0" stroke="#000000" stroke-width="1.5"/>
        <path d="M 2 12 L 2 52 A 18 8 0 0 0 38 52 L 38 12" fill="#bbf7d0" stroke="#000000" stroke-width="1.5"/>
        <ellipse cx="20" cy="32" rx="18" ry="8" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2 2"/>
        <ellipse cx="20" cy="52" rx="18" ry="8" fill="none" stroke="#000000" stroke-width="1.5"/>
      </g>

      <text x="68" y="32" class="txt-node-title">Worker Node 2</text>
      <text x="68" y="52" class="txt-node-sub">citus_worker_2:5432</text>

      <!-- Data Shards Box -->
      <g transform="translate(15, 80)">
        <rect width="280" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="12" y="24" class="txt-node-code" font-weight="700">Storage &amp; Physical Shards</text>
        <line x1="10" y1="34" x2="270" y2="34" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="54" class="txt-node-code">• companies_102009 (id % 2 = 1)</text>
        <text x="12" y="74" class="txt-node-code">• Local Index &amp; Constraints</text>
        <text x="12" y="94" class="txt-node-sub">Local PostgreSQL Query Worker</text>
      </g>
    </g>

  </g>

  <!-- ==================== 4. INTER-CONTAINER FLOWS ==================== -->
  <!-- Flow: Client -> pgAdmin (Top) -->
  <path d="M 220 200 L 310 200" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="265" y="190" class="txt-arrow-label" text-anchor="middle">Port 8080</text>

  <!-- Flow: Client -> Coordinator CLI (Bottom) -->
  <path d="M 220 370 L 530 370" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="375" y="360" class="txt-arrow-label" text-anchor="middle">Port 5432 / psql</text>

  <!-- Flow: pgAdmin -> Citus Coordinator -->
  <path d="M 490 200 L 630 200" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="522" y="186" width="76" height="24" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="560" y="202" class="txt-arrow-label" font-size="11" text-anchor="middle">SQL :5432</text>
</svg>
