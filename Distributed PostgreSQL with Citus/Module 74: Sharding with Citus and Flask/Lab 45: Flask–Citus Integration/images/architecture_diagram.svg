<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #334155; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #000000; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1220" height="580" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. USER / CLIENT ==================== -->
  <g transform="translate(45, 175)">
    <rect width="160" height="225" rx="12" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <!-- User Icon -->
    <circle cx="80" cy="50" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 45 105 C 45 78, 115 78, 115 105" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="80" y="136" class="txt-title" text-anchor="middle">User</text>
    <text x="80" y="158" class="txt-node-sub" font-style="italic" font-weight="600" text-anchor="middle">(Web / App Client)</text>
    
    <rect x="18" y="176" width="124" height="26" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="80" y="193" class="txt-node-code" text-anchor="middle">cURL / Browser</text>
  </g>

  <!-- Flow: User <-> Web App -->
  <!-- Request Arrow (Top) -->
  <path d="M 205 250 L 305 250" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="255" y="240" class="txt-arrow-label" text-anchor="middle">API Request</text>

  <!-- Response Arrow (Bottom) -->
  <path d="M 305 320 L 205 320" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="255" y="342" class="txt-arrow-label" text-anchor="middle">Response</text>


  <!-- ==================== 2. WEB APPLICATION BACKEND ==================== -->
  <g transform="translate(310, 115)">
    <rect width="265" height="345" rx="12" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="132" y="36" class="txt-node-title" text-anchor="middle">Web Application Backend</text>
    <text x="132" y="58" class="txt-node-sub" font-weight="700" text-anchor="middle">Flask Application</text>

    <!-- Layers / Stack items inside Flask App -->
    <g transform="translate(18, 75)">
      <rect width="229" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="114" y="25" class="txt-node-title" font-size="14" text-anchor="middle">Poridhi Load Balancer</text>
      <text x="114" y="46" class="txt-node-code" text-anchor="middle">Public URL: *.lb.poridhi.io</text>
    </g>

    <g transform="translate(18, 150)">
      <rect width="229" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="114" y="25" class="txt-node-title" font-size="15" text-anchor="middle">Flask API Server</text>
      <text x="114" y="45" class="txt-node-sub" text-anchor="middle">Port 5000 • Host 0.0.0.0</text>
      <text x="114" y="62" class="txt-node-code" text-anchor="middle">GET / &amp; POST /events</text>
    </g>

    <g transform="translate(18, 235)">
      <rect width="229" height="65" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="114" y="24" class="txt-node-title" font-size="14" text-anchor="middle">SQLAlchemy + psycopg2</text>
      <text x="114" y="45" class="txt-node-code" font-size="11" text-anchor="middle">postgresql://citus:...@5432</text>
    </g>
  </g>

  <!-- Flow: Web App <-> Citus Cluster -->
  <!-- SQL Queries Arrow (Top) -->
  <path d="M 575 250 L 685 250" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="630" y="240" class="txt-arrow-label" text-anchor="middle">SQL Queries</text>

  <!-- Query Results Arrow (Bottom) -->
  <path d="M 685 320 L 575 320" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="630" y="342" class="txt-arrow-label" text-anchor="middle">Query Results</text>


  <!-- ==================== 3. CITUS DATABASE CLUSTER ==================== -->
  <g transform="translate(690, 45)">
    <!-- Cluster Big Boundary -->
    <rect width="510" height="505" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="255" y="38" class="txt-title" text-anchor="middle">Citus Database Cluster</text>

    <!-- 3.1 COORDINATOR NODE (Top Center) -->
    <g transform="translate(135, 60)">
      <rect width="240" height="145" rx="12" fill="#ffeaea" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder (Cyan) -->
      <g transform="translate(95, 14)">
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <path d="M 3 10 L 3 32 A 22 7 0 0 0 47 32 L 47 10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <path d="M 3 17 A 22 7 0 0 0 47 17" fill="none" stroke="#0284c7" stroke-width="1.8"/>
        <path d="M 3 24 A 22 7 0 0 0 47 24" fill="none" stroke="#0284c7" stroke-width="1.8"/>
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      </g>

      <text x="120" y="80" class="txt-node-title" text-anchor="middle">Coordinator Node</text>
      <text x="120" y="100" class="txt-node-sub" text-anchor="middle">citus_coordinator:5432</text>
      <text x="120" y="120" class="txt-node-code" text-anchor="middle">create_distributed_table()</text>
      <text x="120" y="134" class="txt-node-sub" font-size="11" text-anchor="middle">Metadata Catalog &amp; Routing</text>
    </g>

    <!-- Connectors: Coordinator -> Workers -->
    <!-- Line to Worker 1 -->
    <path d="M 210 205 L 120 280" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

    <!-- Line to Worker 2 -->
    <path d="M 300 205 L 390 280" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>


    <!-- 3.2 WORKER NODE 1 -->
    <g transform="translate(20, 285)">
      <rect width="220" height="145" rx="12" fill="#ffefe0" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder (Golden Yellow) -->
      <g transform="translate(85, 14)">
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="2"/>
        <path d="M 3 10 L 3 32 A 22 7 0 0 0 47 32 L 47 10" fill="#facc15" stroke="#000000" stroke-width="2"/>
        <path d="M 3 17 A 22 7 0 0 0 47 17" fill="none" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 24 A 22 7 0 0 0 47 24" fill="none" stroke="#000000" stroke-width="1.8"/>
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="2"/>
      </g>

      <text x="110" y="78" class="txt-node-title" text-anchor="middle">Worker Node 1</text>
      <text x="110" y="98" class="txt-node-sub" text-anchor="middle">citus_worker_1:5432</text>
      <text x="110" y="118" class="txt-node-code" text-anchor="middle">events_102008 Shard</text>
      <text x="110" y="133" class="txt-node-sub" font-size="11" text-anchor="middle">Distributed Partition Storage</text>
    </g>

    <!-- 3.3 WORKER NODE 2 -->
    <g transform="translate(270, 285)">
      <rect width="220" height="145" rx="12" fill="#ffefe0" stroke="#000000" stroke-width="2"/>

      <!-- Database Cylinder (Golden Yellow) -->
      <g transform="translate(85, 14)">
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="2"/>
        <path d="M 3 10 L 3 32 A 22 7 0 0 0 47 32 L 47 10" fill="#facc15" stroke="#000000" stroke-width="2"/>
        <path d="M 3 17 A 22 7 0 0 0 47 17" fill="none" stroke="#000000" stroke-width="1.8"/>
        <path d="M 3 24 A 22 7 0 0 0 47 24" fill="none" stroke="#000000" stroke-width="1.8"/>
        <ellipse cx="25" cy="10" rx="22" ry="7" fill="#facc15" stroke="#000000" stroke-width="2"/>
      </g>

      <text x="110" y="78" class="txt-node-title" text-anchor="middle">Worker Node 2</text>
      <text x="110" y="98" class="txt-node-sub" text-anchor="middle">citus_worker_2:5432</text>
      <text x="110" y="118" class="txt-node-code" text-anchor="middle">events_102009 Shard</text>
      <text x="110" y="133" class="txt-node-sub" font-size="11" text-anchor="middle">Distributed Partition Storage</text>
    </g>

    <!-- Bottom Pill: Horizontal Scalability -->
    <g transform="translate(45, 450)">
      <rect width="420" height="40" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
      <text x="210" y="26" class="txt-node-title" font-size="16" text-anchor="middle">Horizontal Scalability &amp; Distributed Sharding</text>
    </g>
  </g>
</svg>