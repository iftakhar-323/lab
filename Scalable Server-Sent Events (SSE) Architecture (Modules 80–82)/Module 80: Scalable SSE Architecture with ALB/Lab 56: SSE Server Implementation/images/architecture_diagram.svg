<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 800; fill: #000000; }

      /* Live Flow Animations */
      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. CLIENT TIER ==================== -->
  <g transform="translate(45, 120)">
    <rect width="230" height="420" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <!-- User Icon -->
    <circle cx="115" cy="48" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 83 98 C 83 72, 147 72, 147 98" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="115" y="125" class="txt-title" text-anchor="middle">Client Tier</text>
    <text x="115" y="146" class="txt-node-sub" font-style="italic" text-anchor="middle">(Event Consumers)</text>
    
    <!-- Browser Client Box -->
    <g transform="translate(18, 165)">
      <rect width="194" height="110" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="97" y="24" class="txt-node-title" font-size="15" text-anchor="middle">Browser Web Client</text>
      <line x1="12" y1="34" x2="182" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="97" y="54" class="txt-node-code" text-anchor="middle">new EventSource('/events')</text>
      <text x="97" y="74" class="txt-node-sub" text-anchor="middle">• HTML5 DOM Updates</text>
      <text x="97" y="94" class="txt-node-sub" text-anchor="middle">• Auto-reconnection</text>
    </g>

    <!-- CLI Client Box -->
    <g transform="translate(18, 290)">
      <rect width="194" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="97" y="24" class="txt-node-title" font-size="15" text-anchor="middle">curl CLI Diagnostic</text>
      <line x1="12" y1="34" x2="182" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="97" y="54" class="txt-node-code" text-anchor="middle">curl -N /events</text>
      <text x="97" y="74" class="txt-node-sub" text-anchor="middle">• Unbuffered Output</text>
      <text x="97" y="94" class="txt-node-sub" text-anchor="middle">• Raw Chunked Stream</text>
    </g>
  </g>

  <!-- Flow: Client -> Server Handshake -->
  <path d="M 275 240 L 375 240" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 275 240 L 375 240" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="325" y="230" class="txt-arrow-label" text-anchor="middle">GET /events</text>

  <!-- Return Stream (Bottom Arrow) -->
  <path d="M 375 325 L 275 325" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 375 325 L 275 325" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="325" y="348" class="txt-arrow-label" text-anchor="middle">SSE Stream</text>


  <!-- ==================== 2. FASTAPI STREAMING SERVER ==================== -->
  <g transform="translate(375, 80)">
    <rect width="360" height="460" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="180" y="32" class="txt-title" text-anchor="middle">FastAPI Application Server</text>
    <text x="180" y="52" class="txt-node-sub" font-weight="700" text-anchor="middle">Uvicorn Asynchronous Runtime (Port 8000)</text>

    <!-- Sub-Box 1: Streaming Response Pipeline -->
    <g transform="translate(18, 68)">
      <rect width="324" height="115" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="162" y="24" class="txt-node-title" font-size="15" text-anchor="middle">StreamingResponse Pipeline</text>
      <line x1="15" y1="34" x2="309" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="16" y="55" class="txt-node-code">Content-Type: text/event-stream</text>
      <text x="16" y="75" class="txt-node-code">Cache-Control: no-cache, no-transform</text>
      <text x="16" y="95" class="txt-node-code">Connection: keep-alive | X-Accel-Buffering: no</text>
    </g>

    <!-- Sub-Box 2: Async Event Generator -->
    <g transform="translate(18, 198)">
      <rect width="324" height="115" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="162" y="24" class="txt-node-title" font-size="15" text-anchor="middle">Async Generator (event_stream)</text>
      <line x1="15" y1="34" x2="309" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="16" y="55" class="txt-node-sub">• Non-blocking <tspan class="txt-node-code">asyncio.sleep(2.0)</tspan></text>
      <text x="16" y="75" class="txt-node-sub">• Yields formatted <tspan class="txt-node-code">data: {...}\n\n</tspan></text>
      <text x="16" y="95" class="txt-node-sub">• Emits periodic <tspan class="txt-node-code">: ping\n\n</tspan> heartbeats</text>
    </g>

    <!-- Sub-Box 3: Connection Registry and Health -->
    <g transform="translate(18, 328)">
      <rect width="324" height="115" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="162" y="24" class="txt-node-title" font-size="15" text-anchor="middle">Connection Tracking &amp; Health</text>
      <line x1="15" y1="34" x2="309" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="16" y="55" class="txt-node-sub">• <tspan class="txt-node-code">request.is_disconnected()</tspan> detection</text>
      <text x="16" y="75" class="txt-node-sub">• Active client counter tracking</text>
      <text x="16" y="95" class="txt-node-code">GET /health &#8594; {"status":"healthy"}</text>
    </g>
  </g>

  <!-- Flow: FastAPI Server <-> Event Source Engine -->
  <path d="M 735 250 L 835 250" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 735 250 L 835 250" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="785" y="240" class="txt-arrow-label" text-anchor="middle">Event Dispatch</text>

  <path d="M 835 320 L 735 320" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 835 320 L 735 320" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="785" y="342" class="txt-arrow-label" text-anchor="middle">Keep-Alives</text>


  <!-- ==================== 3. EVENT STREAM ENGINE ==================== -->
  <g transform="translate(835, 80)">
    <rect width="380" height="460" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    
    <text x="190" y="32" class="txt-title" text-anchor="middle">SSE Event Engine</text>
    <text x="190" y="52" class="txt-node-sub" font-weight="700" text-anchor="middle">Wire Protocol Framing &amp; Telemetry</text>

    <!-- Wire Framing Box -->
    <g transform="translate(20, 68)">
      <rect width="340" height="150" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="170" y="24" class="txt-node-title" font-size="15" text-anchor="middle">SSE Wire Protocol Frame</text>
      <line x1="15" y1="34" x2="325" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="16" y="56" class="txt-node-code">retry: 3000\n\n</text>
      <text x="16" y="76" class="txt-node-code">id: 42\n</text>
      <text x="16" y="96" class="txt-node-code">event: server_telemetry\n</text>
      <text x="16" y="116" class="txt-node-code">data: {"cpu": 34.2, "mem": 62.8}\n\n</text>
      <text x="16" y="136" class="txt-node-code">: keep-alive heartbeat\n\n</text>
    </g>

    <!-- Event Lifecycle Box -->
    <g transform="translate(20, 232)">
      <rect width="340" height="200" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="170" y="24" class="txt-node-title" font-size="15" text-anchor="middle">Connection Lifecycle</text>
      <line x1="15" y1="34" x2="325" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="16" y="56" class="txt-node-sub">1. HTTP Handshake &#8594; Upgraded to Stream</text>
      <text x="16" y="80" class="txt-node-sub">2. Infinite chunked transfer response</text>
      <text x="16" y="104" class="txt-node-sub">3. Unbuffered TCP delivery to client</text>
      <text x="16" y="128" class="txt-node-sub">4. NAT/Proxy socket kept alive via pings</text>
      <text x="16" y="152" class="txt-node-sub">5. Client disconnect &#8594; Task cleaned up</text>
      <text x="16" y="176" class="txt-node-code">Automatic browser reconnects on drop</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SUMMARY PILL ==================== -->
  <g transform="translate(260, 560)">
    <rect width="740" height="42" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="370" y="27" class="txt-node-title" font-size="16" text-anchor="middle">Server-Sent Events (SSE) Unidirectional HTTP Streaming Architecture</text>
  </g>
</svg>
