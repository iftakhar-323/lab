<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #4b5563; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #111827; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Diagram Title -->
  <text x="630" y="48" class="txt-title" text-anchor="middle">Lab 56: Server-Sent Events (SSE) Architecture</text>

  <!-- ==================== 1. CLIENT TIER ==================== -->
  <g transform="translate(60, 95)">
    <rect width="250" height="430" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    <text x="125" y="42" class="txt-node-title" text-anchor="middle">Clients</text>
    <text x="125" y="66" class="txt-node-sub" text-anchor="middle">Subscribers</text>

    <!-- Browser Client Card -->
    <rect x="20" y="95" width="210" height="135" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <circle cx="125" cy="122" r="15" fill="#eaf8ff" stroke="#000000" stroke-width="1.5"/>
    <path d="M 106 148 C 106 136, 144 136, 144 148" fill="#eaf8ff" stroke="#000000" stroke-width="1.5"/>
    <text x="125" y="172" class="txt-node-title" font-size="15" text-anchor="middle">Web Browser</text>
    <rect x="35" y="186" width="140" height="26" rx="6" fill="#effff1" stroke="#000000" stroke-width="1"/>
    <text x="105" y="203" class="txt-node-code" font-size="11" text-anchor="middle">EventSource('/events')</text>

    <!-- CLI Client Card -->
    <rect x="20" y="255" width="210" height="135" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="105" y="270" width="40" height="26" rx="4" fill="#ffefe0" stroke="#000000" stroke-width="1.5"/>
    <text x="125" y="288" class="txt-node-code" font-size="13" text-anchor="middle">&gt;_</text>
    <text x="125" y="328" class="txt-node-title" font-size="15" text-anchor="middle">CLI / Terminal</text>
    <rect x="35" y="342" width="140" height="26" rx="6" fill="#effff1" stroke="#000000" stroke-width="1"/>
    <text x="105" y="359" class="txt-node-code" font-size="11" text-anchor="middle">curl -N /events</text>
  </g>

  <!-- Connectors: Client <-> Server -->
  <!-- HTTP Request (Top) -->
  <path d="M 310 240 L 480 240" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 310 240 L 480 240" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <g transform="translate(335, 205)">
    <rect width="120" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="60" y="19" class="txt-node-code" text-anchor="middle">GET /events</text>
  </g>

  <!-- Persistent SSE Stream (Bottom) -->
  <path d="M 480 370 L 310 370" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 480 370 L 310 370" fill="none" stroke="#059669" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)"/>
  <g transform="translate(330, 335)">
    <rect width="130" height="28" rx="6" fill="#d4f6d9" stroke="#000000" stroke-width="1.2"/>
    <text x="65" y="19" class="txt-badge" text-anchor="middle">Live SSE Stream</text>
  </g>

  <!-- ==================== 2. FASTAPI SERVER ==================== -->
  <g transform="translate(480, 95)">
    <rect width="320" height="430" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    <text x="160" y="42" class="txt-node-title" text-anchor="middle">FastAPI Server</text>
    <text x="160" y="66" class="txt-node-sub" text-anchor="middle">Uvicorn ASGI Engine (Port 8000)</text>

    <!-- SSE Route Card -->
    <rect x="25" y="95" width="270" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="160" y="125" class="txt-node-title" font-size="16" text-anchor="middle">Endpoint: /events</text>
    
    <rect x="40" y="140" width="240" height="32" rx="6" fill="#ffeaea" stroke="#000000" stroke-width="1.2"/>
    <text x="160" y="161" class="txt-node-code" text-anchor="middle">StreamingResponse(generator)</text>

    <rect x="40" y="185" width="240" height="32" rx="6" fill="#eaf8ff" stroke="#000000" stroke-width="1.2"/>
    <text x="160" y="206" class="txt-node-code" text-anchor="middle">Content-Type: text/event-stream</text>

    <!-- Key Server Rules Card -->
    <rect x="25" y="255" width="270" height="145" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="160" y="285" class="txt-node-title" font-size="15" text-anchor="middle">Streaming Headers</text>
    
    <text x="45" y="315" class="txt-node-sub">&#8226; Cache-Control: no-cache</text>
    <text x="45" y="342" class="txt-node-sub">&#8226; Connection: keep-alive</text>
    <text x="45" y="370" class="txt-node-sub">&#8226; X-Accel-Buffering: no (Direct)</text>
  </g>

  <!-- Connectors: Server <-> Event Generator -->
  <path d="M 800 240 L 910 240" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 800 240 L 910 240" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="855" y="230" class="txt-arrow-label" text-anchor="middle">Iterate</text>

  <path d="M 910 370 L 800 370" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 910 370 L 800 370" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="855" y="360" class="txt-arrow-label" text-anchor="middle">yield frame</text>

  <!-- ==================== 3. ASYNC EVENT GENERATOR ==================== -->
  <g transform="translate(910, 95)">
    <rect width="290" height="430" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="145" y="42" class="txt-node-title" text-anchor="middle">Event Generator</text>
    <text x="145" y="66" class="txt-node-sub" text-anchor="middle">Async Generator Loop</text>

    <!-- Async Loop Card -->
    <rect x="20" y="95" width="250" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="145" y="125" class="txt-node-code" font-size="13" text-anchor="middle">async def event_generator()</text>
    <text x="35" y="155" class="txt-node-code">&#8226; while True:</text>
    <text x="45" y="180" class="txt-node-code">    yield f"data: {json}\n\n"</text>
    <text x="45" y="205" class="txt-node-code">    await asyncio.sleep(1)</text>

    <!-- Generator Feature Card -->
    <rect x="20" y="255" width="250" height="145" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="145" y="285" class="txt-node-title" font-size="15" text-anchor="middle">Core Features</text>
    <text x="35" y="315" class="txt-node-sub">&#8226; Non-blocking asyncio stream</text>
    <text x="35" y="342" class="txt-node-sub">&#8226; Detects client disconnect</text>
    <text x="35" y="370" class="txt-node-sub">&#8226; Zero thread overhead</text>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(180, 545)">
    <rect width="900" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="450" y="31" class="txt-badge" font-size="14" text-anchor="middle">Architecture Summary: Client connects via GET /events &#8226; Server holds HTTP connection open &#8226; Pushes live events</text>
  </g>
</svg>
