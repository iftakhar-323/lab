<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #4b5563; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #111827; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Diagram Title -->
  <text x="630" y="48" class="txt-title" text-anchor="middle">SSE Wire Protocol and Automatic Reconnection</text>

  <!-- ==================== TOP: 4 PROTOCOL FIELDS ==================== -->
  <g transform="translate(60, 80)">
    <rect width="1140" height="190" rx="14" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <text x="570" y="34" class="txt-node-title" text-anchor="middle">The 4 Standard SSE Wire Fields</text>

    <!-- 1. event -->
    <g transform="translate(30, 55)">
      <rect width="250" height="110" rx="10" fill="#eaf8ff" stroke="#000000" stroke-width="1.5"/>
      <text x="125" y="32" class="txt-node-code" font-size="16" text-anchor="middle">event: &lt;name&gt;</text>
      <text x="125" y="62" class="txt-node-sub" text-anchor="middle">Custom event type</text>
      <rect x="25" y="75" width="200" height="24" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="125" y="91" class="txt-node-code" font-size="11" text-anchor="middle">e.g. event: alert</text>
    </g>

    <!-- 2. data -->
    <g transform="translate(310, 55)">
      <rect width="250" height="110" rx="10" fill="#effff1" stroke="#000000" stroke-width="1.5"/>
      <text x="125" y="32" class="txt-node-code" font-size="16" text-anchor="middle">data: &lt;payload&gt;</text>
      <text x="125" y="62" class="txt-node-sub" text-anchor="middle">Message content (JSON/text)</text>
      <rect x="25" y="75" width="200" height="24" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="125" y="91" class="txt-node-code" font-size="11" text-anchor="middle">e.g. data: {"temp": 25}</text>
    </g>

    <!-- 3. id -->
    <g transform="translate(590, 55)">
      <rect width="250" height="110" rx="10" fill="#ebeaff" stroke="#000000" stroke-width="1.5"/>
      <text x="125" y="32" class="txt-node-code" font-size="16" text-anchor="middle">id: &lt;message_id&gt;</text>
      <text x="125" y="62" class="txt-node-sub" text-anchor="middle">Unique identifier for tracking</text>
      <rect x="25" y="75" width="200" height="24" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="125" y="91" class="txt-node-code" font-size="11" text-anchor="middle">e.g. id: 101</text>
    </g>

    <!-- 4. retry -->
    <g transform="translate(870, 55)">
      <rect width="240" height="110" rx="10" fill="#fffbe8" stroke="#000000" stroke-width="1.5"/>
      <text x="120" y="32" class="txt-node-code" font-size="16" text-anchor="middle">retry: &lt;milliseconds&gt;</text>
      <text x="120" y="62" class="txt-node-sub" text-anchor="middle">Client reconnect delay</text>
      <rect x="20" y="75" width="200" height="24" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="120" y="91" class="txt-node-code" font-size="11" text-anchor="middle">e.g. retry: 3000</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: 3-STEP RECONNECTION LIFECYCLE ==================== -->
  <g transform="translate(60, 300)">
    <rect width="1140" height="225" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    <text x="570" y="36" class="txt-node-title" text-anchor="middle">Built-in Auto-Reconnection Lifecycle (Zero Custom Code Needed)</text>

    <!-- Step 1 Card -->
    <g transform="translate(40, 60)">
      <rect width="300" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <rect x="15" y="15" width="70" height="24" rx="12" fill="#eaf8ff" stroke="#000000" stroke-width="1"/>
      <text x="50" y="31" class="txt-badge" font-size="12" text-anchor="middle">Step 1</text>
      <text x="150" y="68" class="txt-node-title" font-size="16" text-anchor="middle">Active Streaming</text>
      <text x="150" y="95" class="txt-node-sub" text-anchor="middle">Server sends frame:</text>
      <rect x="25" y="105" width="250" height="24" rx="6" fill="#f1f5f9" stroke="#000000" stroke-width="1"/>
      <text x="150" y="121" class="txt-node-code" font-size="11" text-anchor="middle">id: 101 \n data: "ok"</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 355 130 L 420 130" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 355 130 L 420 130" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>

    <!-- Step 2 Card -->
    <g transform="translate(435, 60)">
      <rect width="300" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <rect x="15" y="15" width="70" height="24" rx="12" fill="#ffeaea" stroke="#000000" stroke-width="1"/>
      <text x="50" y="31" class="txt-badge" font-size="12" text-anchor="middle">Step 2</text>
      <text x="150" y="68" class="txt-node-title" font-size="16" text-anchor="middle">Network Drop</text>
      <text x="150" y="95" class="txt-node-sub" text-anchor="middle">Connection is interrupted</text>
      <rect x="25" y="105" width="250" height="24" rx="6" fill="#ffeaea" stroke="#000000" stroke-width="1"/>
      <text x="150" y="121" class="txt-node-code" font-size="11" text-anchor="middle">Browser waits 3000ms (retry)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 750 130 L 815 130" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 750 130 L 815 130" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>

    <!-- Step 3 Card -->
    <g transform="translate(830, 60)">
      <rect width="270" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <rect x="15" y="15" width="70" height="24" rx="12" fill="#d4f6d9" stroke="#000000" stroke-width="1"/>
      <text x="50" y="31" class="txt-badge" font-size="12" text-anchor="middle">Step 3</text>
      <text x="135" y="68" class="txt-node-title" font-size="16" text-anchor="middle">Auto Reconnect</text>
      <text x="135" y="95" class="txt-node-sub" text-anchor="middle">Browser sends header:</text>
      <rect x="15" y="105" width="240" height="24" rx="6" fill="#d4f6d9" stroke="#000000" stroke-width="1"/>
      <text x="135" y="121" class="txt-node-code" font-size="11" text-anchor="middle">Last-Event-ID: 101</text>
    </g>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 545)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Key Takeaway: The browser automatically handles reconnecting and sends Last-Event-ID to avoid losing events</text>
  </g>
</svg>
