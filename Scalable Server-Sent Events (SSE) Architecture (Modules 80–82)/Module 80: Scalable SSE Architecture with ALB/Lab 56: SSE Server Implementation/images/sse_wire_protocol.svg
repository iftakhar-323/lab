<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-weight: 800; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <text x="630" y="45" class="txt-title" text-anchor="middle">Server-Sent Events (SSE) Wire Protocol Specification &amp; Reconnection Flow</text>

  <!-- ==================== 3 COLUMNS OF WIRE FRAMING ==================== -->
  
  <!-- Column 1: Reconnection Directive -->
  <g transform="translate(45, 75)">
    <rect width="365" height="235" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    <text x="182" y="32" class="txt-node-title" text-anchor="middle">1. Reconnection Directive</text>
    <text x="182" y="52" class="txt-node-sub" text-anchor="middle">Specifies Client Retry Interval</text>

    <g transform="translate(18, 65)">
      <rect width="329" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="16" y="32" class="txt-node-code">retry: 3000\n\n</text>
      <text x="16" y="54" class="txt-node-sub" font-style="italic">Wait 3000ms before reconnecting</text>
    </g>

    <text x="35" y="165" class="txt-node-sub">• Informs browser EventSource retry backoff</text>
    <text x="35" y="190" class="txt-node-sub">• Automatically parsed by browser runtime</text>
    <text x="35" y="215" class="txt-node-sub">• Terminates with double newline (\n\n)</text>
  </g>

  <!-- Column 2: Event Data Frame -->
  <g transform="translate(448, 75)">
    <rect width="365" height="235" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    <text x="182" y="32" class="txt-node-title" text-anchor="middle">2. Structured Event Frame</text>
    <text x="182" y="52" class="txt-node-sub" text-anchor="middle">Payload Data with ID &amp; Event Type</text>

    <g transform="translate(18, 65)">
      <rect width="329" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="16" y="26" class="txt-node-code">id: 101\n</text>
      <text x="16" y="48" class="txt-node-code">event: server_telemetry\n</text>
      <text x="16" y="70" class="txt-node-code">data: {"cpu": 34.2, "mem": 62.8}\n\n</text>
    </g>

    <text x="35" y="180" class="txt-node-sub">• id: Stored automatically as Last-Event-ID</text>
    <text x="35" y="205" class="txt-node-sub">• event: Dispatches named JavaScript listener</text>
  </g>

  <!-- Column 3: Keep-Alive Comment Frame -->
  <g transform="translate(850, 75)">
    <rect width="365" height="235" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    <text x="182" y="32" class="txt-node-title" text-anchor="middle">3. Heartbeat Comment</text>
    <text x="182" y="52" class="txt-node-sub" text-anchor="middle">Prevents Socket Idle Timeout</text>

    <g transform="translate(18, 65)">
      <rect width="329" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="16" y="32" class="txt-node-code">: keep-alive heartbeat\n\n</text>
      <text x="16" y="54" class="txt-node-sub" font-style="italic">Ignored by browser EventSource</text>
    </g>

    <text x="35" y="165" class="txt-node-sub">• Any line starting with a colon is a comment</text>
    <text x="35" y="190" class="txt-node-sub">• Keeps NAT gateways and proxies active</text>
    <text x="35" y="215" class="txt-node-sub">• Prevents 504 Gateway Timeout socket drops</text>
  </g>

  <!-- ==================== BOTTOM RECONNECTION SEQUENCE ==================== -->
  <g transform="translate(45, 330)">
    <rect width="1170" height="210" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="585" y="30" class="txt-node-title" text-anchor="middle">Automatic Browser Reconnection Lifecycle with Last-Event-ID</text>

    <!-- Step 1 Box -->
    <g transform="translate(30, 48)">
      <rect width="280" height="135" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="140" y="28" class="txt-node-title" font-size="16" text-anchor="middle">Step 1: Active Stream</text>
      <line x1="12" y1="38" x2="268" y2="38" stroke="#000000" stroke-width="1"/>
      <text x="14" y="62" class="txt-node-sub">Server streams event with <tspan class="txt-node-code">id: 42</tspan></text>
      <text x="14" y="86" class="txt-node-sub">Browser updates DOM UI</text>
      <text x="14" y="110" class="txt-node-code">Last-Event-ID stored in memory</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 310 115 L 420 115" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M 310 115 L 420 115" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text x="365" y="105" class="txt-arrow-label" text-anchor="middle">Socket Drop</text>

    <!-- Step 2 Box -->
    <g transform="translate(420, 48)">
      <rect width="280" height="135" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="140" y="28" class="txt-node-title" font-size="16" text-anchor="middle">Step 2: Network Interruption</text>
      <line x1="12" y1="38" x2="268" y2="38" stroke="#000000" stroke-width="1"/>
      <text x="14" y="62" class="txt-node-sub">TCP socket closed unexpectedly</text>
      <text x="14" y="86" class="txt-node-sub">Browser EventSource fires onerror</text>
      <text x="14" y="110" class="txt-node-sub">Waits 3000ms according to retry</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 700 115 L 810 115" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M 700 115 L 810 115" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text x="755" y="105" class="txt-arrow-label" text-anchor="middle">Reconnect</text>

    <!-- Step 3 Box -->
    <g transform="translate(810, 48)">
      <rect width="330" height="135" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="165" y="28" class="txt-node-title" font-size="16" text-anchor="middle">Step 3: Seamless Recovery</text>
      <line x1="12" y1="38" x2="318" y2="38" stroke="#000000" stroke-width="1"/>
      <text x="14" y="60" class="txt-node-sub">Browser sends HTTP request header:</text>
      <text x="14" y="82" class="txt-node-code">Last-Event-ID: 42</text>
      <text x="14" y="106" class="txt-node-sub">Server replays missed events from #43</text>
    </g>
  </g>

  <!-- Bottom Pill -->
  <g transform="translate(260, 560)">
    <rect width="740" height="42" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="370" y="27" class="txt-node-title" font-size="16" text-anchor="middle">Standardized SSE Wire Framing with Automatic Client Recovery</text>
  </g>
</svg>
