<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 800; fill: #000000; }

      @keyframes pulse-dot {
        0% { r: 6px; opacity: 1; }
        50% { r: 10px; opacity: 0.4; }
        100% { r: 6px; opacity: 1; }
      }
      .anim-alert {
        animation: pulse-dot 1.5s infinite ease-in-out;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Main Title Banner -->
  <g transform="translate(45, 30)">
    <rect width="1170" height="50" rx="10" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="585" y="32" class="txt-title" text-anchor="middle">ALB Idle Timeout Comparison: 60s Default vs 3600s Tuned SSE Architecture</text>
  </g>

  <!-- ==================== SCENARIO A: DEFAULT 60s TIMEOUT (FAILURE) ==================== -->
  <g transform="translate(45, 100)">
    <rect width="1170" height="210" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    
    <!-- Header -->
    <text x="30" y="32" class="txt-node-title">Scenario A: Default AWS ALB Configuration (idle_timeout = 60s) — UNSTABLE FAILURE</text>
    <rect x="940" y="12" width="200" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1040" y="31" class="txt-badge" text-anchor="middle">HTTP 504 Socket Drop</text>

    <!-- Inner White Card with Timeline -->
    <g transform="translate(25, 48)">
      <rect width="1120" height="142" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

      <!-- Timeline Axis -->
      <line x1="50" y1="65" x2="1060" y2="65" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="1070" y="70" class="txt-node-code">Time (s)</text>

      <!-- Tick: 0s Connected -->
      <circle cx="90" cy="65" r="6" fill="#000000"/>
      <line x1="90" y1="50" x2="90" y2="80" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="42" class="txt-node-code" text-anchor="middle">T = 0s</text>
      <text x="90" y="98" class="txt-node-sub" text-anchor="middle">Client GET /events</text>
      <text x="90" y="116" class="txt-node-code" text-anchor="middle">HTTP 200 OK</text>

      <!-- Tick: 15s Event 1 -->
      <circle cx="230" cy="65" r="5" fill="#000000"/>
      <line x1="230" y1="52" x2="230" y2="78" stroke="#000000" stroke-width="1.5"/>
      <text x="230" y="42" class="txt-node-code" text-anchor="middle">T = 15s</text>
      <text x="230" y="98" class="txt-node-sub" text-anchor="middle">Event #1 Dispatched</text>
      <text x="230" y="116" class="txt-node-code" text-anchor="middle">data: {"temp": 24}</text>

      <!-- Tick: 30s Event 2 -->
      <circle cx="370" cy="65" r="5" fill="#000000"/>
      <line x1="370" y1="52" x2="370" y2="78" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="42" class="txt-node-code" text-anchor="middle">T = 30s</text>
      <text x="370" y="98" class="txt-node-sub" text-anchor="middle">Event #2 Dispatched</text>
      <text x="370" y="116" class="txt-node-code" text-anchor="middle">data: {"temp": 25}</text>

      <!-- Inactivity Band -->
      <rect x="370" y="55" width="280" height="20" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="510" y="69" class="txt-node-code" fill="#b91c1c" text-anchor="middle">Quiet Inactivity Period (&gt; 60s elapsed)</text>

      <!-- Tick: 90s ALB Closes Socket -->
      <circle cx="650" cy="65" r="8" fill="#ef4444" stroke="#000000" stroke-width="1.5" class="anim-alert"/>
      <line x1="650" y1="35" x2="650" y2="95" stroke="#dc2626" stroke-width="2"/>
      <text x="650" y="30" class="txt-badge" fill="#dc2626" text-anchor="middle">T = 90s (ALB TIMEOUT)</text>
      <text x="650" y="110" class="txt-node-title" font-size="14" fill="#b91c1c" text-anchor="middle">ALB Drops TCP Connection</text>
      <text x="650" y="128" class="txt-node-sub" text-anchor="middle">Sends TCP [FIN, ACK] packet</text>

      <!-- Disaster Aftermath -->
      <g transform="translate(810, 30)">
        <rect width="280" height="90" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="140" y="24" class="txt-node-title" font-size="14" fill="#991b1b" text-anchor="middle">Severe Production Consequences</text>
        <line x1="12" y1="32" x2="268" y2="32" stroke="#dc2626" stroke-width="1"/>
        <text x="140" y="50" class="txt-node-sub" text-anchor="middle">• Client fires onerror handler</text>
        <text x="140" y="68" class="txt-node-sub" text-anchor="middle">• Reconnection stampede on ALB</text>
        <text x="140" y="84" class="txt-node-sub" text-anchor="middle">• High TCP handshake overhead</text>
      </g>
    </g>
  </g>


  <!-- ==================== SCENARIO B: TUNED 3600s TIMEOUT (SUCCESS) ==================== -->
  <g transform="translate(45, 330)">
    <rect width="1170" height="210" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <!-- Header -->
    <text x="30" y="32" class="txt-node-title">Scenario B: Tuned ALB Settings (idle_timeout = 3600s) + 15s Heartbeats — STABLE STREAM</text>
    <rect x="940" y="12" width="200" height="28" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1040" y="31" class="txt-badge" text-anchor="middle">100% Continuous Uptime</text>

    <!-- Inner White Card with Timeline -->
    <g transform="translate(25, 48)">
      <rect width="1120" height="142" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

      <!-- Timeline Axis -->
      <line x1="50" y1="65" x2="1060" y2="65" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="1070" y="70" class="txt-node-code">Time (s)</text>

      <!-- Tick: 0s Connected -->
      <circle cx="90" cy="65" r="6" fill="#000000"/>
      <line x1="90" y1="50" x2="90" y2="80" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="42" class="txt-node-code" text-anchor="middle">T = 0s</text>
      <text x="90" y="98" class="txt-node-sub" text-anchor="middle">Client Connected</text>
      <text x="90" y="116" class="txt-node-code" text-anchor="middle">EventSource stream</text>

      <!-- Tick: 15s Event -->
      <circle cx="210" cy="65" r="5" fill="#000000"/>
      <line x1="210" y1="52" x2="210" y2="78" stroke="#000000" stroke-width="1.5"/>
      <text x="210" y="42" class="txt-node-code" text-anchor="middle">T = 15s</text>
      <text x="210" y="98" class="txt-node-sub" text-anchor="middle">Telemetry Event</text>
      <text x="210" y="116" class="txt-node-code" text-anchor="middle">data: {..}</text>

      <!-- Tick: 30s Heartbeat Ping -->
      <circle cx="330" cy="65" r="5" fill="#16a34a"/>
      <line x1="330" y1="52" x2="330" y2="78" stroke="#16a34a" stroke-width="1.5"/>
      <text x="330" y="42" class="txt-node-code" text-anchor="middle">T = 30s</text>
      <text x="330" y="98" class="txt-node-sub" text-anchor="middle">: ping heartbeat</text>
      <text x="330" y="116" class="txt-node-code" text-anchor="middle">Resets timer</text>

      <!-- Tick: 45s Heartbeat Ping -->
      <circle cx="450" cy="65" r="5" fill="#16a34a"/>
      <line x1="450" y1="52" x2="450" y2="78" stroke="#16a34a" stroke-width="1.5"/>
      <text x="450" y="42" class="txt-node-code" text-anchor="middle">T = 45s</text>
      <text x="450" y="98" class="txt-node-sub" text-anchor="middle">: ping heartbeat</text>
      <text x="450" y="116" class="txt-node-code" text-anchor="middle">Resets timer</text>

      <!-- Tick: 60s Event -->
      <circle cx="570" cy="65" r="5" fill="#000000"/>
      <line x1="570" y1="52" x2="570" y2="78" stroke="#000000" stroke-width="1.5"/>
      <text x="570" y="42" class="txt-node-code" text-anchor="middle">T = 60s</text>
      <text x="570" y="98" class="txt-node-sub" text-anchor="middle">Telemetry Event</text>
      <text x="570" y="116" class="txt-node-code" text-anchor="middle">data: {..}</text>

      <!-- Continuous Streaming Bar -->
      <rect x="660" y="55" width="130" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="725" y="69" class="txt-node-code" fill="#15803d" text-anchor="middle">Sustained to 3600s...</text>

      <!-- Success Benefits -->
      <g transform="translate(810, 30)">
        <rect width="280" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="140" y="24" class="txt-node-title" font-size="14" fill="#166534" text-anchor="middle">Optimized Architecture Results</text>
        <line x1="12" y1="32" x2="268" y2="32" stroke="#16a34a" stroke-width="1"/>
        <text x="140" y="50" class="txt-node-sub" text-anchor="middle">• Zero dropped client sockets</text>
        <text x="140" y="68" class="txt-node-sub" text-anchor="middle">• Real-time push under 2ms</text>
        <text x="140" y="84" class="txt-node-sub" text-anchor="middle">• Predictable ASG connection metrics</text>
      </g>
    </g>
  </g>

  <!-- Bottom Summary Banner Pill -->
  <g transform="translate(45, 560)">
    <rect width="1170" height="44" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="585" y="28" class="txt-node-title" font-size="16" text-anchor="middle">Production Rule: Always pair ALB 3600s Idle Timeout with Application-Level 15s Heartbeat Pings</text>
  </g>
</svg>
