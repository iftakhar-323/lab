<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .txt-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 500; fill: #64748b; }
      .txt-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #334155; }
      .txt-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }

      @keyframes pulse-red {
        0% { opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { opacity: 0.8; }
      }
      .anim-drop {
        animation: pulse-red 2s infinite ease-in-out;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1100" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="45" class="txt-title">ALB Idle Timeout Comparison: 60s Default vs 3600s Tuned</text>
  <text x="40" y="68" class="txt-subtitle">Why standard load balancer defaults terminate SSE connections and how 1-hour timeout preserves uninterrupted streaming</text>

  <!-- Scenario 1: Default 60s Timeout (Failure Case) -->
  <g transform="translate(40, 95)">
    <rect width="1020" height="175" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <rect width="1020" height="34" rx="10" fill="#fef2f2"/>
    <rect y="24" width="1020" height="10" fill="#fef2f2"/>
    <text x="18" y="23" class="txt-header" fill="#991b1b">Scenario A: Default AWS ALB Settings (idle_timeout = 60s) &mdash; FAILURE</text>
    <rect x="880" y="8" width="120" height="20" rx="10" fill="#ef4444"/>
    <text x="940" y="22" class="txt-badge" text-anchor="middle">504 Gateway Timeout</text>

    <!-- Timeline Bar -->
    <g transform="translate(30, 60)">
      <!-- Axis -->
      <line x1="0" y1="30" x2="960" y2="30" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="0" y="15" class="txt-code" fill="#64748b">0s (Connected)</text>
      <circle cx="0" cy="30" r="6" fill="#0284c7"/>

      <!-- Event 1 -->
      <line x1="120" y1="20" x2="120" y2="40" stroke="#0284c7" stroke-width="2"/>
      <circle cx="120" cy="30" r="5" fill="#0284c7"/>
      <text x="120" y="55" class="txt-code" fill="#0284c7" text-anchor="middle">Event #1 (10s)</text>

      <!-- Event 2 -->
      <line x1="240" y1="20" x2="240" y2="40" stroke="#0284c7" stroke-width="2"/>
      <circle cx="240" cy="30" r="5" fill="#0284c7"/>
      <text x="240" y="55" class="txt-code" fill="#0284c7" text-anchor="middle">Event #2 (25s)</text>

      <!-- Idle Quiet Period -->
      <rect x="240" y="24" width="360" height="12" fill="#fee2e2" rx="4"/>
      <text x="420" y="18" class="txt-body" fill="#b91c1c" font-size="12" text-anchor="middle">Quiet Period (&gt;60s without events/pings)</text>

      <!-- Drop Point -->
      <circle cx="600" cy="30" r="9" fill="#ef4444" class="anim-drop"/>
      <line x1="600" y1="15" x2="600" y2="65" stroke="#ef4444" stroke-width="2"/>
      <text x="600" y="80" class="txt-code" fill="#b91c1c" font-weight="700" text-anchor="middle">85s: 60s Idle Elapsed &rarr; ALB Closes TCP Socket</text>
      
      <!-- Aftermath -->
      <text x="780" y="35" class="txt-body" fill="#dc2626" font-style="italic">Client experiences disconnect &amp; fires onerror</text>
    </g>
  </g>

  <!-- Scenario 2: Tuned 3600s Timeout (Success Case) -->
  <g transform="translate(40, 290)">
    <rect width="1020" height="180" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect width="1020" height="34" rx="10" fill="#f0fdf4"/>
    <rect y="24" width="1020" height="10" fill="#f0fdf4"/>
    <text x="18" y="23" class="txt-header" fill="#166534">Scenario B: Tuned ALB (idle_timeout = 3600s) + Heartbeats &mdash; SUCCESS</text>
    <rect x="880" y="8" width="120" height="20" rx="10" fill="#10b981"/>
    <text x="940" y="22" class="txt-badge" text-anchor="middle">100% Uptime Stream</text>

    <!-- Timeline Bar -->
    <g transform="translate(30, 60)">
      <!-- Axis -->
      <line x1="0" y1="30" x2="960" y2="30" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="0" y="15" class="txt-code" fill="#64748b">0s (Connected)</text>
      <circle cx="0" cy="30" r="6" fill="#10b981"/>

      <!-- Event 1 -->
      <circle cx="120" cy="30" r="5" fill="#0284c7"/>
      <text x="120" y="55" class="txt-code" fill="#0284c7" text-anchor="middle">Event #1 (10s)</text>

      <!-- Heartbeat 1 -->
      <circle cx="240" cy="30" r="4" fill="#10b981"/>
      <text x="240" y="55" class="txt-code" fill="#15803d" text-anchor="middle">: ping (30s)</text>

      <!-- Heartbeat 2 -->
      <circle cx="360" cy="30" r="4" fill="#10b981"/>
      <text x="360" y="55" class="txt-code" fill="#15803d" text-anchor="middle">: ping (50s)</text>

      <!-- Event 2 after long delay -->
      <circle cx="580" cy="30" r="5" fill="#0284c7"/>
      <text x="580" y="55" class="txt-code" fill="#0284c7" text-anchor="middle">Event #2 (150s)</text>

      <!-- Steady stream continues -->
      <rect x="660" y="18" width="280" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
      <text x="800" y="34" class="txt-code" fill="#166534" text-anchor="middle">Connection survives 3,600s (1 hour)!</text>
    </g>

    <text x="30" y="155" class="txt-body" fill="#166534">
      • Even during 30-minute lulls with zero business events, ALB keeps the stream open without throwing 504 Gateway Timeout.
    </text>
  </g>
</svg>
