<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 17px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 12.5px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 12px; font-weight: 800; fill: #000000; }

      @keyframes pulse-dot {
        0% { r: 6px; }
        50% { r: 9px; }
        100% { r: 6px; }
      }
      .anim-alert {
        animation: pulse-dot 1.5s infinite ease-in-out;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Main Title Banner -->
  <g transform="translate(45, 25)">
    <rect width="1170" height="46" rx="10" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="585" y="30" class="txt-title" text-anchor="middle">ALB Idle Timeout Comparison: 60s Default vs 3600s Tuned SSE Architecture</text>
  </g>

  <!-- ==================== SCENARIO A: DEFAULT 60s TIMEOUT (FAILURE) ==================== -->
  <g transform="translate(45, 85)">
    <rect width="1170" height="225" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    
    <text x="25" y="30" class="txt-node-title">Scenario A: Default AWS ALB Configuration (idle_timeout = 60s) &#8212; UNSTABLE FAILURE</text>
    <rect x="960" y="12" width="180" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1050" y="30" class="txt-badge" fill="#dc2626" text-anchor="middle">HTTP 504 Socket Drop</text>

    <!-- Inner White Card with Timeline & Right Summary -->
    <g transform="translate(20, 45)">
      <rect width="1130" height="165" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

      <!-- Timeline Axis (Stops cleanly at x=730) -->
      <line x1="40" y1="75" x2="710" y2="75" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="725" y="80" class="txt-node-code">Time</text>

      <!-- Tick: 0s Connected -->
      <circle cx="70" cy="75" r="5" fill="#000000"/>
      <line x1="70" y1="62" x2="70" y2="88" stroke="#000000" stroke-width="1.5"/>
      <text x="70" y="52" class="txt-node-code" text-anchor="middle">0s</text>
      <text x="70" y="108" class="txt-node-sub" text-anchor="middle">Client Connects</text>
      <text x="70" y="126" class="txt-node-code" text-anchor="middle">GET /events</text>

      <!-- Tick: 15s Event 1 -->
      <circle cx="190" cy="75" r="5" fill="#000000"/>
      <line x1="190" y1="62" x2="190" y2="88" stroke="#000000" stroke-width="1.5"/>
      <text x="190" y="52" class="txt-node-code" text-anchor="middle">15s</text>
      <text x="190" y="108" class="txt-node-sub" text-anchor="middle">Event #1 Sent</text>
      <text x="190" y="126" class="txt-node-code" font-size="11" text-anchor="middle">data: {...}</text>

      <!-- Tick: 30s Event 2 -->
      <circle cx="310" cy="75" r="5" fill="#000000"/>
      <line x1="310" y1="62" x2="310" y2="88" stroke="#000000" stroke-width="1.5"/>
      <text x="310" y="52" class="txt-node-code" text-anchor="middle">30s</text>
      <text x="310" y="108" class="txt-node-sub" text-anchor="middle">Event #2 Sent</text>
      <text x="310" y="126" class="txt-node-code" font-size="11" text-anchor="middle">data: {...}</text>

      <!-- Inactivity Band -->
      <rect x="325" y="65" width="200" height="20" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="425" y="79" class="txt-node-code" font-size="11" fill="#b91c1c" text-anchor="middle">Quiet Inactivity (&gt;60s)</text>

      <!-- Tick: 90s ALB Closes Socket -->
      <circle cx="550" cy="75" r="7" fill="#ef4444" stroke="#000000" stroke-width="1.5" class="anim-alert"/>
      <line x1="550" y1="45" x2="550" y2="105" stroke="#dc2626" stroke-width="2"/>
      <text x="550" y="40" class="txt-badge" fill="#dc2626" text-anchor="middle">T = 90s (ALB TIMEOUT)</text>
      <text x="550" y="122" class="txt-node-title" font-size="13" fill="#b91c1c" text-anchor="middle">ALB Drops TCP Socket</text>
      <text x="550" y="138" class="txt-node-sub" font-size="11" text-anchor="middle">Sends [FIN, ACK] packet</text>

      <!-- Right Summary Card (Generous space starting at x=780) -->
      <g transform="translate(775, 18)">
        <rect width="335" height="130" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="167" y="24" class="txt-node-title" font-size="14" fill="#991b1b" text-anchor="middle">Production Consequences</text>
        <line x1="15" y1="34" x2="320" y2="34" stroke="#dc2626" stroke-width="1"/>
        <text x="20" y="55" class="txt-node-sub">• Browser fires onerror event handler</text>
        <text x="20" y="75" class="txt-node-sub">• Reconnection storm throttles ALB</text>
        <text x="20" y="95" class="txt-node-sub">• Potential missed events during reconnect</text>
        <text x="20" y="115" class="txt-node-sub">• Increased TLS handshake &amp; CPU load</text>
      </g>
    </g>
  </g>


  <!-- ==================== SCENARIO B: TUNED 3600s TIMEOUT (SUCCESS) ==================== -->
  <g transform="translate(45, 325)">
    <rect width="1170" height="225" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="25" y="30" class="txt-node-title">Scenario B: Tuned ALB Settings (idle_timeout = 3600s) + 15s Heartbeats &#8212; STABLE STREAM</text>
    <rect x="960" y="12" width="180" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1050" y="30" class="txt-badge" fill="#166534" text-anchor="middle">100% Continuous Uptime</text>

    <!-- Inner White Card with Timeline & Right Summary -->
    <g transform="translate(20, 45)">
      <rect width="1130" height="165" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

      <!-- Timeline Axis (Stops cleanly at x=730) -->
      <line x1="40" y1="75" x2="710" y2="75" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="725" y="80" class="txt-node-code">Time</text>

      <!-- Tick: 0s Connected -->
      <circle cx="70" cy="75" r="5" fill="#000000"/>
      <line x1="70" y1="62" x2="70" y2="88" stroke="#000000" stroke-width="1.5"/>
      <text x="70" y="52" class="txt-node-code" text-anchor="middle">0s</text>
      <text x="70" y="108" class="txt-node-sub" text-anchor="middle">Client Connected</text>
      <text x="70" y="126" class="txt-node-code" text-anchor="middle">EventSource open</text>

      <!-- Tick: 15s Event -->
      <circle cx="170" cy="75" r="5" fill="#000000"/>
      <line x1="170" y1="62" x2="170" y2="88" stroke="#000000" stroke-width="1.5"/>
      <text x="170" y="52" class="txt-node-code" text-anchor="middle">15s</text>
      <text x="170" y="108" class="txt-node-sub" text-anchor="middle">Telemetry Event</text>
      <text x="170" y="126" class="txt-node-code" font-size="11" text-anchor="middle">data: {...}</text>

      <!-- Tick: 30s Heartbeat -->
      <circle cx="270" cy="75" r="5" fill="#16a34a"/>
      <line x1="270" y1="62" x2="270" y2="88" stroke="#16a34a" stroke-width="1.5"/>
      <text x="270" y="52" class="txt-node-code" text-anchor="middle">30s</text>
      <text x="270" y="108" class="txt-node-sub" text-anchor="middle">: ping heartbeat</text>
      <text x="270" y="126" class="txt-node-code" font-size="11" fill="#15803d" text-anchor="middle">Resets timer</text>

      <!-- Tick: 45s Heartbeat -->
      <circle cx="370" cy="75" r="5" fill="#16a34a"/>
      <line x1="370" y1="62" x2="370" y2="88" stroke="#16a34a" stroke-width="1.5"/>
      <text x="370" y="52" class="txt-node-code" text-anchor="middle">45s</text>
      <text x="370" y="108" class="txt-node-sub" text-anchor="middle">: ping heartbeat</text>
      <text x="370" y="126" class="txt-node-code" font-size="11" fill="#15803d" text-anchor="middle">Resets timer</text>

      <!-- Tick: 60s Event -->
      <circle cx="470" cy="75" r="5" fill="#000000"/>
      <line x1="470" y1="62" x2="470" y2="88" stroke="#000000" stroke-width="1.5"/>
      <text x="470" y="52" class="txt-node-code" text-anchor="middle">60s</text>
      <text x="470" y="108" class="txt-node-sub" text-anchor="middle">Telemetry Event</text>
      <text x="470" y="126" class="txt-node-code" font-size="11" text-anchor="middle">data: {...}</text>

      <!-- Sustained Banner -->
      <rect x="530" y="65" width="160" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="610" y="79" class="txt-node-code" font-size="11" fill="#15803d" text-anchor="middle">Sustained to 3600s...</text>

      <!-- Right Summary Card (Generous space starting at x=775) -->
      <g transform="translate(775, 18)">
        <rect width="335" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="167" y="24" class="txt-node-title" font-size="14" fill="#166534" text-anchor="middle">Optimized Architecture Results</text>
        <line x1="15" y1="34" x2="320" y2="34" stroke="#16a34a" stroke-width="1"/>
        <text x="20" y="55" class="txt-node-sub">• Zero dropped client sockets</text>
        <text x="20" y="75" class="txt-node-sub">• Instant push delivery (&lt; 2ms latency)</text>
        <text x="20" y="95" class="txt-node-sub">• Stable CloudWatch connection metrics</text>
        <text x="20" y="115" class="txt-node-sub">• Reliable long-running SSE subscriptions</text>
      </g>
    </g>
  </g>

  <!-- Bottom Summary Banner Pill -->
  <g transform="translate(45, 565)">
    <rect width="1170" height="42" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="585" y="27" class="txt-node-title" font-size="16" text-anchor="middle">Production Rule: Always pair ALB 3600s Idle Timeout with Application-Level 15s Heartbeat Pings</text>
  </g>
</svg>
