<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #4b5563; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #111827; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Diagram Title -->
  <text x="630" y="48" class="txt-title" text-anchor="middle">ALB Idle Timeout Comparison: 60s Default vs 3600s Tuned</text>

  <!-- ==================== TOP: 60s DEFAULT TIMEOUT (FAILURE) ==================== -->
  <g transform="translate(60, 80)">
    <rect width="1140" height="205" rx="14" fill="#fff5f5" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="30" y="20" width="220" height="30" rx="15" fill="#ef4444"/>
    <text x="140" y="40" class="txt-badge" fill="#ffffff" font-size="13" text-anchor="middle">Scenario A: Default (60s)</text>
    <text x="270" y="42" class="txt-node-title" font-size="16" fill="#dc2626">Result: Connection Terminated Prematurely</text>

    <!-- Visual Timeline -->
    <g transform="translate(30, 80)">
      <!-- Timeline Axis -->
      <line x1="0" y1="40" x2="700" y2="40" stroke="#94a3b8" stroke-width="3"/>
      
      <!-- 0s Mark -->
      <circle cx="20" cy="40" r="8" fill="#3b82f6"/>
      <text x="20" y="70" class="txt-node-code" text-anchor="middle">0s: Connected</text>

      <!-- 30s Mark -->
      <circle cx="240" cy="40" r="6" fill="#64748b"/>
      <text x="240" y="70" class="txt-node-sub" text-anchor="middle">30s: Stream Quiet</text>

      <!-- 60s Cutoff Mark -->
      <circle cx="500" cy="40" r="10" fill="#ef4444"/>
      <text x="500" y="70" class="txt-node-code" fill="#dc2626" font-size="14" text-anchor="middle">60s: Timeout!</text>

      <!-- Red Cross Line -->
      <line x1="485" y1="25" x2="515" y2="55" stroke="#ffffff" stroke-width="3"/>
      <line x1="515" y1="25" x2="485" y2="55" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- Outcome Card (Right) -->
    <g transform="translate(780, 45)">
      <rect width="320" height="135" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="20" y="18" width="170" height="24" rx="6" fill="#fee2e2"/>
      <text x="105" y="34" class="txt-node-code" fill="#991b1b" text-anchor="middle">HTTP 504 Gateway Error</text>
      <text x="20" y="72" class="txt-node-sub">&#8226; ALB terminates idle TCP socket</text>
      <text x="20" y="98" class="txt-node-sub">&#8226; Client experiences frequent drops</text>
      <text x="20" y="124" class="txt-node-sub">&#8226; Requires constant reconnection</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: 3600s TUNED TIMEOUT (SUCCESS) ==================== -->
  <g transform="translate(60, 310)">
    <rect width="1140" height="205" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="30" y="20" width="220" height="30" rx="15" fill="#16a34a"/>
    <text x="140" y="40" class="txt-badge" fill="#ffffff" font-size="13" text-anchor="middle">Scenario B: Tuned (3600s)</text>
    <text x="270" y="42" class="txt-node-title" font-size="16" fill="#15803d">Result: Long-Lived Continuous Connection</text>

    <!-- Visual Timeline -->
    <g transform="translate(30, 80)">
      <!-- Timeline Axis -->
      <line x1="0" y1="40" x2="700" y2="40" stroke="#16a34a" stroke-width="3"/>
      
      <!-- 0s Mark -->
      <circle cx="20" cy="40" r="8" fill="#3b82f6"/>
      <text x="20" y="70" class="txt-node-code" text-anchor="middle">0s: Connected</text>

      <!-- 60s Mark -->
      <circle cx="200" cy="40" r="6" fill="#16a34a"/>
      <text x="200" y="70" class="txt-node-sub" text-anchor="middle">60s: Still Open</text>

      <!-- 300s Mark -->
      <circle cx="400" cy="40" r="6" fill="#16a34a"/>
      <text x="400" y="70" class="txt-node-sub" text-anchor="middle">5 min: Heartbeat</text>

      <!-- 3600s Mark -->
      <circle cx="650" cy="40" r="10" fill="#16a34a"/>
      <text x="650" y="70" class="txt-node-code" fill="#15803d" font-size="14" text-anchor="middle">1 Hour: Alive!</text>
    </g>

    <!-- Outcome Card (Right) -->
    <g transform="translate(780, 45)">
      <rect width="320" height="135" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="20" y="18" width="180" height="24" rx="6" fill="#dcfce7"/>
      <text x="110" y="34" class="txt-node-code" fill="#166534" text-anchor="middle">HTTP 200 Keep-Alive</text>
      <text x="20" y="72" class="txt-node-sub">&#8226; Sustains quiet SSE streams</text>
      <text x="20" y="98" class="txt-node-sub">&#8226; Zero premature disconnections</text>
      <text x="20" y="124" class="txt-node-sub">&#8226; Ideal for LLM / status feeds</text>
    </g>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 545)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Summary: Configuring idle_timeout = 3600 allows SSE connections to stay open without dropping</text>
  </g>
</svg>
