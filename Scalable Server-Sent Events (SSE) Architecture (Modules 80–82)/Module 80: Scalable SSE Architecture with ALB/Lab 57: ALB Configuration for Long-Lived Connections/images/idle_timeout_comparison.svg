<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== TOP: 60s DEFAULT TIMEOUT (FAILURE) ==================== -->
  <g transform="translate(60, 60)">
    <rect width="1140" height="220" rx="14" fill="#fff5f5" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="35" y="20" width="220" height="32" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="145" y="41" class="txt-badge" font-size="13" text-anchor="middle">Scenario A: Default (60s)</text>
    <text x="280" y="42" class="txt-node-title" font-size="16">Result: Connection Terminated Prematurely</text>

    <!-- Visual Timeline -->
    <g transform="translate(50, 75)">
      <!-- Timeline Axis (from 30 to 670) -->
      <line x1="30" y1="45" x2="670" y2="45" stroke="#94a3b8" stroke-width="3"/>
      
      <!-- 0s Mark -->
      <circle cx="50" cy="45" r="8" fill="#3b82f6"/>
      <text x="50" y="75" class="txt-node-code" text-anchor="start">0s: Connected</text>

      <!-- 30s Mark -->
      <circle cx="280" cy="45" r="6" fill="#64748b"/>
      <text x="280" y="75" class="txt-node-sub" text-anchor="middle">30s: Stream Quiet</text>

      <!-- 60s Cutoff Mark -->
      <circle cx="550" cy="45" r="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="550" y="75" class="txt-node-code" font-size="13" text-anchor="middle">60s: Timeout!</text>

      <!-- Red Cross Line -->
      <line x1="538" y1="33" x2="562" y2="57" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="562" y1="33" x2="538" y2="57" stroke="#dc2626" stroke-width="2.5"/>
    </g>

    <!-- Outcome Card (Right) -->
    <g transform="translate(770, 40)">
      <rect width="330" height="145" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="20" y="16" width="180" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
      <text x="110" y="34" class="txt-node-code" font-size="12" text-anchor="middle">HTTP 504 Gateway Error</text>
      <text x="20" y="70" class="txt-node-sub">&#8226; ALB terminates idle TCP socket</text>
      <text x="20" y="98" class="txt-node-sub">&#8226; Client experiences frequent drops</text>
      <text x="20" y="126" class="txt-node-sub">&#8226; Requires constant reconnection</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: 3600s TUNED TIMEOUT (SUCCESS) ==================== -->
  <g transform="translate(60, 305)">
    <rect width="1140" height="220" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="35" y="20" width="220" height="32" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="145" y="41" class="txt-badge" font-size="13" text-anchor="middle">Scenario B: Tuned (3600s)</text>
    <text x="280" y="42" class="txt-node-title" font-size="16">Result: Long-Lived Continuous Connection</text>

    <!-- Visual Timeline -->
    <g transform="translate(50, 75)">
      <!-- Timeline Axis (from 30 to 670) -->
      <line x1="30" y1="45" x2="670" y2="45" stroke="#16a34a" stroke-width="3"/>
      
      <!-- 0s Mark -->
      <circle cx="50" cy="45" r="8" fill="#3b82f6"/>
      <text x="50" y="75" class="txt-node-code" text-anchor="start">0s: Connected</text>

      <!-- 60s Mark -->
      <circle cx="230" cy="45" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="230" y="75" class="txt-node-sub" text-anchor="middle">60s: Still Open</text>

      <!-- 300s Mark -->
      <circle cx="420" cy="45" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="420" y="75" class="txt-node-sub" text-anchor="middle">5 min: Heartbeat</text>

      <!-- 3600s Mark -->
      <circle cx="630" cy="45" r="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="630" y="75" class="txt-node-code" font-size="13" text-anchor="middle">1 Hour: Alive!</text>
    </g>

    <!-- Outcome Card (Right) -->
    <g transform="translate(770, 40)">
      <rect width="330" height="145" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="20" y="16" width="180" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="110" y="34" class="txt-node-code" font-size="12" text-anchor="middle">HTTP 200 Keep-Alive</text>
      <text x="20" y="70" class="txt-node-sub">&#8226; Sustains quiet SSE streams</text>
      <text x="20" y="98" class="txt-node-sub">&#8226; Zero premature disconnections</text>
      <text x="20" y="126" class="txt-node-sub">&#8226; Ideal for LLM / status feeds</text>
    </g>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(180, 545)">
    <rect width="900" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="450" y="31" class="txt-badge" font-size="14" text-anchor="middle">Summary: Configuring idle_timeout = 3600 allows SSE connections to stay open without dropping</text>
  </g>
</svg>
