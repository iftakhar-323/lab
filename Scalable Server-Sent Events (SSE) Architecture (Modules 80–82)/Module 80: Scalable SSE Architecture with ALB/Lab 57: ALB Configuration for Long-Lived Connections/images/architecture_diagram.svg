<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 800; fill: #000000; }

      /* Live Flow Animations */
      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. CLIENT TIER ==================== -->
  <g transform="translate(40, 110)">
    <rect width="210" height="435" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <!-- User Icon -->
    <circle cx="105" cy="46" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 73 94 C 73 68, 137 68, 137 94" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="105" y="122" class="txt-title" text-anchor="middle">Client Tier</text>
    <text x="105" y="142" class="txt-node-sub" font-style="italic" text-anchor="middle">(Long-Lived Subscribers)</text>
    
    <!-- Browser Client 1 -->
    <g transform="translate(15, 160)">
      <rect width="180" height="115" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="24" class="txt-node-title" font-size="15" text-anchor="middle">Browser Client A</text>
      <line x1="10" y1="34" x2="170" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="90" y="55" class="txt-node-code" text-anchor="middle">HTTP/2 Stream</text>
      <text x="90" y="75" class="txt-node-sub" text-anchor="middle">EventSource('/events')</text>
      <text x="90" y="96" class="txt-node-sub" text-anchor="middle">TCP Port: 443 TLS</text>
    </g>

    <!-- Browser Client 2 -->
    <g transform="translate(15, 295)">
      <rect width="180" height="115" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="24" class="txt-node-title" font-size="15" text-anchor="middle">Mobile / CLI Client B</text>
      <line x1="10" y1="34" x2="170" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="90" y="55" class="txt-node-code" text-anchor="middle">HTTP/1.1 Keep-Alive</text>
      <text x="90" y="75" class="txt-node-sub" text-anchor="middle">Persistent TCP Stream</text>
      <text x="90" y="96" class="txt-node-sub" text-anchor="middle">curl -N /events</text>
    </g>
  </g>

  <!-- Connectors: Clients -> ALB -->
  <!-- Top Flow Arrow -->
  <path d="M 250 250 L 370 250" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 250 250 L 370 250" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="310" y="240" class="txt-arrow-label" text-anchor="middle">GET /events</text>

  <!-- Bottom Flow Arrow -->
  <path d="M 370 410 L 250 410" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 370 410 L 250 410" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="310" y="432" class="txt-arrow-label" text-anchor="middle">SSE Chunks</text>


  <!-- ==================== 2. AWS APPLICATION LOAD BALANCER ==================== -->
  <g transform="translate(370, 75)">
    <rect width="320" height="470" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="160" y="34" class="txt-title" text-anchor="middle">AWS ALB</text>
    <text x="160" y="56" class="txt-node-sub" font-weight="700" text-anchor="middle">Application Load Balancer</text>

    <!-- ALB Ingress Listener -->
    <g transform="translate(18, 72)">
      <rect width="284" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="142" y="24" class="txt-node-title" font-size="15" text-anchor="middle">HTTP Listener (Port 80/443)</text>
      <line x1="12" y1="34" x2="272" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="142" y="52" class="txt-node-sub" text-anchor="middle">Forwards traffic to Target Group</text>
      <text x="142" y="70" class="txt-node-code" text-anchor="middle">Rule: /events -> sse-tg</text>
    </g>

    <!-- Critical Idle Timeout Configuration -->
    <g transform="translate(18, 168)">
      <rect width="284" height="150" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <rect x="10" y="8" width="264" height="28" rx="6" fill="#ffeaea" stroke="#000000" stroke-width="1.2"/>
      <text x="142" y="27" class="txt-badge" fill="#000000" text-anchor="middle">CRITICAL ALB ATTRIBUTE</text>
      
      <text x="142" y="60" class="txt-node-title" font-size="15" text-anchor="middle">idle_timeout.timeout_seconds</text>
      <line x1="12" y1="70" x2="272" y2="70" stroke="#000000" stroke-width="1"/>
      <text x="142" y="92" class="txt-node-code" font-size="15" text-anchor="middle">Value = 3600 seconds</text>
      <text x="142" y="114" class="txt-node-sub" text-anchor="middle">• Prevents 60s drop on quiet streams</text>
      <text x="142" y="134" class="txt-node-sub" text-anchor="middle">• Sustains long TCP connection window</text>
    </g>

    <!-- Target Group Connection Manager -->
    <g transform="translate(18, 334)">
      <rect width="284" height="115" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="142" y="24" class="txt-node-title" font-size="15" text-anchor="middle">Target Group: sse-target-group</text>
      <line x1="12" y1="34" x2="272" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="142" y="54" class="txt-node-code" text-anchor="middle">deregistration_delay = 300s</text>
      <text x="142" y="74" class="txt-node-sub" text-anchor="middle">Health Check: GET /health (Port 8000)</text>
      <text x="142" y="96" class="txt-node-sub" font-size="12" text-anchor="middle">Isolated from persistent /events stream</text>
    </g>
  </g>

  <!-- Connectors: ALB -> ASG Target Fleet -->
  <!-- Forward Arrow 1 -->
  <path d="M 690 230 L 790 200" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 690 230 L 790 200" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="740" y="195" class="txt-arrow-label" text-anchor="middle">Target 1</text>

  <!-- Forward Arrow 2 -->
  <path d="M 690 380 L 790 410" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 690 380 L 790 410" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="740" y="425" class="txt-arrow-label" text-anchor="middle">Target 2</text>


  <!-- ==================== 3. ASG TARGET FLEET ==================== -->
  <g transform="translate(790, 45)">
    <rect width="430" height="500" rx="16" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="215" y="32" class="txt-title" text-anchor="middle">Auto Scaling Target Fleet</text>
    <text x="215" y="52" class="txt-node-sub" font-style="italic" text-anchor="middle">Target Group: sse-target-group (Port 8000)</text>

    <!-- Backend Instance 1 -->
    <g transform="translate(25, 70)">
      <rect width="380" height="180" rx="12" fill="#ffefe0" stroke="#000000" stroke-width="2"/>
      
      <text x="190" y="26" class="txt-node-title" text-anchor="middle">EC2 SSE Instance 1 (10.0.1.45)</text>
      <line x1="20" y1="36" x2="360" y2="36" stroke="#000000" stroke-width="1"/>

      <g transform="translate(20, 50)">
        <rect width="340" height="110" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="170" y="22" class="txt-node-title" font-size="14" text-anchor="middle">FastAPI + Uvicorn Worker</text>
        <text x="170" y="44" class="txt-node-code" text-anchor="middle">Endpoint: /events (StreamingResponse)</text>
        <text x="170" y="66" class="txt-node-sub" text-anchor="middle">• Active Connections: 500 TCP Sockets</text>
        <text x="170" y="88" class="txt-node-sub" text-anchor="middle">• Response Header: X-Accel-Buffering: no</text>
      </g>
    </g>

    <!-- Backend Instance 2 -->
    <g transform="translate(25, 275)">
      <rect width="380" height="180" rx="12" fill="#ffefe0" stroke="#000000" stroke-width="2"/>
      
      <text x="190" y="26" class="txt-node-title" text-anchor="middle">EC2 SSE Instance 2 (10.0.2.88)</text>
      <line x1="20" y1="36" x2="360" y2="36" stroke="#000000" stroke-width="1"/>

      <g transform="translate(20, 50)">
        <rect width="340" height="110" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="170" y="22" class="txt-node-title" font-size="14" text-anchor="middle">FastAPI + Uvicorn Worker</text>
        <text x="170" y="44" class="txt-node-code" text-anchor="middle">Endpoint: /events (StreamingResponse)</text>
        <text x="170" y="66" class="txt-node-sub" text-anchor="middle">• Active Connections: 500 TCP Sockets</text>
        <text x="170" y="88" class="txt-node-sub" text-anchor="middle">• Health Check Endpoint: /health (HTTP 200)</text>
      </g>
    </g>

    <!-- Health Check Note Pill -->
    <g transform="translate(25, 465)">
      <rect width="380" height="24" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="190" y="16" class="txt-node-sub" font-size="12" text-anchor="middle">Target Draining Window: 300s allows graceful client wrap-up</text>
    </g>
  </g>

  <!-- Bottom Summary Banner Pill -->
  <g transform="translate(40, 562)">
    <rect width="1180" height="44" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="590" y="28" class="txt-node-title" font-size="16" text-anchor="middle">AWS ALB Architecture: 3600s Idle Timeout + 300s Deregistration Delay + Dedicated /health Probe Isolation</text>
  </g>
</svg>
