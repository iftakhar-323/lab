<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Diagram Title -->
  <text x="630" y="48" class="txt-title" text-anchor="middle">Lab 57: AWS ALB Architecture for Long-Lived SSE Connections</text>

  <!-- ==================== 1. CLIENT TIER ==================== -->
  <g transform="translate(60, 95)">
    <rect width="230" height="430" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    <text x="115" y="45" class="txt-node-title" text-anchor="middle">Clients</text>
    <text x="115" y="70" class="txt-node-sub" text-anchor="middle">Web &amp; Mobile Subscribers</text>

    <!-- Client 1 -->
    <rect x="20" y="105" width="190" height="120" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <circle cx="115" cy="140" r="18" fill="#eaf8ff" stroke="#000000" stroke-width="1.5"/>
    <text x="115" y="185" class="txt-node-title" font-size="16" text-anchor="middle">Browser Client</text>
    <text x="115" y="208" class="txt-node-code" font-size="12" text-anchor="middle">EventSource('/events')</text>

    <!-- Client 2 -->
    <rect x="20" y="245" width="190" height="120" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="95" y="260" width="40" height="30" rx="4" fill="#ffefe0" stroke="#000000" stroke-width="1.5"/>
    <text x="115" y="280" class="txt-node-code" font-size="14" text-anchor="middle">&gt;_</text>
    <text x="115" y="325" class="txt-node-title" font-size="16" text-anchor="middle">CLI Client</text>
    <text x="115" y="348" class="txt-node-code" font-size="12" text-anchor="middle">curl -N /events</text>
  </g>

  <!-- Flow: Client -> ALB -->
  <path d="M 290 260 L 410 260" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 290 260 L 410 260" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="350" y="250" class="txt-arrow-label" text-anchor="middle">GET /events</text>

  <path d="M 410 360 L 290 360" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 410 360 L 290 360" fill="none" stroke="#059669" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="350" y="350" class="txt-arrow-label" text-anchor="middle">SSE Stream</text>

  <!-- ==================== 2. AWS ALB ==================== -->
  <g transform="translate(410, 95)">
    <rect width="360" height="430" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    <text x="180" y="42" class="txt-node-title" text-anchor="middle">AWS Application Load Balancer</text>
    <text x="180" y="66" class="txt-node-sub" text-anchor="middle">HTTP Listener (Port 80 / 443)</text>

    <!-- Critical Setting Box (Highlighted) -->
    <rect x="25" y="95" width="310" height="150" rx="10" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    <rect x="100" y="110" width="160" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="180" y="126" class="txt-badge" font-size="12" text-anchor="middle">CRITICAL ALB SETTING</text>
    <text x="180" y="160" class="txt-node-code" font-size="14" text-anchor="middle">idle_timeout = 3600 seconds</text>
    <text x="180" y="190" class="txt-node-sub" text-anchor="middle">Default is 60s (terminates stream)</text>
    <text x="180" y="215" class="txt-node-sub" text-anchor="middle">3600s allows 1-hour quiet streams!</text>

    <!-- Target Group Info Card -->
    <rect x="25" y="265" width="310" height="135" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="180" y="295" class="txt-node-title" font-size="16" text-anchor="middle">Target Group: sse-target-group</text>
    <text x="45" y="325" class="txt-node-sub">• Routing: Round-Robin</text>
    <text x="45" y="352" class="txt-node-sub">• Health Check: GET /health (Port 8000)</text>
    <text x="45" y="378" class="txt-node-sub">• Deregistration Delay: 300s (Draining)</text>
  </g>

  <!-- Flow: ALB -> Backend Fleet -->
  <path d="M 770 260 L 870 260" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 770 260 L 870 260" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="820" y="250" class="txt-arrow-label" text-anchor="middle">Forward</text>

  <path d="M 870 360 L 770 360" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 870 360 L 770 360" fill="none" stroke="#059669" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="820" y="350" class="txt-arrow-label" text-anchor="middle">Stream</text>

  <!-- ==================== 3. TARGET FLEET ==================== -->
  <g transform="translate(870, 95)">
    <rect width="330" height="430" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="165" y="42" class="txt-node-title" text-anchor="middle">Auto Scaling Target Fleet</text>
    <text x="165" y="66" class="txt-node-sub" text-anchor="middle">FastAPI + Uvicorn Workers</text>

    <!-- Instance 1 -->
    <rect x="25" y="95" width="280" height="145" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="40" y="110" width="130" height="24" rx="6" fill="#effff1" stroke="#000000" stroke-width="1"/>
    <text x="105" y="126" class="txt-badge" font-size="12" text-anchor="middle">EC2 Instance 1</text>
    <text x="165" y="162" class="txt-node-title" font-size="15" text-anchor="middle">FastAPI SSE Server</text>
    <text x="40" y="190" class="txt-node-sub">• IP: 10.0.1.45 (Port 8000)</text>
    <text x="40" y="215" class="txt-node-sub">• Open Sockets: 500 connections</text>

    <!-- Instance 2 -->
    <rect x="25" y="255" width="280" height="145" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="40" y="270" width="130" height="24" rx="6" fill="#effff1" stroke="#000000" stroke-width="1"/>
    <text x="105" y="286" class="txt-badge" font-size="12" text-anchor="middle">EC2 Instance 2</text>
    <text x="165" y="322" class="txt-node-title" font-size="15" text-anchor="middle">FastAPI SSE Server</text>
    <text x="40" y="350" class="txt-node-sub">• IP: 10.0.2.88 (Port 8000)</text>
    <text x="40" y="375" class="txt-node-sub">• Open Sockets: 500 connections</text>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 545)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Key Takeaway: Setting ALB Idle Timeout to 3600s prevents 504 Gateway Timeouts on long-lived SSE connections</text>
  </g>
</svg>
