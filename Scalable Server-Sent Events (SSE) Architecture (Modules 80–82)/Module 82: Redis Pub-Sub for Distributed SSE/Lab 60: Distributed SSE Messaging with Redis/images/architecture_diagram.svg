<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .txt-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 500; fill: #64748b; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #334155; }
      .txt-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #0284c7; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      .pub-flow {
        stroke: #ef4444;
        stroke-width: 2.5;
        stroke-dasharray: 8 5;
        animation: flow-dash 1.1s linear infinite;
      }
      .redis-pub-flow {
        stroke: #dc2626;
        stroke-width: 2.5;
        stroke-dasharray: 8 5;
        animation: flow-dash 1.0s linear infinite;
      }
      .redis-sub-flow {
        stroke: #8b5cf6;
        stroke-width: 2.5;
        stroke-dasharray: 8 5;
        animation: flow-dash 1.0s linear infinite;
      }
      .sse-client-flow {
        stroke: #0284c7;
        stroke-width: 2.5;
        stroke-dasharray: 8 5;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="720" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Main Title -->
  <text x="50" y="48" class="txt-title">Lab 60: Distributed SSE Architecture with Redis Pub/Sub</text>
  <text x="50" y="72" class="txt-subtitle">Solving the Cross-Node Stateful Broadcast Problem with In-Memory Message Bus and FastAPI Local Queue Fan-Out</text>

  <!-- ==================== 1. EVENT PRODUCER ==================== -->
  <g transform="translate(50, 110)">
    <rect width="240" height="230" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="42" rx="14" fill="#ef4444"/>
    <rect y="30" width="240" height="12" fill="#ef4444"/>
    <text x="18" y="27" class="txt-node-title" fill="#ffffff">Event Publisher</text>
    <rect x="155" y="10" width="70" height="20" rx="10" fill="#b91c1c"/>
    <text x="190" y="24" class="txt-badge" text-anchor="middle">Producer</text>

    <g transform="translate(14, 55)">
      <rect width="212" height="160" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="12" y="24" class="txt-code" fill="#991b1b">POST /publish</text>
      <line x1="12" y1="36" x2="200" y2="36" stroke="#fecaca" stroke-width="1"/>
      <text x="12" y="58" class="txt-body">• REST API Webhook / Admin</text>
      <text x="12" y="78" class="txt-body">• Hits Load Balancer (:8080)</text>
      
      <!-- Payload Sample -->
      <rect x="10" y="92" width="192" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
      <text x="18" y="112" class="txt-code" font-size="11" fill="#b91c1c">{"title": "Flash Alert",</text>
      <text x="18" y="130" class="txt-code" font-size="11" fill="#b91c1c"> "msg": "Realtime Broadcast!"}</text>
    </g>
  </g>

  <!-- ==================== 2. LOAD BALANCER ==================== -->
  <g transform="translate(340, 110)">
    <rect width="220" height="230" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="220" height="42" rx="14" fill="#0284c7"/>
    <rect y="30" width="220" height="12" fill="#0284c7"/>
    <text x="16" y="27" class="txt-node-title" fill="#ffffff">Nginx Load Balancer</text>
    <rect x="150" y="10" width="55" height="20" rx="10" fill="#0369a1"/>
    <text x="177" y="24" class="txt-badge" text-anchor="middle">:8080</text>

    <g transform="translate(14, 55)">
      <rect width="192" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="24" class="txt-code">proxy_pass sse_fleet</text>
      <line x1="12" y1="36" x2="180" y2="36" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="58" class="txt-body">• Upstream Round-Robin</text>
      <text x="12" y="78" class="txt-body">• <tspan class="txt-code">/events</tspan> &rarr; Unbuffered</text>
      <text x="12" y="98" class="txt-body">• <tspan class="txt-code">/publish</tspan> &rarr; Routed to Node</text>
      <text x="12" y="125" class="txt-code" font-size="11" fill="#10b981">proxy_read_timeout 3600s;</text>
      <text x="12" y="145" class="txt-code" font-size="11" fill="#10b981">proxy_buffering off;</text>
    </g>
  </g>

  <!-- ==================== 3. MULTI-NODE CLUSTER ==================== -->
  <!-- Node Alpha -->
  <g transform="translate(610, 80)">
    <rect width="320" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="320" height="40" rx="14" fill="#0f172a"/>
    <rect y="28" width="320" height="12" fill="#0f172a"/>
    <text x="18" y="26" class="txt-node-title" fill="#ffffff">FastAPI Node-Alpha (:8001)</text>
    <rect x="235" y="10" width="70" height="20" rx="10" fill="#10b981"/>
    <text x="270" y="24" class="txt-badge" text-anchor="middle">Worker 1</text>

    <g transform="translate(16, 52)">
      <rect width="288" height="202" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <!-- Internal Components -->
      <text x="14" y="24" class="txt-code" fill="#0284c7">POST /publish Handler</text>
      <text x="14" y="44" class="txt-body">&rarr; Executes <tspan class="txt-code">redis.publish()</tspan></text>
      <line x1="12" y1="56" x2="276" y2="56" stroke="#e2e8f0" stroke-width="1"/>
      
      <text x="14" y="78" class="txt-code" fill="#8b5cf6">Redis Subscriber Coroutine</text>
      <text x="14" y="98" class="txt-body">• Subscribed to <tspan class="txt-code">sse_events_channel</tspan></text>
      <text x="14" y="118" class="txt-body">• Fans out to Local Client Queues</text>

      <rect x="12" y="132" width="264" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="20" y="152" class="txt-code" fill="#1e40af">Local Client Registry: Set[Queue]</text>
      <text x="20" y="172" class="txt-body" font-size="11" fill="#1e3a8a">&bull; Client 1 connected here &rarr; Queue.put()</text>
    </g>
  </g>

  <!-- Node Beta -->
  <g transform="translate(610, 390)">
    <rect width="320" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="320" height="40" rx="14" fill="#0f172a"/>
    <rect y="28" width="320" height="12" fill="#0f172a"/>
    <text x="18" y="26" class="txt-node-title" fill="#ffffff">FastAPI Node-Beta (:8002)</text>
    <rect x="235" y="10" width="70" height="20" rx="10" fill="#10b981"/>
    <text x="270" y="24" class="txt-badge" text-anchor="middle">Worker 2</text>

    <g transform="translate(16, 52)">
      <rect width="288" height="202" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <!-- Internal Components -->
      <text x="14" y="24" class="txt-code" fill="#64748b">No direct publish hit here</text>
      <text x="14" y="44" class="txt-body">(Isolated physical instance)</text>
      <line x1="12" y1="56" x2="276" y2="56" stroke="#e2e8f0" stroke-width="1"/>
      
      <text x="14" y="78" class="txt-code" fill="#8b5cf6">Redis Subscriber Coroutine</text>
      <text x="14" y="98" class="txt-body">• Subscribed to <tspan class="txt-code">sse_events_channel</tspan></text>
      <text x="14" y="118" class="txt-body">• Receives message published by Alpha!</text>

      <rect x="12" y="132" width="264" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="20" y="152" class="txt-code" fill="#1e40af">Local Client Registry: Set[Queue]</text>
      <text x="20" y="172" class="txt-body" font-size="11" fill="#1e3a8a">&bull; Client 2 connected here &rarr; Queue.put()</text>
    </g>
  </g>

  <!-- ==================== 4. REDIS IN-MEMORY MESSAGE BUS ==================== -->
  <g transform="translate(980, 240)">
    <rect width="250" height="250" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <rect width="250" height="42" rx="16" fill="#dc2626"/>
    <rect y="30" width="250" height="12" fill="#dc2626"/>
    <text x="18" y="27" class="txt-node-title" fill="#ffffff">Redis 7 Message Bus</text>
    <rect x="180" y="10" width="55" height="20" rx="10" fill="#991b1b"/>
    <text x="207" y="24" class="txt-badge" text-anchor="middle">:6379</text>

    <!-- Redis Cylinder Icon / Body -->
    <g transform="translate(16, 55)">
      <rect width="218" height="180" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <ellipse cx="109" cy="30" rx="55" ry="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="109" y="34" class="txt-code" fill="#dc2626" text-anchor="middle">Channel</text>
      <text x="109" y="60" class="txt-code" font-size="11" fill="#991b1b" text-anchor="middle">'sse_events_channel'</text>

      <line x1="12" y1="74" x2="206" y2="74" stroke="#fecaca" stroke-width="1"/>
      <text x="14" y="96" class="txt-body">• Sub-millisecond latency</text>
      <text x="14" y="116" class="txt-body">• In-memory Pub/Sub fan-out</text>
      <text x="14" y="136" class="txt-body">• Completely decoupled nodes</text>
      <text x="14" y="156" class="txt-code" fill="#166534">Broadcasts to all nodes!</text>
    </g>
  </g>

  <!-- ==================== 5. CONNECTED CLIENTS ==================== -->
  <!-- Client 1 (Connected to Node Alpha) -->
  <g transform="translate(50, 400)">
    <rect width="240" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="30" rx="10" fill="#f1f5f9"/>
    <rect y="20" width="240" height="10" fill="#f1f5f9"/>
    <text x="14" y="20" class="txt-node-title" font-size="13">Client 1 (Web Browser)</text>
    <rect x="160" y="6" width="65" height="18" rx="9" fill="#0284c7"/>
    <text x="192" y="19" class="txt-badge" text-anchor="middle">Connected</text>

    <text x="14" y="55" class="txt-body">• Stream Source: <tspan class="txt-code">Node-Alpha</tspan></text>
    <text x="14" y="75" class="txt-code" font-size="11">GET http://node-a/events</text>
    <text x="14" y="95" class="txt-code" fill="#10b981">&check; Receives Flash Alert!</text>
  </g>

  <!-- Client 2 (Connected to Node Beta) -->
  <g transform="translate(50, 540)">
    <rect width="240" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="30" rx="10" fill="#f1f5f9"/>
    <rect y="20" width="240" height="10" fill="#f1f5f9"/>
    <text x="14" y="20" class="txt-node-title" font-size="13">Client 2 (Mobile App)</text>
    <rect x="160" y="6" width="65" height="18" rx="9" fill="#0284c7"/>
    <text x="192" y="19" class="txt-badge" text-anchor="middle">Connected</text>

    <text x="14" y="55" class="txt-body">• Stream Source: <tspan class="txt-code">Node-Beta</tspan></text>
    <text x="14" y="75" class="txt-code" font-size="11">GET http://node-b/events</text>
    <text x="14" y="95" class="txt-code" fill="#10b981">&check; Receives Flash Alert (via Redis)!</text>
  </g>

  <!-- ==================== FLOW CONNECTORS & ARROWS ==================== -->
  <!-- 1. Producer -> LB -->
  <path d="M 290 200 L 340 200" class="pub-flow" marker-end="url(#arrow-red)"/>
  <text x="315" y="190" class="txt-code" font-size="10" fill="#ef4444" text-anchor="middle">1. POST</text>

  <!-- 2. LB -> Node Alpha -->
  <path d="M 560 180 L 610 180" class="pub-flow" marker-end="url(#arrow-red)"/>
  <text x="585" y="170" class="txt-code" font-size="10" fill="#ef4444" text-anchor="middle">2. Route</text>

  <!-- 3. Node Alpha -> Redis PUBLISH -->
  <path d="M 930 180 Q 980 180, 1020 240" class="redis-pub-flow" marker-end="url(#arrow-red)"/>
  <text x="980" y="195" class="txt-code" font-size="10" fill="#dc2626">3. PUBLISH</text>

  <!-- 4. Redis -> Node Alpha Subscriber -->
  <path d="M 1000 270 Q 960 250, 930 250" class="redis-sub-flow" marker-end="url(#arrow-purple)"/>
  <text x="960" y="275" class="txt-code" font-size="10" fill="#8b5cf6">4. Fan-out</text>

  <!-- 5. Redis -> Node Beta Subscriber -->
  <path d="M 1000 450 Q 960 480, 930 480" class="redis-sub-flow" marker-end="url(#arrow-purple)"/>
  <text x="965" y="470" class="txt-code" font-size="10" fill="#8b5cf6">4. Fan-out</text>

  <!-- 6. Node Alpha -> Client 1 Stream -->
  <path d="M 610 240 C 450 240, 400 450, 290 450" class="sse-client-flow" marker-end="url(#arrow-blue)"/>
  <text x="440" y="340" class="txt-code" font-size="11" fill="#0284c7">5. SSE Stream to Client 1</text>

  <!-- 7. Node Beta -> Client 2 Stream -->
  <path d="M 610 560 L 290 560" class="sse-client-flow" marker-end="url(#arrow-blue)"/>
  <text x="440" y="580" class="txt-code" font-size="11" fill="#0284c7">5. SSE Stream to Client 2</text>
</svg>
