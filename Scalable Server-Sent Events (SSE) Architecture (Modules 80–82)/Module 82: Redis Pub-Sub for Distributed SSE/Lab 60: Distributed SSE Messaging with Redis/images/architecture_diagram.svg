<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. CLIENTS & PUBLISHER ==================== -->
  <g transform="translate(60, 95)">
    <rect width="210" height="430" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    <text x="105" y="40" class="txt-node-title" text-anchor="middle">Clients &amp; Admin</text>
    <text x="105" y="64" class="txt-node-sub" text-anchor="middle">External Actors</text>

    <!-- Admin Publisher -->
    <rect x="15" y="85" width="180" height="95" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="95" y="115" class="txt-node-title" font-size="15" text-anchor="middle">Publisher</text>
    <rect x="25" y="130" width="160" height="24" rx="6" fill="#fee2e2"/>
    <text x="105" y="146" class="txt-node-code" font-size="11" text-anchor="middle">POST /publish</text>

    <!-- Client 1 -->
    <rect x="15" y="195" width="180" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="95" y="225" class="txt-node-title" font-size="15" text-anchor="middle">Client 1 (Web)</text>
    <rect x="25" y="240" width="160" height="24" rx="6" fill="#dcfce7"/>
    <text x="105" y="256" class="txt-node-code" font-size="11" text-anchor="middle">Connected to Node-A</text>
    <text x="95" y="280" class="txt-node-sub" font-size="11" text-anchor="middle">Receives live stream</text>

    <!-- Client 2 -->
    <rect x="15" y="310" width="180" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="95" y="340" class="txt-node-title" font-size="15" text-anchor="middle">Client 2 (Mobile)</text>
    <rect x="25" y="355" width="160" height="24" rx="6" fill="#dcfce7"/>
    <text x="105" y="371" class="txt-node-code" font-size="11" text-anchor="middle">Connected to Node-B</text>
    <text x="95" y="395" class="txt-node-sub" font-size="11" text-anchor="middle">Receives live stream</text>
  </g>

  <!-- Flow: Clients -> Ingress -->
  <path d="M 270 240 L 370 240" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 270 240 L 370 240" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="320" y="230" class="txt-arrow-label" text-anchor="middle">HTTP</text>

  <path d="M 370 370 L 270 370" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 370 370 L 270 370" fill="none" stroke="#059669" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="320" y="360" class="txt-arrow-label" text-anchor="middle">Stream</text>

  <!-- ==================== 2. NGINX INGRESS ==================== -->
  <g transform="translate(370, 95)">
    <rect width="210" height="430" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    <text x="105" y="40" class="txt-node-title" text-anchor="middle">Nginx Ingress</text>
    <text x="105" y="64" class="txt-node-sub" text-anchor="middle">Port 8080</text>

    <!-- Details -->
    <rect x="20" y="95" width="170" height="305" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="35" y="115" width="140" height="30" rx="6" fill="#f1f5f9"/>
    <text x="105" y="135" class="txt-node-code" font-size="12" text-anchor="middle">Reverse Proxy</text>

    <text x="35" y="185" class="txt-node-title" font-size="14">Routing:</text>
    <text x="35" y="215" class="txt-node-sub">&#8226; Round-robin</text>
    <text x="35" y="245" class="txt-node-sub">&#8226; Disables proxy</text>
    <text x="45" y="270" class="txt-node-sub">buffering</text>
    <text x="35" y="300" class="txt-node-sub">&#8226; Balances clients</text>
    <text x="45" y="325" class="txt-node-sub">to Node-A &amp; B</text>
  </g>

  <!-- Flow: Ingress -> Cluster -->
  <path d="M 580 240 L 670 240" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 580 240 L 670 240" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="625" y="230" class="txt-arrow-label" text-anchor="middle">Forward</text>

  <path d="M 670 370 L 580 370" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 670 370 L 580 370" fill="none" stroke="#059669" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="625" y="360" class="txt-arrow-label" text-anchor="middle">Stream</text>

  <!-- ==================== 3. DISTRIBUTED CLUSTER ==================== -->
  <g transform="translate(670, 95)">
    <rect width="530" height="430" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="265" y="38" class="txt-node-title" text-anchor="middle">Distributed SSE Cluster</text>
    <text x="265" y="60" class="txt-node-sub" text-anchor="middle">Multi-Node Backend Fleet with Shared Redis Bus</text>

    <!-- Top: Redis Pub/Sub Bus -->
    <g transform="translate(135, 75)">
      <rect width="260" height="95" rx="10" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
      <text x="130" y="32" class="txt-node-title" text-anchor="middle">Redis 7 Pub/Sub Bus</text>
      <rect x="30" y="45" width="200" height="24" rx="6" fill="#fee2e2"/>
      <text x="130" y="61" class="txt-node-code" font-size="11" text-anchor="middle">Channel: sse_events</text>
      <text x="130" y="84" class="txt-node-sub" font-size="11" text-anchor="middle">Inter-node message broker</text>
    </g>

    <!-- Connectors from Redis to Node A & B -->
    <!-- Down to Node A -->
    <path d="M 215 170 L 145 235" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 215 170 L 145 235" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>

    <!-- Down to Node B -->
    <path d="M 315 170 L 385 235" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 315 170 L 385 235" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>

    <!-- Bottom Left: Node-Alpha -->
    <g transform="translate(30, 240)">
      <rect width="225" height="165" rx="10" fill="#ffefe0" stroke="#000000" stroke-width="1.5"/>
      <rect x="25" y="15" width="175" height="24" rx="6" fill="#fed7aa"/>
      <text x="112" y="31" class="txt-badge" font-size="12" text-anchor="middle">FastAPI: Node-Alpha</text>
      <text x="112" y="68" class="txt-node-code" font-size="12" text-anchor="middle">Port 8001</text>
      <text x="25" y="100" class="txt-node-sub">&#8226; Client 1 connected</text>
      <text x="25" y="125" class="txt-node-sub">&#8226; Receives POST /publish</text>
      <text x="25" y="150" class="txt-node-sub">&#8226; Pushes to Redis Bus</text>
    </g>

    <!-- Bottom Right: Node-Beta -->
    <g transform="translate(275, 240)">
      <rect width="225" height="165" rx="10" fill="#ffefe0" stroke="#000000" stroke-width="1.5"/>
      <rect x="25" y="15" width="175" height="24" rx="6" fill="#fed7aa"/>
      <text x="112" y="31" class="txt-badge" font-size="12" text-anchor="middle">FastAPI: Node-Beta</text>
      <text x="112" y="68" class="txt-node-code" font-size="12" text-anchor="middle">Port 8002</text>
      <text x="25" y="100" class="txt-node-sub">&#8226; Client 2 connected</text>
      <text x="25" y="125" class="txt-node-sub">&#8226; Subscribed to Redis</text>
      <text x="25" y="150" class="txt-node-sub">&#8226; Delivers live to Client 2</text>
    </g>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 545)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Key Solution: Publishing an event to Node-Alpha broadcasts via Redis to Node-Beta and all clients</text>
  </g>
</svg>
