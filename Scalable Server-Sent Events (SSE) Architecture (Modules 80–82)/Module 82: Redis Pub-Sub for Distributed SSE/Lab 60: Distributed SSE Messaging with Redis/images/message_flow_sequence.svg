<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 21px; font-weight: 800; fill: #0f172a; }
      .txt-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 500; fill: #64748b; }
      .txt-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .txt-step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; }
      .txt-msg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .txt-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #475569; }

      @keyframes flow-seq {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .seq-flow-red {
        stroke: #ef4444;
        stroke-width: 2;
        stroke-dasharray: 6 3;
        animation: flow-seq 1s linear infinite;
      }
      .seq-flow-purple {
        stroke: #8b5cf6;
        stroke-width: 2;
        stroke-dasharray: 6 3;
        animation: flow-seq 1s linear infinite;
      }
      .seq-flow-blue {
        stroke: #0284c7;
        stroke-width: 2;
        stroke-dasharray: 6 3;
        animation: flow-seq 1s linear infinite;
      }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1150" height="620" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="45" class="txt-title">Distributed Broadcast Sequence: Publisher &rarr; Redis &rarr; All Nodes</text>
  <text x="40" y="68" class="txt-subtitle">Step-by-step cross-node message propagation from single publisher to clients on separate servers</text>

  <!-- Lifeline Columns (Actors) -->
  <!-- 1. Client 1 (x = 100) -->
  <g transform="translate(30, 95)">
    <rect width="140" height="40" rx="8" fill="#0284c7" filter="url(#shadow)"/>
    <text x="70" y="25" class="txt-actor" text-anchor="middle">Client 1 (Web)</text>
    <line x1="70" y1="40" x2="70" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 2. Node Alpha (x = 320) -->
  <g transform="translate(250, 95)">
    <rect width="140" height="40" rx="8" fill="#0f172a" filter="url(#shadow)"/>
    <text x="70" y="25" class="txt-actor" text-anchor="middle">Node-Alpha</text>
    <line x1="70" y1="40" x2="70" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 3. Publisher / Admin (x = 540) -->
  <g transform="translate(470, 95)">
    <rect width="140" height="40" rx="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="70" y="25" class="txt-actor" text-anchor="middle">Publisher API</text>
    <line x1="70" y1="40" x2="70" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 4. Redis Bus (x = 760) -->
  <g transform="translate(690, 95)">
    <rect width="140" height="40" rx="8" fill="#dc2626" filter="url(#shadow)"/>
    <text x="70" y="25" class="txt-actor" text-anchor="middle">Redis Pub/Sub</text>
    <line x1="70" y1="40" x2="70" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 5. Node Beta (x = 910) -->
  <g transform="translate(840, 95)">
    <rect width="140" height="40" rx="8" fill="#0f172a" filter="url(#shadow)"/>
    <text x="70" y="25" class="txt-actor" text-anchor="middle">Node-Beta</text>
    <line x1="70" y1="40" x2="70" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 6. Client 2 (x = 1050) -->
  <g transform="translate(980, 95)">
    <rect width="140" height="40" rx="8" fill="#0284c7" filter="url(#shadow)"/>
    <text x="70" y="25" class="txt-actor" text-anchor="middle">Client 2 (Mobile)</text>
    <line x1="70" y1="40" x2="70" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- ==================== SEQUENCE STEPS ==================== -->
  
  <!-- Step 1: Client 1 Connects to Node Alpha -->
  <g transform="translate(0, 160)">
    <line x1="100" y1="0" x2="320" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <circle cx="100" cy="0" r="10" fill="#0284c7"/>
    <text x="100" y="4" class="txt-step-num" text-anchor="middle">1</text>
    <text x="210" y="-8" class="txt-msg" text-anchor="middle">GET /events (Client 1 registers)</text>
  </g>

  <!-- Step 2: Client 2 Connects to Node Beta -->
  <g transform="translate(0, 210)">
    <line x1="1050" y1="0" x2="910" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <circle cx="1050" cy="0" r="10" fill="#0284c7"/>
    <text x="1050" y="4" class="txt-step-num" text-anchor="middle">2</text>
    <text x="980" y="-8" class="txt-msg" text-anchor="middle">GET /events (Client 2 registers)</text>
  </g>

  <!-- Step 3: Publisher calls POST /publish on Node Alpha -->
  <g transform="translate(0, 270)">
    <line x1="540" y1="0" x2="320" y2="0" class="seq-flow-red" marker-end="url(#arrow-red)"/>
    <circle cx="540" cy="0" r="10" fill="#ef4444"/>
    <text x="540" y="4" class="txt-step-num" text-anchor="middle">3</text>
    <text x="430" y="-8" class="txt-msg" fill="#991b1b" text-anchor="middle">POST /publish {"title":"Flash Alert"}</text>
  </g>

  <!-- Step 4: Node Alpha publishes to Redis -->
  <g transform="translate(0, 330)">
    <line x1="320" y1="0" x2="760" y2="0" class="seq-flow-red" marker-end="url(#arrow-red)"/>
    <circle cx="320" cy="0" r="10" fill="#ef4444"/>
    <text x="320" y="4" class="txt-step-num" text-anchor="middle">4</text>
    <text x="540" y="-8" class="txt-msg" fill="#dc2626" text-anchor="middle">PUBLISH sse_events_channel &lt;payload&gt;</text>
  </g>

  <!-- Step 5: Redis fans out to BOTH subscribers -->
  <g transform="translate(0, 390)">
    <!-- Fan out to Node Alpha -->
    <line x1="760" y1="0" x2="320" y2="0" class="seq-flow-purple" marker-end="url(#arrow-purple)"/>
    <!-- Fan out to Node Beta -->
    <line x1="760" y1="0" x2="910" y2="0" class="seq-flow-purple" marker-end="url(#arrow-purple)"/>
    <circle cx="760" cy="0" r="10" fill="#8b5cf6"/>
    <text x="760" y="4" class="txt-step-num" text-anchor="middle">5</text>
    <text x="540" y="-8" class="txt-msg" fill="#6d28d9" text-anchor="middle">Redis Fan-out to all Subscriber Tasks</text>
    <text x="835" y="-8" class="txt-msg" fill="#6d28d9" text-anchor="middle">Fan-out</text>
  </g>

  <!-- Step 6: Nodes enqueue to local queues -->
  <g transform="translate(0, 445)">
    <rect x="250" y="-12" width="140" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="320" y="4" class="txt-note" font-weight="700" text-anchor="middle">Alpha: queue.put()</text>

    <rect x="840" y="-12" width="140" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="910" y="4" class="txt-note" font-weight="700" text-anchor="middle">Beta: queue.put()</text>
  </g>

  <!-- Step 7: Final Simultaneous Stream Delivery to BOTH clients -->
  <g transform="translate(0, 510)">
    <!-- To Client 1 -->
    <line x1="320" y1="0" x2="100" y2="0" class="seq-flow-blue" marker-end="url(#arrow-blue)"/>
    <!-- To Client 2 -->
    <line x1="910" y1="0" x2="1050" y2="0" class="seq-flow-blue" marker-end="url(#arrow-blue)"/>
    <circle cx="320" cy="0" r="10" fill="#10b981"/>
    <text x="320" y="4" class="txt-step-num" text-anchor="middle">6</text>
    <circle cx="910" cy="0" r="10" fill="#10b981"/>
    <text x="910" y="4" class="txt-step-num" text-anchor="middle">6</text>
    <text x="210" y="-8" class="txt-msg" fill="#0369a1" text-anchor="middle">data: {"title":"Flash Alert"}\n\n</text>
    <text x="980" y="-8" class="txt-msg" fill="#0369a1" text-anchor="middle">data: {"title":"Flash Alert"}\n\n</text>
  </g>

  <!-- Bottom verification status box -->
  <g transform="translate(200, 565)">
    <rect width="750" height="38" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="375" y="24" class="txt-note" font-weight="700" font-size="13" fill="#065f46" text-anchor="middle">
      RESULT: Both Client 1 (on Node Alpha) AND Client 2 (on Node Beta) receive the broadcast in real-time!
    </text>
  </g>
</svg>
