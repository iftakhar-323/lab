<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #000000; }
      .txt-actor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #4b5563; }
      .txt-step { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; font-weight: 700; fill: #111827; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Diagram Title -->
  <text x="630" y="48" class="txt-title" text-anchor="middle">Distributed SSE Message Flow: End-to-End Sequence</text>

  <!-- ==================== 5 ACTORS / LANES ==================== -->
  <!-- Lane 1: Client 1 (Web) -->
  <g transform="translate(70, 75)">
    <rect width="180" height="50" rx="8" fill="#eaf8ff" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="28" class="txt-actor" text-anchor="middle">Client 1 (Web)</text>
    <text x="90" y="44" class="txt-actor-sub" text-anchor="middle">On Node-Alpha</text>
    <line x1="90" y1="50" x2="90" y2="445" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Lane 2: Node-Alpha -->
  <g transform="translate(300, 75)">
    <rect width="180" height="50" rx="8" fill="#ffefe0" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="28" class="txt-actor" text-anchor="middle">Node-Alpha</text>
    <text x="90" y="44" class="txt-actor-sub" text-anchor="middle">FastAPI (Port 8001)</text>
    <line x1="90" y1="50" x2="90" y2="445" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Lane 3: Redis Bus -->
  <g transform="translate(540, 75)">
    <rect width="180" height="50" rx="8" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    <text x="90" y="28" class="txt-actor" text-anchor="middle">Redis Pub/Sub</text>
    <text x="90" y="44" class="txt-actor-sub" text-anchor="middle">Port 6379</text>
    <line x1="90" y1="50" x2="90" y2="445" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Lane 4: Node-Beta -->
  <g transform="translate(780, 75)">
    <rect width="180" height="50" rx="8" fill="#ffefe0" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="28" class="txt-actor" text-anchor="middle">Node-Beta</text>
    <text x="90" y="44" class="txt-actor-sub" text-anchor="middle">FastAPI (Port 8002)</text>
    <line x1="90" y1="50" x2="90" y2="445" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Lane 5: Client 2 (Mobile) -->
  <g transform="translate(1010, 75)">
    <rect width="180" height="50" rx="8" fill="#eaf8ff" stroke="#000000" stroke-width="1.5"/>
    <text x="90" y="28" class="txt-actor" text-anchor="middle">Client 2 (Mobile)</text>
    <text x="90" y="44" class="txt-actor-sub" text-anchor="middle">On Node-Beta</text>
    <line x1="90" y1="50" x2="90" y2="445" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- ==================== SEQUENCE STEPS ==================== -->
  <!-- Step 1: Connections Established -->
  <!-- Client 1 -> Node-Alpha -->
  <path d="M 160 165 L 390 165" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="145" width="150" height="20" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="275" y="159" class="txt-code" fill="#1d4ed8" text-anchor="middle">1. GET /events</text>

  <!-- Client 2 -> Node-Beta -->
  <path d="M 1100 165 L 870 165" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910" y="145" width="150" height="20" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="985" y="159" class="txt-code" fill="#1d4ed8" text-anchor="middle">1. GET /events</text>

  <!-- Step 2: Nodes Subscribe to Redis -->
  <!-- Node-Alpha -> Redis -->
  <path d="M 390 220 L 630 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="200" width="160" height="20" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="510" y="214" class="txt-code" text-anchor="middle">2. SUBSCRIBE 'events'</text>

  <!-- Node-Beta -> Redis -->
  <path d="M 870 240 L 630 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="670" y="220" width="160" height="20" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="750" y="234" class="txt-code" text-anchor="middle">2. SUBSCRIBE 'events'</text>

  <!-- Step 3: Publish Message to Node-Alpha -->
  <g transform="translate(100, 275)">
    <rect width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="90" y="25" class="txt-badge" fill="#991b1b" text-anchor="middle">Admin: POST /publish</text>
  </g>
  <path d="M 280 295 L 390 295" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="288" class="txt-code" fill="#dc2626" text-anchor="middle">3. Payload</text>

  <!-- Step 4: Node-Alpha publishes to Redis -->
  <path d="M 390 350 L 630 350" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="420" y="330" width="180" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="510" y="345" class="txt-code" fill="#991b1b" text-anchor="middle">4. PUBLISH 'events' msg</text>

  <!-- Step 5: Redis Fans Out to BOTH Nodes -->
  <!-- Redis -> Node-Alpha -->
  <path d="M 630 400 L 390 400" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="380" width="160" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="510" y="394" class="txt-code" fill="#166534" text-anchor="middle">5. Broadcast to Node-A</text>

  <!-- Redis -> Node-Beta -->
  <path d="M 630 420 L 870 420" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="670" y="400" width="160" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="750" y="414" class="txt-code" fill="#166534" text-anchor="middle">5. Broadcast to Node-B</text>

  <!-- Step 6: Both Nodes Stream to Connected Clients -->
  <!-- Node-Alpha -> Client 1 -->
  <path d="M 390 470 L 160 470" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="200" y="450" width="150" height="22" rx="4" fill="#d4f6d9" stroke="#059669" stroke-width="1"/>
  <text x="275" y="465" class="txt-badge" fill="#047857" text-anchor="middle">6. Push SSE to Client 1</text>

  <!-- Node-Beta -> Client 2 -->
  <path d="M 870 470 L 1100 470" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="910" y="450" width="150" height="22" rx="4" fill="#d4f6d9" stroke="#059669" stroke-width="1"/>
  <text x="985" y="465" class="txt-badge" fill="#047857" text-anchor="middle">6. Push SSE to Client 2</text>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 550)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Summary: Redis Pub/Sub acts as the central event highway, ensuring all connected clients receive updates</text>
  </g>
</svg>
