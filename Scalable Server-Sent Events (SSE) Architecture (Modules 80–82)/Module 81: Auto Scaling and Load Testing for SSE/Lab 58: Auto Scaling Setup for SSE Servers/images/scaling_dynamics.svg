<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .txt-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 500; fill: #64748b; }
      .txt-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #334155; }
      .txt-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }

      @keyframes pulse-dot {
        0% { r: 6; }
        50% { r: 9; }
        100% { r: 6; }
      }
      .anim-alert-dot {
        animation: pulse-dot 1.8s infinite ease-in-out;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="45" class="txt-title">Scaling Metrics Comparison: CPU Utilization vs Connection Density</text>
  <text x="40" y="68" class="txt-subtitle">Why traditional CPU metrics lead to catastrophic under-provisioning during SSE connection spikes</text>

  <!-- Left Chart: CPU Metric (Flawed) -->
  <g transform="translate(40, 95)">
    <rect width="490" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="490" height="36" rx="12" fill="#fef2f2"/>
    <rect y="24" width="490" height="12" fill="#fef2f2"/>
    <text x="16" y="24" class="txt-header" fill="#991b1b">Metric 1: CPU Utilization (FLAWED FOR SSE)</text>
    <rect x="385" y="8" width="90" height="20" rx="10" fill="#ef4444"/>
    <text x="430" y="22" class="txt-badge" text-anchor="middle">Misses Spikes</text>

    <!-- Chart Canvas -->
    <g transform="translate(45, 55)">
      <!-- Axes -->
      <line x1="0" y1="210" x2="400" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="0" y1="210" x2="0" y2="10" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="390" y="230" class="txt-body" font-size="11">Time</text>
      <text x="10" y="25" class="txt-body" font-size="11">CPU %</text>

      <!-- 70% Scaling Threshold Line -->
      <line x1="0" y1="70" x2="380" y2="70" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="240" y="64" class="txt-code" fill="#b91c1c" font-size="11">Scale-Out Alarm (70% CPU)</text>

      <!-- Flat CPU Line despite high connections -->
      <path d="M 0 190 Q 100 185, 200 180 T 380 175" fill="none" stroke="#64748b" stroke-width="3"/>
      <text x="180" y="165" class="txt-code" fill="#475569">Actual CPU stays ~12% - 15%</text>

      <!-- Danger Crash Point -->
      <circle cx="340" cy="175" r="7" fill="#ef4444" class="anim-alert-dot"/>
      <text x="260" y="200" class="txt-code" fill="#dc2626" font-weight="700">OOM / Socket Limit Crash!</text>
    </g>

    <text x="20" y="325" class="txt-body" fill="#7f1d1d">
      Alarm never triggers because idle sockets do not consume compute cycles.
    </text>
  </g>

  <!-- Right Chart: Connection Density Metric (Recommended) -->
  <g transform="translate(570, 95)">
    <rect width="490" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="490" height="36" rx="12" fill="#f0fdf4"/>
    <rect y="24" width="490" height="12" fill="#f0fdf4"/>
    <text x="16" y="24" class="txt-header" fill="#166534">Metric 2: TargetConnectionCount (OPTIMAL)</text>
    <rect x="375" y="8" width="100" height="20" rx="10" fill="#10b981"/>
    <text x="425" y="22" class="txt-badge" text-anchor="middle">Scales Timely</text>

    <!-- Chart Canvas -->
    <g transform="translate(45, 55)">
      <!-- Axes -->
      <line x1="0" y1="210" x2="400" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="0" y1="210" x2="0" y2="10" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="390" y="230" class="txt-body" font-size="11">Time</text>
      <text x="10" y="25" class="txt-body" font-size="11">Connections</text>

      <!-- Target Value Threshold Line -->
      <line x1="0" y1="90" x2="380" y2="90" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="210" y="82" class="txt-code" fill="#047857" font-size="11">Target Value: 1,000 conn/target</text>

      <!-- Rising Connection Curve -->
      <path d="M 0 200 Q 120 180, 200 110 T 260 70" fill="none" stroke="#0284c7" stroke-width="3"/>
      
      <!-- Scale Trigger Point -->
      <circle cx="260" cy="70" r="7" fill="#10b981"/>
      <text x="275" y="65" class="txt-code" fill="#065f46" font-weight="700">SCALE OUT TRIGGERED!</text>

      <!-- Curve Flattens Post Scale-Out -->
      <path d="M 260 70 Q 300 100, 380 95" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 3"/>
      <text x="240" y="130" class="txt-body" fill="#047857">Fleet expands &rarr; Concurrency normalized</text>
    </g>

    <text x="20" y="325" class="txt-body" fill="#14532d">
      ASG launches new nodes as soon as connection density passes 1,000.
    </text>
  </g>
</svg>
