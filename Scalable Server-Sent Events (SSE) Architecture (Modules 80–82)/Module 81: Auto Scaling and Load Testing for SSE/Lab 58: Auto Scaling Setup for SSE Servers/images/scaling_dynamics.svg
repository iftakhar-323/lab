<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 800; fill: #000000; }

      @keyframes pulse-dot {
        0% { r: 6px; }
        50% { r: 10px; }
        100% { r: 6px; }
      }
      .anim-crash {
        animation: pulse-dot 1.5s infinite ease-in-out;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Title Banner -->
  <g transform="translate(45, 30)">
    <rect width="1170" height="50" rx="10" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="585" y="32" class="txt-title" text-anchor="middle">SSE Scaling Metrics Comparison: CPU Utilization vs Target Connection Count</text>
  </g>

  <!-- ==================== LEFT: CPU UTILIZATION (FLAWED) ==================== -->
  <g transform="translate(45, 100)">
    <rect width="570" height="440" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    
    <text x="285" y="34" class="txt-node-title" text-anchor="middle">Metric 1: CPU Utilization (FLAWED FOR SSE)</text>
    <rect x="195" y="46" width="180" height="24" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="285" y="63" class="txt-badge" fill="#dc2626" text-anchor="middle">Causes Fleet Starvation &amp; OOM</text>

    <!-- Graph Container -->
    <g transform="translate(25, 85)">
      <rect width="520" height="260" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

      <!-- Graph Axes -->
      <line x1="60" y1="210" x2="480" y2="210" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="60" y1="210" x2="60" y2="25" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="490" y="215" class="txt-node-code">Time</text>
      <text x="50" y="18" class="txt-node-code">CPU %</text>

      <!-- 70% Scaling Threshold Line -->
      <line x1="60" y1="80" x2="460" y2="80" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="260" y="72" class="txt-badge" fill="#dc2626">Scale-Out Alarm Threshold (70% CPU)</text>

      <!-- Connection Spike Indicator -->
      <text x="80" y="110" class="txt-node-sub" font-style="italic">Connection Surge: 0 &rarr; 5,000 Sockets</text>

      <!-- Flat CPU Line -->
      <path d="M 60 180 Q 200 178, 350 175 T 440 172" fill="none" stroke="#000000" stroke-width="3"/>
      <text x="220" y="165" class="txt-node-title" font-size="14">Actual CPU Stays Low (~14%)</text>

      <!-- Socket Exhaustion / Crash Point -->
      <circle cx="430" cy="172" r="8" fill="#ef4444" stroke="#000000" stroke-width="2" class="anim-crash"/>
      <text x="430" y="150" class="txt-badge" fill="#b91c1c" text-anchor="middle">CRASH!</text>
      <text x="430" y="195" class="txt-node-code" fill="#b91c1c" text-anchor="middle">Max File Descriptors Hit</text>
    </g>

    <!-- Explanation Box -->
    <g transform="translate(25, 360)">
      <rect width="520" height="60" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="260" y="24" class="txt-node-sub" text-anchor="middle">Why It Fails: Long-lived idle SSE sockets consume minimal CPU cycles.</text>
      <text x="260" y="44" class="txt-node-sub" font-weight="700" fill="#991b1b" text-anchor="middle">Fleet exhausts RAM &amp; OS socket tables while CPU alarm never fires!</text>
    </g>
  </g>


  <!-- ==================== RIGHT: TARGET CONNECTION COUNT (OPTIMAL) ==================== -->
  <g transform="translate(645, 100)">
    <rect width="570" height="440" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="285" y="34" class="txt-node-title" text-anchor="middle">Metric 2: TargetConnectionCount (OPTIMAL FOR SSE)</text>
    <rect x="195" y="46" width="180" height="24" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="285" y="63" class="txt-badge" fill="#166534" text-anchor="middle">Dynamic &amp; Proactive Elasticity</text>

    <!-- Graph Container -->
    <g transform="translate(25, 85)">
      <rect width="520" height="260" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

      <!-- Graph Axes -->
      <line x1="60" y1="210" x2="480" y2="210" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="60" y1="210" x2="60" y2="25" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="490" y="215" class="txt-node-code">Time</text>
      <text x="30" y="18" class="txt-node-code">Connections</text>

      <!-- 1000 Conn Target Threshold Line -->
      <line x1="60" y1="110" x2="460" y2="110" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="240" y="102" class="txt-badge" fill="#166534">Target Tracking Value: 1,000 Conn/Target</text>

      <!-- Rising Connection Curve -->
      <path d="M 60 190 Q 180 170, 240 110" fill="none" stroke="#000000" stroke-width="3"/>
      
      <!-- Scale-Out Trigger Point -->
      <circle cx="240" cy="110" r="7" fill="#16a34a" stroke="#000000" stroke-width="2"/>
      <text x="240" y="85" class="txt-badge" fill="#15803d" text-anchor="middle">SCALE OUT TRIGGER</text>

      <!-- Normalized Fleet Concurrency Curve -->
      <path d="M 240 110 Q 310 135, 460 118" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/>
      <text x="360" y="145" class="txt-node-code" fill="#166534">Concurrency normalized across new nodes</text>
      <text x="360" y="165" class="txt-node-sub">New EC2 instances absorb traffic</text>
    </g>

    <!-- Explanation Box -->
    <g transform="translate(25, 360)">
      <rect width="520" height="60" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="260" y="24" class="txt-node-sub" text-anchor="middle">Why It Succeeds: Accurately mirrors real-time socket allocation.</text>
      <text x="260" y="44" class="txt-node-sub" font-weight="700" fill="#15803d" text-anchor="middle">ASG expands before instances experience socket depletion or latency spikes.</text>
    </g>
  </g>

  <!-- Bottom Summary Banner Pill -->
  <g transform="translate(45, 560)">
    <rect width="1170" height="44" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="585" y="28" class="txt-node-title" font-size="16" text-anchor="middle">Architectural Standard: Use TargetConnectionCount for Auto Scaling SSE, never CPUUtilization</text>
  </g>
</svg>
