<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 800; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. TRAFFIC INGRESS ==================== -->
  <g transform="translate(45, 60)">
    <rect width="210" height="295" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    
    <circle cx="105" cy="42" r="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 75 84 C 75 60, 135 60, 135 84" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <text x="105" y="112" class="txt-node-title" text-anchor="middle">Traffic Ingress</text>
    <text x="105" y="132" class="txt-node-sub" font-style="italic" text-anchor="middle">Concurrent Clients</text>
    
    <g transform="translate(15, 148)">
      <rect width="180" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="24" class="txt-node-title" font-size="14" text-anchor="middle">1,000+ SSE Streams</text>
      <line x1="10" y1="34" x2="170" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="90" y="55" class="txt-node-code" text-anchor="middle">GET /events</text>
      <text x="90" y="75" class="txt-node-sub" text-anchor="middle">• Long TCP Holding</text>
      <text x="90" y="95" class="txt-node-sub" text-anchor="middle">• Low CPU Footprint</text>
      <text x="90" y="115" class="txt-node-sub" text-anchor="middle">• File Descriptor Sensitive</text>
    </g>
  </g>

  <!-- Flow 1: Ingress -> ALB -->
  <path d="M 255 205 L 340 205" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 255 205 L 340 205" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="297" y="195" class="txt-arrow-label" text-anchor="middle">Traffic</text>


  <!-- ==================== 2. APPLICATION LOAD BALANCER ==================== -->
  <g transform="translate(340, 60)">
    <rect width="260" height="295" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="130" y="32" class="txt-node-title" text-anchor="middle">AWS ALB</text>
    <text x="130" y="52" class="txt-node-sub" font-weight="700" text-anchor="middle">Port 80/443 Ingress</text>

    <g transform="translate(15, 68)">
      <rect width="230" height="210" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="115" y="24" class="txt-node-title" font-size="14" text-anchor="middle">ALB Telemetry &amp; Routing</text>
      <line x1="12" y1="34" x2="218" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="115" y="55" class="txt-node-code" text-anchor="middle">idle_timeout = 3600s</text>
      <text x="115" y="75" class="txt-node-code" text-anchor="middle">dereg_delay = 300s</text>
      <text x="115" y="100" class="txt-node-sub" text-anchor="middle">• Metric: TargetConnectionCount</text>
      <text x="115" y="122" class="txt-node-sub" text-anchor="middle">• Round-Robin Dispatching</text>
      <text x="115" y="144" class="txt-node-sub" text-anchor="middle">• Health Check: GET /health</text>
      <rect x="15" y="160" width="200" height="34" rx="6" fill="#effff1" stroke="#000000" stroke-width="1.2"/>
      <text x="115" y="182" class="txt-node-code" text-anchor="middle">TargetGroup: sse-tg</text>
    </g>
  </g>

  <!-- Flow 2: ALB -> ASG -->
  <path d="M 600 205 L 685 205" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 600 205 L 685 205" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="642" y="195" class="txt-arrow-label" text-anchor="middle">Distribute</text>


  <!-- ==================== 3. AUTO SCALING GROUP FLEET ==================== -->
  <g transform="translate(685, 45)">
    <rect width="530" height="310" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="265" y="30" class="txt-title" text-anchor="middle">Auto Scaling Group: sse-asg</text>
    <text x="265" y="50" class="txt-node-sub" font-style="italic" text-anchor="middle">Min: 2 | Desired: 2 | Max: 8 Nodes</text>

    <!-- Instance A -->
    <g transform="translate(20, 62)">
      <rect width="235" height="232" rx="10" fill="#ffefe0" stroke="#000000" stroke-width="1.8"/>
      <text x="117" y="24" class="txt-node-title" font-size="14" text-anchor="middle">EC2 Instance A</text>
      <rect x="155" y="8" width="65" height="18" rx="6" fill="#d4f6d9" stroke="#000000" stroke-width="1"/>
      <text x="187" y="21" class="txt-badge" font-size="11" text-anchor="middle">Healthy</text>
      <line x1="12" y1="34" x2="223" y2="34" stroke="#000000" stroke-width="1"/>
      
      <g transform="translate(12, 45)">
        <rect width="211" height="115" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="105" y="22" class="txt-node-code" text-anchor="middle">ulimit -n 65535</text>
        <text x="105" y="44" class="txt-node-code" text-anchor="middle">FastAPI + 4 Workers</text>
        <text x="105" y="68" class="txt-node-sub" text-anchor="middle">Active Streams: 1,250</text>
        <text x="105" y="90" class="txt-node-sub" text-anchor="middle">CPU Usage: 14.2%</text>
      </g>
      
      <rect x="12" y="172" width="211" height="46" rx="6" fill="#ffeaea" stroke="#000000" stroke-width="1.2"/>
      <text x="105" y="191" class="txt-badge" text-anchor="middle">PutMetricData &rarr; CloudWatch</text>
      <text x="105" y="208" class="txt-node-code" font-size="11" text-anchor="middle">ActiveSSEConnections: 1250</text>
    </g>

    <!-- Instance B -->
    <g transform="translate(275, 62)">
      <rect width="235" height="232" rx="10" fill="#ffefe0" stroke="#000000" stroke-width="1.8"/>
      <text x="117" y="24" class="txt-node-title" font-size="14" text-anchor="middle">EC2 Instance B</text>
      <rect x="155" y="8" width="65" height="18" rx="6" fill="#d4f6d9" stroke="#000000" stroke-width="1"/>
      <text x="187" y="21" class="txt-badge" font-size="11" text-anchor="middle">Healthy</text>
      <line x1="12" y1="34" x2="223" y2="34" stroke="#000000" stroke-width="1"/>
      
      <g transform="translate(12, 45)">
        <rect width="211" height="115" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="105" y="22" class="txt-node-code" text-anchor="middle">ulimit -n 65535</text>
        <text x="105" y="44" class="txt-node-code" text-anchor="middle">FastAPI + 4 Workers</text>
        <text x="105" y="68" class="txt-node-sub" text-anchor="middle">Active Streams: 1,180</text>
        <text x="105" y="90" class="txt-node-sub" text-anchor="middle">CPU Usage: 13.8%</text>
      </g>
      
      <rect x="12" y="172" width="211" height="46" rx="6" fill="#ffeaea" stroke="#000000" stroke-width="1.2"/>
      <text x="105" y="191" class="txt-badge" text-anchor="middle">PutMetricData &rarr; CloudWatch</text>
      <text x="105" y="208" class="txt-node-code" font-size="11" text-anchor="middle">ActiveSSEConnections: 1180</text>
    </g>
  </g>


  <!-- ==================== 4. CLOUDWATCH TELEMETRY & DECISION ENGINE ==================== -->
  <g transform="translate(45, 375)">
    <rect width="1170" height="175" rx="14" fill="#fffbe8" stroke="#000000" stroke-width="2"/>
    <text x="585" y="28" class="txt-node-title" text-anchor="middle">Amazon CloudWatch Telemetry &amp; Dynamic Auto Scaling Engine</text>

    <!-- Sub-block A: CloudWatch Aggregation -->
    <g transform="translate(25, 42)">
      <rect width="345" height="118" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="172" y="24" class="txt-node-title" font-size="14" text-anchor="middle">CloudWatch Metric Aggregator</text>
      <line x1="12" y1="34" x2="333" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="172" y="55" class="txt-node-code" text-anchor="middle">Namespace: SSE/ApplicationFleet</text>
      <text x="172" y="78" class="txt-node-sub" text-anchor="middle">Total Active Connections = 2,430</text>
      <text x="172" y="100" class="txt-node-sub" text-anchor="middle">Avg Per Target: 1,215 (&gt; 1,000 threshold)</text>
    </g>

    <!-- Sub-block B: Target Tracking Policy -->
    <g transform="translate(395, 42)">
      <rect width="380" height="118" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="190" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Target Tracking Scaling Policy</text>
      <line x1="12" y1="34" x2="368" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="190" y="55" class="txt-node-code" text-anchor="middle">TargetValue: 1,000 Conn / Target</text>
      <text x="190" y="78" class="txt-node-sub" text-anchor="middle">ScaleOutCooldown: 60s (Aggressive)</text>
      <text x="190" y="100" class="txt-node-sub" text-anchor="middle">ScaleInCooldown: 300s (Protective Draining)</text>
    </g>

    <!-- Sub-block C: Scaling Trigger Action -->
    <g transform="translate(800, 42)">
      <rect width="345" height="118" rx="8" fill="#effff1" stroke="#000000" stroke-width="1.5"/>
      <text x="172" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Auto Scaling Action Triggered</text>
      <line x1="12" y1="34" x2="333" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="172" y="55" class="txt-node-code" text-anchor="middle">SCALE-OUT: +1 EC2 Instance</text>
      <text x="172" y="78" class="txt-node-sub" text-anchor="middle">Spawns Instance C via Launch Template</text>
      <text x="172" y="100" class="txt-node-sub" text-anchor="middle">Registers to Target Group in &lt; 60s</text>
    </g>
  </g>

  <!-- Metric Flow Down Arrow -->
  <path d="M 800 355 L 800 375" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Scale-Out Flow Up Arrow -->
  <path d="M 972 375 L 972 355" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Bottom Summary Banner Pill -->
  <g transform="translate(45, 565)">
    <rect width="1170" height="42" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="585" y="27" class="txt-node-title" font-size="16" text-anchor="middle">SSE Auto Scaling Architecture: Custom Connection Density Telemetry + Target Tracking at 1,000 Conn/Target</text>
  </g>
</svg>
