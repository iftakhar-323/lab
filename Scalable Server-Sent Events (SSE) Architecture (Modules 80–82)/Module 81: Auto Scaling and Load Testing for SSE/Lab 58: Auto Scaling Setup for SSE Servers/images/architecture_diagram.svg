<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== TOP: 3 MAIN TIERS ==================== -->
  <!-- 1. Launch Template -->
  <g transform="translate(60, 75)">
    <rect width="250" height="270" rx="14" fill="#eaf8ff" stroke="#000000" stroke-width="2"/>
    <text x="125" y="38" class="txt-node-title" text-anchor="middle">Launch Template</text>
    <text x="125" y="62" class="txt-node-sub" text-anchor="middle">Instance Blueprint</text>

    <!-- Details -->
    <rect x="20" y="85" width="210" height="160" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="35" y="100" width="180" height="26" rx="6" fill="#f1f5f9"/>
    <text x="125" y="118" class="txt-node-code" font-size="12" text-anchor="middle">lt-sse-server</text>
    <text x="35" y="152" class="txt-node-sub">&#8226; AMI: Ubuntu 22.04 LTS</text>
    <text x="35" y="178" class="txt-node-sub">&#8226; Type: t3.micro</text>
    <text x="35" y="204" class="txt-node-sub">&#8226; UserData: Auto-starts</text>
    <text x="45" y="226" class="txt-node-code" font-size="11">FastAPI + Uvicorn</text>
  </g>

  <!-- Arrow Template -> ASG -->
  <path d="M 310 180 L 460 180" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 310 180 L 460 180" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="385" y="170" class="txt-arrow-label" text-anchor="middle">Provisions</text>

  <!-- 2. Auto Scaling Group Fleet -->
  <g transform="translate(460, 75)">
    <rect width="400" height="270" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="200" y="38" class="txt-node-title" text-anchor="middle">Auto Scaling Group: sse-asg</text>
    <text x="200" y="62" class="txt-node-sub" text-anchor="middle">Dynamic Fleet (Min: 1 | Desired: 2 | Max: 5)</text>

    <!-- Node 1 -->
    <rect x="25" y="85" width="165" height="160" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="35" y="100" width="145" height="24" rx="6" fill="#dcfce7"/>
    <text x="107" y="117" class="txt-badge" font-size="12" text-anchor="middle">EC2 Instance 1</text>
    <text x="107" y="150" class="txt-node-title" font-size="15" text-anchor="middle">FastAPI Server</text>
    <text x="35" y="180" class="txt-node-sub">&#8226; Port: 8000</text>
    <text x="35" y="206" class="txt-node-sub">&#8226; Active Sockets:</text>
    <text x="45" y="228" class="txt-node-code" font-size="12">850 Streams</text>

    <!-- Node 2 -->
    <rect x="210" y="85" width="165" height="160" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="220" y="100" width="145" height="24" rx="6" fill="#dcfce7"/>
    <text x="292" y="117" class="txt-badge" font-size="12" text-anchor="middle">EC2 Instance 2</text>
    <text x="292" y="150" class="txt-node-title" font-size="15" text-anchor="middle">FastAPI Server</text>
    <text x="220" y="180" class="txt-node-sub">&#8226; Port: 8000</text>
    <text x="220" y="206" class="txt-node-sub">&#8226; Active Sockets:</text>
    <text x="230" y="228" class="txt-node-code" font-size="12">920 Streams</text>
  </g>

  <!-- Arrow ASG <-> ALB -->
  <path d="M 1010 180 L 860 180" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 1010 180 L 860 180" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="935" y="170" class="txt-arrow-label" text-anchor="middle">Balances</text>

  <!-- 3. AWS ALB -->
  <g transform="translate(1010, 75)">
    <rect width="190" height="270" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    <text x="95" y="38" class="txt-node-title" text-anchor="middle">AWS ALB</text>
    <text x="95" y="62" class="txt-node-sub" text-anchor="middle">Traffic Ingress</text>

    <rect x="15" y="85" width="160" height="160" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="95" y="115" class="txt-node-title" font-size="14" text-anchor="middle">Listener: Port 80</text>
    <text x="25" y="145" class="txt-node-sub">&#8226; Idle: 3600s</text>
    <text x="25" y="172" class="txt-node-sub">&#8226; Tracks conns</text>
    <rect x="25" y="195" width="140" height="26" rx="6" fill="#effff1" stroke="#16a34a" stroke-width="1"/>
    <text x="95" y="213" class="txt-node-code" font-size="11" text-anchor="middle">TargetConnCount</text>
  </g>

  <!-- ==================== BOTTOM: CLOUDWATCH SCALING POLICY ==================== -->
  <g transform="translate(60, 370)">
    <rect width="1140" height="160" rx="14" fill="#fffbe8" stroke="#000000" stroke-width="2"/>
    <text x="570" y="36" class="txt-node-title" text-anchor="middle">CloudWatch Target Tracking Scaling Policy</text>

    <!-- Policy 1 -->
    <g transform="translate(40, 55)">
      <rect width="500" height="85" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <rect x="15" y="15" width="190" height="26" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="110" y="32" class="txt-node-code" font-size="12" text-anchor="middle">TargetConnectionCount</text>
      <text x="220" y="33" class="txt-node-title" font-size="15">= 1,000 conns/target</text>
      <text x="20" y="65" class="txt-node-sub" font-size="12.5">Triggers scale-out when active socket count per server reaches 1,000</text>
    </g>

    <!-- Policy 2 -->
    <g transform="translate(600, 55)">
      <rect width="500" height="85" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <rect x="15" y="15" width="190" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
      <text x="110" y="32" class="txt-node-code" font-size="12" text-anchor="middle">TargetResponseTime</text>
      <text x="220" y="33" class="txt-node-title" font-size="15">&gt; 250ms Safeguard</text>
      <text x="20" y="65" class="txt-node-sub" font-size="12.5">Triggers emergency scale-out if event loop experiences high latency</text>
    </g>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 550)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Key Rule: SSE applications scale based on Active Socket Count, NOT CPU utilization!</text>
  </g>
</svg>
