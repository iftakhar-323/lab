<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 500; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }
    </style>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Title -->
  <text x="630" y="48" class="txt-title" text-anchor="middle">SSE Load Testing Results: Concurrency &amp; Hardware Efficiency</text>

  <!-- ==================== LEFT: CONCURRENCY PROFILE ==================== -->
  <g transform="translate(60, 80)">
    <rect width="550" height="440" rx="14" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <text x="275" y="40" class="txt-node-title" text-anchor="middle">1. Active Connections Profile</text>

    <!-- Graph Container -->
    <g transform="translate(40, 75)">
      <!-- Axes -->
      <line x1="50" y1="20" x2="50" y2="240" stroke="#000000" stroke-width="2"/>
      <line x1="50" y1="240" x2="470" y2="240" stroke="#000000" stroke-width="2"/>
      
      <text x="460" y="260" class="txt-node-sub">Time (s) -&gt;</text>
      <text x="15" y="15" class="txt-node-sub">Streams</text>

      <!-- 1000 Grid Line -->
      <line x1="50" y1="60" x2="470" y2="60" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="42" y="65" class="txt-node-code" font-size="11" text-anchor="end">1,000</text>

      <!-- 500 Grid Line -->
      <line x1="50" y1="150" x2="470" y2="150" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="42" y="155" class="txt-node-code" font-size="11" text-anchor="end">500</text>

      <!-- Traffic Curve -->
      <path d="M 50 240 L 150 60 L 360 60 L 450 240" fill="none" stroke="#2563eb" stroke-width="3.5"/>

      <!-- Annotations -->
      <rect x="70" y="100" width="90" height="24" rx="4" fill="#eaf8ff"/>
      <text x="115" y="116" class="txt-node-code" font-size="10" text-anchor="middle">Ramp (+50/s)</text>

      <rect x="200" y="25" width="160" height="26" rx="4" fill="#dcfce7"/>
      <text x="280" y="42" class="txt-badge" font-size="11" text-anchor="middle">1,000 Sustained Streams</text>

      <rect x="365" y="100" width="85" height="24" rx="4" fill="#f1f5f9"/>
      <text x="407" y="116" class="txt-node-code" font-size="10" text-anchor="middle">Clean Drain</text>
    </g>

    <!-- Takeaway -->
    <rect x="25" y="360" width="500" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="275" y="385" class="txt-badge" font-size="13" text-anchor="middle">Result: Zero Connection Drops or Timeouts</text>
    <text x="275" y="405" class="txt-node-sub" text-anchor="middle">FastAPI async coroutines handled all 1,000 persistent streams smoothly</text>
  </g>

  <!-- ==================== RIGHT: HARDWARE PROFILE ==================== -->
  <g transform="translate(650, 80)">
    <rect width="550" height="440" rx="14" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <text x="275" y="40" class="txt-node-title" text-anchor="middle">2. Server Hardware Efficiency</text>

    <!-- Graph Container -->
    <g transform="translate(40, 75)">
      <!-- Axes -->
      <line x1="50" y1="20" x2="50" y2="240" stroke="#000000" stroke-width="2"/>
      <line x1="50" y1="240" x2="470" y2="240" stroke="#000000" stroke-width="2"/>
      
      <text x="460" y="260" class="txt-node-sub">Time (s) -&gt;</text>
      <text x="15" y="15" class="txt-node-sub">RAM / CPU</text>

      <!-- RAM Curve (Green) -->
      <path d="M 50 220 Q 150 140 250 130 T 360 130 L 450 220" fill="none" stroke="#16a34a" stroke-width="3"/>
      
      <!-- CPU Curve (Slate) -->
      <path d="M 50 230 Q 150 215 250 215 T 360 215 L 450 235" fill="none" stroke="#64748b" stroke-width="3"/>

      <!-- Badges -->
      <rect x="220" y="95" width="180" height="26" rx="4" fill="#dcfce7"/>
      <text x="310" y="112" class="txt-node-code" font-size="11" text-anchor="middle">Peak RAM: 46.1 MB (~18 KB/conn)</text>

      <rect x="220" y="180" width="180" height="26" rx="4" fill="#f1f5f9"/>
      <text x="310" y="197" class="txt-node-code" font-size="11" text-anchor="middle">CPU Utilization: 4% - 8%</text>
    </g>

    <!-- Takeaway -->
    <rect x="25" y="360" width="500" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="275" y="385" class="txt-badge" font-size="13" text-anchor="middle">Resource Footprint: Extremely Lightweight</text>
    <text x="275" y="405" class="txt-node-sub" text-anchor="middle">Each SSE connection costs only ~18 KB of RAM and minimal CPU</text>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 550)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Takeaway: High concurrency in SSE is bound by RAM and File Descriptors, not CPU</text>
  </g>
</svg>
