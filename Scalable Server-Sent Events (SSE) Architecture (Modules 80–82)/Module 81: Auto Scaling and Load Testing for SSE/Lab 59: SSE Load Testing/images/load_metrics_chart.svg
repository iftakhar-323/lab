<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 500; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }
    </style>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== LEFT: CONCURRENCY PROFILE ==================== -->
  <g transform="translate(50, 45)">
    <rect width="560" height="480" rx="14" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <text x="280" y="42" class="txt-node-title" text-anchor="middle">1. Active Connections Profile</text>

    <!-- Graph Container -->
    <g transform="translate(35, 75)">
      <!-- Axes (x: 45 to 455, y: 20 to 240) -->
      <line x1="45" y1="20" x2="45" y2="240" stroke="#000000" stroke-width="2"/>
      <line x1="45" y1="240" x2="455" y2="240" stroke="#000000" stroke-width="2"/>
      
      <text x="455" y="262" class="txt-node-sub" text-anchor="end">Time (s) -&gt;</text>
      <text x="40" y="15" class="txt-node-sub" text-anchor="end">Streams</text>

      <!-- 1000 Grid Line -->
      <line x1="45" y1="60" x2="455" y2="60" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="38" y="65" class="txt-node-code" font-size="11" text-anchor="end">1,000</text>

      <!-- 500 Grid Line -->
      <line x1="45" y1="150" x2="455" y2="150" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="38" y="155" class="txt-node-code" font-size="11" text-anchor="end">500</text>

      <!-- Traffic Curve -->
      <path d="M 45 240 L 140 60 L 350 60 L 440 240" fill="none" stroke="#2563eb" stroke-width="3.5"/>

      <!-- Annotations -->
      <rect x="65" y="100" width="85" height="24" rx="4" fill="#eaf8ff" stroke="#2563eb" stroke-width="1"/>
      <text x="107" y="116" class="txt-node-code" font-size="10" text-anchor="middle">Ramp (+50/s)</text>

      <rect x="185" y="25" width="165" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="267" y="42" class="txt-badge" font-size="11" text-anchor="middle">1,000 Sustained Streams</text>

      <rect x="360" y="100" width="85" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="402" y="116" class="txt-node-code" font-size="10" text-anchor="middle">Clean Drain</text>
    </g>

    <!-- Takeaway Box -->
    <g transform="translate(25, 380)">
      <rect width="510" height="75" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="255" y="28" class="txt-badge" font-size="13" text-anchor="middle">Result: Zero Connection Drops or Timeouts</text>
      <text x="255" y="52" class="txt-node-sub" font-size="12.5" text-anchor="middle">FastAPI async coroutines handled 1,000 persistent streams smoothly</text>
    </g>
  </g>

  <!-- ==================== RIGHT: HARDWARE PROFILE ==================== -->
  <g transform="translate(650, 45)">
    <rect width="560" height="480" rx="14" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <text x="280" y="42" class="txt-node-title" text-anchor="middle">2. Server Hardware Efficiency</text>

    <!-- Graph Container -->
    <g transform="translate(35, 75)">
      <!-- Axes (x: 45 to 455, y: 20 to 240) -->
      <line x1="45" y1="20" x2="45" y2="240" stroke="#000000" stroke-width="2"/>
      <line x1="45" y1="240" x2="455" y2="240" stroke="#000000" stroke-width="2"/>
      
      <text x="455" y="262" class="txt-node-sub" text-anchor="end">Time (s) -&gt;</text>
      <text x="40" y="15" class="txt-node-sub" text-anchor="end">RAM / CPU</text>

      <!-- RAM Curve (Green) -->
      <path d="M 45 220 Q 140 140 240 130 T 350 130 L 440 220" fill="none" stroke="#16a34a" stroke-width="3"/>
      
      <!-- CPU Curve (Slate) -->
      <path d="M 45 230 Q 140 215 240 215 T 350 215 L 440 235" fill="none" stroke="#64748b" stroke-width="3"/>

      <!-- Badges -->
      <rect x="210" y="90" width="190" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="305" y="107" class="txt-node-code" font-size="11" text-anchor="middle">Peak RAM: 46.1 MB (~18 KB/conn)</text>

      <rect x="210" y="180" width="190" height="26" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="305" y="197" class="txt-node-code" font-size="11" text-anchor="middle">CPU Utilization: 4% - 8%</text>
    </g>

    <!-- Takeaway Box -->
    <g transform="translate(25, 380)">
      <rect width="510" height="75" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="255" y="28" class="txt-badge" font-size="13" text-anchor="middle">Resource Footprint: Extremely Lightweight</text>
      <text x="255" y="52" class="txt-node-sub" font-size="12.5" text-anchor="middle">Each SSE connection costs only ~18 KB of RAM and minimal CPU</text>
    </g>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(180, 545)">
    <rect width="900" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="450" y="31" class="txt-badge" font-size="14" text-anchor="middle">Takeaway: High concurrency in SSE is bound by RAM and File Descriptors, not CPU</text>
  </g>
</svg>
