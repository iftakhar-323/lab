<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .txt-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 500; fill: #64748b; }
      .txt-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #334155; }
      .txt-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="45" class="txt-title">SSE Load Test Execution Telemetry (1,000 Concurrent Streams)</text>
  <text x="40" y="68" class="txt-subtitle">Observed connection ramp-up, sustained streaming concurrency, and server memory footprint over time</text>

  <!-- Left Chart: Active Streams & Events -->
  <g transform="translate(40, 95)">
    <rect width="490" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="490" height="36" rx="12" fill="#f1f5f9"/>
    <rect y="24" width="490" height="12" fill="#f1f5f9"/>
    <text x="16" y="24" class="txt-header">1. Active Connections &amp; Event Delivery</text>
    <rect x="375" y="8" width="100" height="20" rx="10" fill="#0284c7"/>
    <text x="425" y="22" class="txt-badge" text-anchor="middle">Concurrency</text>

    <!-- Axes -->
    <g transform="translate(45, 55)">
      <line x1="0" y1="210" x2="400" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="0" y1="210" x2="0" y2="10" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="390" y="230" class="txt-body" font-size="11">Time (s)</text>
      <text x="10" y="20" class="txt-body" font-size="11">Streams (0 - 1000)</text>

      <!-- Grid lines -->
      <line x1="0" y1="70" x2="380" y2="70" stroke="#e2e8f0" stroke-width="1"/>
      <text x="-5" y="74" class="txt-code" font-size="10" fill="#64748b" text-anchor="end">1,000</text>
      <line x1="0" y1="140" x2="380" y2="140" stroke="#e2e8f0" stroke-width="1"/>
      <text x="-5" y="144" class="txt-code" font-size="10" fill="#64748b" text-anchor="end">500</text>

      <!-- Connection Ramp Curve (0 to 1000 over 20s, hold for 30s, drain) -->
      <!-- 0s=0, 20s=x150, 50s=x320, 60s=x380 -->
      <path d="M 0 210 L 150 70 L 320 70 L 380 210" fill="none" stroke="#0284c7" stroke-width="3"/>
      
      <!-- Annotations -->
      <text x="75" y="130" class="txt-code" fill="#0284c7" font-size="11">Ramp (+50/s)</text>
      <text x="235" y="55" class="txt-code" fill="#0369a1" font-weight="700">1,000 Sustained</text>
      <text x="330" y="130" class="txt-code" fill="#64748b" font-size="11">Drain</text>
    </g>

    <text x="20" y="325" class="txt-body" fill="#0f172a">
      Zero connection drops or TCP resets encountered across 1k concurrent streams.
    </text>
  </g>

  <!-- Right Chart: Server RAM & CPU Profile -->
  <g transform="translate(570, 95)">
    <rect width="490" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="490" height="36" rx="12" fill="#f0fdf4"/>
    <rect y="24" width="490" height="12" fill="#f0fdf4"/>
    <text x="16" y="24" class="txt-header" fill="#166534">2. Server Resource Profile (RAM &amp; CPU)</text>
    <rect x="375" y="8" width="100" height="20" rx="10" fill="#10b981"/>
    <text x="425" y="22" class="txt-badge" text-anchor="middle">Efficiency</text>

    <!-- Axes -->
    <g transform="translate(45, 55)">
      <line x1="0" y1="210" x2="400" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="0" y1="210" x2="0" y2="10" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="390" y="230" class="txt-body" font-size="11">Time (s)</text>
      <text x="10" y="20" class="txt-body" font-size="11">RAM (MB) / CPU %</text>

      <!-- RAM Baseline (28MB to 46MB peak) -->
      <path d="M 0 170 Q 150 140, 240 135 T 320 135 L 380 170" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="170" y="125" class="txt-code" fill="#047857" font-weight="700">Peak RAM: 46.12 MB</text>

      <!-- CPU Line (Fluctuates between 3% and 9%) -->
      <path d="M 0 195 Q 50 190, 100 185 T 180 182 T 260 184 T 340 186 L 380 198" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
      <text x="210" y="175" class="txt-code" fill="#d97706">CPU: 4% - 8.2%</text>
    </g>

    <text x="20" y="325" class="txt-body" fill="#14532d">
      Per-connection memory footprint is only ~18 KB, demonstrating high scalability.
    </text>
  </g>
</svg>
