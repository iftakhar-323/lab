<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; }
      .txt-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #64748b; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #334155; }
      .txt-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #0284c7; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }

      @keyframes flow-fast {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      .load-flow {
        stroke: #ef4444;
        stroke-width: 2.5;
        stroke-dasharray: 8 5;
        animation: flow-fast 0.9s linear infinite;
      }
      .dist-flow {
        stroke: #0284c7;
        stroke-width: 2.5;
        stroke-dasharray: 8 5;
        animation: flow-fast 1.2s linear infinite;
      }
    </style>

    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="50" y="45" class="txt-title">Lab 59: High-Concurrency SSE Load Testing Architecture</text>
  <text x="50" y="68" class="txt-subtitle">Simulating 1,000+ Concurrent Persistent SSE Streams, Kernel Socket Tuning, and Telemetry Validation</text>

  <!-- 1. Load Testing Generator -->
  <g transform="translate(40, 95)">
    <rect width="330" height="460" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="330" height="42" rx="14" fill="#ef4444"/>
    <rect y="30" width="330" height="12" fill="#ef4444"/>
    <text x="18" y="27" class="txt-node-title" fill="#ffffff">Load Generator Engine</text>
    <rect x="235" y="10" width="80" height="20" rx="10" fill="#b91c1c"/>
    <text x="275" y="24" class="txt-badge" text-anchor="middle">1k Clients</text>

    <!-- OS Limits Box -->
    <g transform="translate(16, 55)">
      <rect width="298" height="110" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="12" y="24" class="txt-node-title" font-size="13" fill="#991b1b">Kernel Limits (tune_system.sh)</text>
      <line x1="12" y1="34" x2="286" y2="34" stroke="#fecaca" stroke-width="1"/>
      <text x="12" y="55" class="txt-code" fill="#b91c1c">ulimit -n 65535 (File Descriptors)</text>
      <text x="12" y="75" class="txt-code" fill="#b91c1c">net.core.somaxconn = 65535</text>
      <text x="12" y="95" class="txt-code" fill="#b91c1c">ip_local_port_range = 1024 65535</text>
    </g>

    <!-- Coroutine Pool -->
    <g transform="translate(16, 180)">
      <rect width="298" height="125" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="24" class="txt-node-title" font-size="13">Python asyncio / aiohttp</text>
      <line x1="12" y1="34" x2="286" y2="34" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="55" class="txt-body">• 1,000 asynchronous client coroutines</text>
      <text x="12" y="75" class="txt-body">• Ramp-up: 50 connections/second</text>
      <text x="12" y="95" class="txt-body">• Holds open sockets for 30+ seconds</text>
      <text x="12" y="115" class="txt-body">• Telemetry: active streams &amp; errors</text>
    </g>

    <!-- k6 Alternative -->
    <g transform="translate(16, 320)">
      <rect width="298" height="115" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="12" y="24" class="txt-node-title" font-size="13" fill="#1e40af">k6 Distributed Engine</text>
      <line x1="12" y1="34" x2="286" y2="34" stroke="#bfdbfe" stroke-width="1"/>
      <text x="12" y="55" class="txt-code" font-size="11">executor: 'ramping-vus'</text>
      <text x="12" y="75" class="txt-body" font-size="12">• Stages: 0 &rarr; 500 &rarr; 1000 VUs</text>
      <text x="12" y="95" class="txt-code" font-size="11" fill="#15803d">Threshold: http_req_failed &lt; 1%</text>
    </g>
  </g>

  <!-- 2. Ingress & Load Balancer -->
  <g transform="translate(420, 180)">
    <rect width="280" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="280" height="38" rx="12" fill="#0284c7"/>
    <rect y="26" width="280" height="12" fill="#0284c7"/>
    <text x="16" y="25" class="txt-node-title" fill="#ffffff" font-size="14">Load Balancer (Port 8080)</text>

    <g transform="translate(16, 55)">
      <rect width="248" height="215" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="26" class="txt-node-title" font-size="13">Ingress Stream Handling</text>
      <line x1="12" y1="36" x2="236" y2="36" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="60" class="txt-code">proxy_buffering off;</text>
      <text x="14" y="80" class="txt-code">proxy_read_timeout 3600s;</text>
      <text x="14" y="100" class="txt-code">keepalive 64;</text>
      <line x1="12" y1="112" x2="236" y2="112" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="135" class="txt-body">• Absorbs 1,000 handshakes</text>
      <text x="14" y="155" class="txt-body">• Distributes streams evenly</text>
      <text x="14" y="175" class="txt-body">• Prevents TCP backlog drop</text>
      <text x="14" y="195" class="txt-code" fill="#10b981">Zero dropped packets</text>
    </g>
  </g>

  <!-- 3. Target Server Fleet -->
  <g transform="translate(750, 95)">
    <rect width="410" height="460" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="410" height="42" rx="14" fill="#0f172a"/>
    <rect y="30" width="410" height="12" fill="#0f172a"/>
    <text x="20" y="27" class="txt-node-title" fill="#ffffff">High-Efficiency SSE Target</text>
    <rect x="310" y="10" width="85" height="20" rx="10" fill="#10b981"/>
    <text x="352" y="24" class="txt-badge" text-anchor="middle">2 Workers</text>

    <!-- Worker 1 -->
    <g transform="translate(18, 55)">
      <rect width="374" height="175" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="16" y="26" class="txt-node-title" font-size="14">Uvicorn Worker 1 (Port 8000)</text>
      <line x1="16" y1="38" x2="358" y2="38" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="62" class="txt-code">Sustained Streams: 500 active</text>
      <text x="16" y="84" class="txt-body">• Event loop latency: <tspan class="txt-code" fill="#10b981">&lt; 15ms</tspan></text>
      <text x="16" y="106" class="txt-body">• Memory Consumption: <tspan font-weight="700">~24 MB RAM</tspan></text>
      <text x="16" y="128" class="txt-body">• CPU Utilization: <tspan font-weight="700">~4.1%</tspan></text>
      <text x="16" y="150" class="txt-code" fill="#0284c7">data: {"active_streams": 500}</text>
    </g>

    <!-- Worker 2 -->
    <g transform="translate(18, 245)">
      <rect width="374" height="175" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="16" y="26" class="txt-node-title" font-size="14">Uvicorn Worker 2 (Port 8000)</text>
      <line x1="16" y1="38" x2="358" y2="38" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="62" class="txt-code">Sustained Streams: 500 active</text>
      <text x="16" y="84" class="txt-body">• Event loop latency: <tspan class="txt-code" fill="#10b981">&lt; 14ms</tspan></text>
      <text x="16" y="106" class="txt-body">• Memory Consumption: <tspan font-weight="700">~22 MB RAM</tspan></text>
      <text x="16" y="128" class="txt-body">• CPU Utilization: <tspan font-weight="700">~4.0%</tspan></text>
      <text x="16" y="150" class="txt-code" fill="#0284c7">data: {"active_streams": 500}</text>
    </g>

    <text x="20" y="442" class="txt-code" font-size="11" fill="#15803d">Total: 1,000 Streams on ~46MB RAM &amp; &lt;10% CPU!</text>
  </g>

  <!-- Connectors -->
  <path d="M 370 325 L 420 325" class="load-flow" marker-end="url(#arrow-red)"/>
  <text x="395" y="315" class="txt-code" font-size="10" fill="#ef4444" text-anchor="middle">1k Streams</text>

  <path d="M 700 280 L 750 200" class="dist-flow" marker-end="url(#arrow-blue)"/>
  <path d="M 700 370 L 750 350" class="dist-flow" marker-end="url(#arrow-blue)"/>
</svg>
