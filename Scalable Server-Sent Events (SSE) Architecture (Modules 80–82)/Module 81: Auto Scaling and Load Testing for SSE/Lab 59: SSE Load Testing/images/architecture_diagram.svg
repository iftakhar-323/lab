<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000000; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #000000; }
      .txt-node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #000000; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Diagram Title -->
  <text x="630" y="48" class="txt-title" text-anchor="middle">Lab 59: High-Concurrency SSE Load Testing Architecture</text>

  <!-- ==================== 1. LOAD GENERATOR ==================== -->
  <g transform="translate(60, 95)">
    <rect width="280" height="430" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    <text x="140" y="42" class="txt-node-title" text-anchor="middle">Load Generator</text>
    <text x="140" y="66" class="txt-node-sub" text-anchor="middle">Simulating 1,000+ Clients</text>

    <!-- Python Runner -->
    <rect x="20" y="95" width="240" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="35" y="110" width="120" height="24" rx="6" fill="#eaf8ff"/>
    <text x="95" y="126" class="txt-badge" font-size="12" text-anchor="middle">Python aiohttp</text>
    <text x="35" y="160" class="txt-node-sub">&#8226; 1,000 Async Tasks</text>
    <text x="35" y="185" class="txt-node-sub">&#8226; Ramp: +50 conns/sec</text>
    <text x="35" y="210" class="txt-node-sub">&#8226; Keeps sockets open</text>

    <!-- k6 Runner -->
    <rect x="20" y="255" width="240" height="145" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="35" y="270" width="120" height="24" rx="6" fill="#fef3c7"/>
    <text x="95" y="286" class="txt-badge" font-size="12" text-anchor="middle">k6 Stress Runner</text>
    <rect x="35" y="305" width="210" height="26" rx="4" fill="#f1f5f9"/>
    <text x="140" y="322" class="txt-node-code" font-size="11" text-anchor="middle">k6 run --vus 1000</text>
    <text x="35" y="355" class="txt-node-sub">&#8226; Measures latency</text>
    <text x="35" y="380" class="txt-node-sub">&#8226; Validates stream health</text>
  </g>

  <!-- Connectors: Generator -> ALB -->
  <path d="M 340 260 L 460 260" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 340 260 L 460 260" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="400" y="250" class="txt-arrow-label" text-anchor="middle">1,000 Sockets</text>

  <path d="M 460 360 L 340 360" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 460 360 L 340 360" fill="none" stroke="#059669" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="400" y="350" class="txt-arrow-label" text-anchor="middle">Stream Data</text>

  <!-- ==================== 2. AWS ALB ==================== -->
  <g transform="translate(460, 95)">
    <rect width="280" height="430" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    <text x="140" y="42" class="txt-node-title" text-anchor="middle">AWS ALB</text>
    <text x="140" y="66" class="txt-node-sub" text-anchor="middle">Traffic Distribution Layer</text>

    <!-- Details -->
    <rect x="20" y="95" width="240" height="305" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <rect x="40" y="115" width="200" height="30" rx="6" fill="#f1f5f9"/>
    <text x="140" y="135" class="txt-node-code" font-size="12" text-anchor="middle">Port 80 / 443 Ingress</text>

    <text x="40" y="180" class="txt-node-title" font-size="15">Load Balancing:</text>
    <text x="40" y="210" class="txt-node-sub">&#8226; Round-Robin dispatch</text>
    <text x="40" y="240" class="txt-node-sub">&#8226; Idle Timeout: 3600s</text>
    <text x="40" y="270" class="txt-node-sub">&#8226; Evenly spreads 1,000</text>
    <text x="50" y="295" class="txt-node-sub">streams across targets</text>

    <rect x="40" y="330" width="200" height="45" rx="8" fill="#dcfce7"/>
    <text x="140" y="350" class="txt-badge" font-size="12" text-anchor="middle">Zero 504 Timeouts</text>
    <text x="140" y="367" class="txt-node-sub" font-size="11" text-anchor="middle">Stable TCP Passthrough</text>
  </g>

  <!-- Connectors: ALB -> Backend Fleet -->
  <path d="M 740 260 L 860 260" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 740 260 L 860 260" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="800" y="250" class="txt-arrow-label" text-anchor="middle">Balance</text>

  <path d="M 860 360 L 740 360" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 860 360 L 740 360" fill="none" stroke="#059669" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)"/>
  <text x="800" y="350" class="txt-arrow-label" text-anchor="middle">Events</text>

  <!-- ==================== 3. BACKEND TARGET FLEET ==================== -->
  <g transform="translate(860, 95)">
    <rect width="340" height="430" rx="14" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="170" y="42" class="txt-node-title" text-anchor="middle">Target SSE Fleet</text>
    <text x="170" y="66" class="txt-node-sub" text-anchor="middle">Auto-Scaled Backend Workers</text>

    <!-- Instance 1 -->
    <rect x="25" y="95" width="290" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="40" y="125" class="txt-node-title" font-size="15">Instance 1</text>
    <rect x="180" y="108" width="120" height="24" rx="6" fill="#dcfce7"/>
    <text x="240" y="124" class="txt-node-code" font-size="11" text-anchor="middle">~333 Streams</text>
    <text x="40" y="160" class="txt-node-sub">RAM: ~25 MB | CPU: ~5%</text>

    <!-- Instance 2 -->
    <rect x="25" y="200" width="290" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="40" y="230" class="txt-node-title" font-size="15">Instance 2</text>
    <rect x="180" y="213" width="120" height="24" rx="6" fill="#dcfce7"/>
    <text x="240" y="229" class="txt-node-code" font-size="11" text-anchor="middle">~333 Streams</text>
    <text x="40" y="265" class="txt-node-sub">RAM: ~25 MB | CPU: ~5%</text>

    <!-- Instance 3 -->
    <rect x="25" y="305" width="290" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="40" y="335" class="txt-node-title" font-size="15">Instance 3</text>
    <rect x="180" y="318" width="120" height="24" rx="6" fill="#dcfce7"/>
    <text x="240" y="334" class="txt-node-code" font-size="11" text-anchor="middle">~334 Streams</text>
    <text x="40" y="370" class="txt-node-sub">RAM: ~25 MB | CPU: ~5%</text>
  </g>

  <!-- Bottom Summary Pill -->
  <g transform="translate(200, 545)">
    <rect width="860" height="50" rx="25" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="430" y="31" class="txt-badge" font-size="15" text-anchor="middle">Takeaway: 1,000 persistent clients are evenly distributed across 3 instances with minimal hardware stress</text>
  </g>
</svg>
