<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" width="100%" height="auto">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: "Times New Roman", Times, serif; font-size: 14px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 800; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. LOAD GENERATOR ENGINE ==================== -->
  <g transform="translate(45, 65)">
    <rect width="330" height="480" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    
    <text x="165" y="32" class="txt-node-title" text-anchor="middle">Load Generator Engine</text>
    <text x="165" y="52" class="txt-node-sub" font-style="italic" text-anchor="middle">1,000+ Concurrent Virtual Clients</text>

    <!-- Sub-card 1: Kernel Tuning -->
    <g transform="translate(18, 68)">
      <rect width="294" height="115" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="147" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Kernel Limits (tune_system.sh)</text>
      <line x1="12" y1="34" x2="282" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="147" y="55" class="txt-node-code" text-anchor="middle">ulimit -n 65535</text>
      <text x="147" y="76" class="txt-node-code" text-anchor="middle">net.core.somaxconn = 65535</text>
      <text x="147" y="98" class="txt-node-code" text-anchor="middle">ip_local_port_range: 1024 65535</text>
    </g>

    <!-- Sub-card 2: Python Asyncio Pool -->
    <g transform="translate(18, 198)">
      <rect width="294" height="135" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="147" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Python aiohttp Coroutine Pool</text>
      <line x1="12" y1="34" x2="282" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="147" y="55" class="txt-node-sub" text-anchor="middle">• 1,000 Persistent asyncio tasks</text>
      <text x="147" y="76" class="txt-node-sub" text-anchor="middle">• Ramp Rate: 50 connections/sec</text>
      <text x="147" y="98" class="txt-node-sub" text-anchor="middle">• 30s Sustained holding duration</text>
      <text x="147" y="118" class="txt-node-sub" text-anchor="middle">• Live telemetry &amp; error tracking</text>
    </g>

    <!-- Sub-card 3: Distributed k6 Engine -->
    <g transform="translate(18, 348)">
      <rect width="294" height="110" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="147" y="24" class="txt-node-title" font-size="14" text-anchor="middle">k6 Distributed Stress Runner</text>
      <line x1="12" y1="34" x2="282" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="147" y="55" class="txt-node-code" text-anchor="middle">k6 run --vus 1000 load_test.js</text>
      <text x="147" y="78" class="txt-node-sub" text-anchor="middle">Measures connection latency (TTFB)</text>
      <text x="147" y="98" class="txt-node-sub" text-anchor="middle">Detects socket timeouts &amp; 504 errors</text>
    </g>
  </g>

  <!-- Flow: Load Generator -> ALB -->
  <path d="M 375 305 L 460 305" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 375 305 L 460 305" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="417" y="295" class="txt-arrow-label" text-anchor="middle">1k Streams</text>


  <!-- ==================== 2. LOAD BALANCER TIER ==================== -->
  <g transform="translate(460, 65)">
    <rect width="265" height="480" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="132" y="32" class="txt-node-title" text-anchor="middle">AWS ALB</text>
    <text x="132" y="52" class="txt-node-sub" font-weight="700" text-anchor="middle">Port 80/443 Ingress</text>

    <!-- ALB Attributes -->
    <g transform="translate(16, 70)">
      <rect width="233" height="150" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="116" y="24" class="txt-node-title" font-size="14" text-anchor="middle">ALB Stream Settings</text>
      <line x1="12" y1="34" x2="221" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="116" y="56" class="txt-node-code" text-anchor="middle">idle_timeout = 3600s</text>
      <text x="116" y="80" class="txt-node-sub" text-anchor="middle">• Preserves 1,000 open pipes</text>
      <text x="116" y="104" class="txt-node-sub" text-anchor="middle">• Zero premature TCP FINs</text>
      <text x="116" y="128" class="txt-node-sub" text-anchor="middle">• Cross-zone load balancing</text>
    </g>

    <!-- Target Group Forwarding -->
    <g transform="translate(16, 235)">
      <rect width="233" height="145" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="116" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Target Group Routing</text>
      <line x1="12" y1="34" x2="221" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="116" y="55" class="txt-node-code" text-anchor="middle">Algorithm: Round Robin</text>
      <text x="116" y="78" class="txt-node-sub" text-anchor="middle">• Node A: 500 connections</text>
      <text x="116" y="100" class="txt-node-sub" text-anchor="middle">• Node B: 500 connections</text>
      <text x="116" y="124" class="txt-node-sub" text-anchor="middle">• Health Check: GET /health</text>
    </g>

    <!-- Result Pill -->
    <g transform="translate(16, 395)">
      <rect width="233" height="65" rx="8" fill="#d4f6d9" stroke="#000000" stroke-width="1.5"/>
      <text x="116" y="26" class="txt-node-title" font-size="13" text-anchor="middle">ALB Metrics Status</text>
      <text x="116" y="48" class="txt-node-code" text-anchor="middle">HTTPCode_ELB_5XX: 0</text>
    </g>
  </g>

  <!-- Flow: ALB -> ASG Instances -->
  <!-- Arrow to Node A -->
  <path d="M 725 240 L 800 200" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 725 240 L 800 200" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Arrow to Node B -->
  <path d="M 725 380 L 800 420" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 725 380 L 800 420" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>


  <!-- ==================== 3. SCALED SSE BACKEND FLEET ==================== -->
  <g transform="translate(800, 45)">
    <rect width="415" height="500" rx="16" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="207" y="32" class="txt-title" text-anchor="middle">SSE Server Fleet (Auto Scaled)</text>
    <text x="207" y="52" class="txt-node-sub" font-style="italic" text-anchor="middle">Absorbing 1,000 Concurrent Streams</text>

    <!-- Node A -->
    <g transform="translate(20, 68)">
      <rect width="375" height="195" rx="12" fill="#ffefe0" stroke="#000000" stroke-width="2"/>
      <text x="187" y="26" class="txt-node-title" text-anchor="middle">EC2 Worker Node A (Port 8000)</text>
      <line x1="16" y1="36" x2="359" y2="36" stroke="#000000" stroke-width="1"/>

      <g transform="translate(16, 48)">
        <rect width="343" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="171" y="24" class="txt-node-code" text-anchor="middle">FastAPI + 4 Uvicorn Workers</text>
        <line x1="12" y1="34" x2="331" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="171" y="55" class="txt-node-sub" text-anchor="middle">• Active Sockets: 500 Persistent Streams</text>
        <text x="171" y="78" class="txt-node-sub" text-anchor="middle">• Memory Usage: 46.1 MB (~18 KB/conn)</text>
        <text x="171" y="100" class="txt-node-sub" text-anchor="middle">• CPU Utilization: 7.8% (Idle event loop)</text>
      </g>
    </g>

    <!-- Node B -->
    <g transform="translate(20, 280)">
      <rect width="375" height="195" rx="12" fill="#ffefe0" stroke="#000000" stroke-width="2"/>
      <text x="187" y="26" class="txt-node-title" text-anchor="middle">EC2 Worker Node B (Port 8000)</text>
      <line x1="16" y1="36" x2="359" y2="36" stroke="#000000" stroke-width="1"/>

      <g transform="translate(16, 48)">
        <rect width="343" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="171" y="24" class="txt-node-code" text-anchor="middle">FastAPI + 4 Uvicorn Workers</text>
        <line x1="12" y1="34" x2="331" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="171" y="55" class="txt-node-sub" text-anchor="middle">• Active Sockets: 500 Persistent Streams</text>
        <text x="171" y="78" class="txt-node-sub" text-anchor="middle">• Memory Usage: 44.8 MB (~18 KB/conn)</text>
        <text x="171" y="100" class="txt-node-sub" text-anchor="middle">• CPU Utilization: 7.2% (Idle event loop)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Summary Banner Pill -->
  <g transform="translate(45, 560)">
    <rect width="1170" height="44" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="585" y="28" class="txt-node-title" font-size="16" text-anchor="middle">High-Concurrency SSE Testing: Kernel Socket Tuning (ulimit -n 65535) + 1,000 Sustained Connections at ~18 KB/conn</text>
  </g>
</svg>
