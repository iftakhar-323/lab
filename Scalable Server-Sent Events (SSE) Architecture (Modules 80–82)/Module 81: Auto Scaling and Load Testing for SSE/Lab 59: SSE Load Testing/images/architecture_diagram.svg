<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630">
  <defs>
    <style>
      .txt-title { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #000000; }
      .txt-node-title { font-family: "Times New Roman", Times, serif; font-size: 17px; font-weight: 800; fill: #000000; }
      .txt-node-sub { font-family: "Times New Roman", Times, serif; font-size: 13px; font-weight: 600; fill: #000000; }
      .txt-node-code { font-family: "Times New Roman", Times, serif; font-size: 12.5px; font-weight: 700; fill: #000000; }
      .txt-arrow-label { font-family: "Times New Roman", Times, serif; font-size: 13.5px; font-weight: 800; fill: #000000; }
      .txt-badge { font-family: "Times New Roman", Times, serif; font-size: 12px; font-weight: 800; fill: #000000; }

      @keyframes flow-dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -32; }
      }
      .anim-flow {
        stroke-dasharray: 10 6;
        animation: flow-dash 1.2s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="10" y="10" width="1240" height="610" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ==================== 1. LOAD GENERATOR ENGINE (LEFT) ==================== -->
  <g transform="translate(45, 95)">
    <rect width="260" height="445" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
    
    <text x="130" y="32" class="txt-title" text-anchor="middle">Load Generator</text>
    <text x="130" y="52" class="txt-node-sub" font-style="italic" text-anchor="middle">(1,000+ Concurrent Virtual Clients)</text>

    <!-- Sub-card 1: Kernel Tuning -->
    <g transform="translate(15, 68)">
      <rect width="230" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="115" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Kernel Tuning (tune_system.sh)</text>
      <line x1="10" y1="34" x2="220" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="115" y="55" class="txt-node-code" text-anchor="middle">ulimit -n 65535</text>
      <text x="115" y="75" class="txt-node-code" text-anchor="middle">net.core.somaxconn = 65535</text>
      <text x="115" y="95" class="txt-node-code" text-anchor="middle">ip_local_port_range: 1024-65535</text>
    </g>

    <!-- Sub-card 2: Python Asyncio Pool -->
    <g transform="translate(15, 185)">
      <rect width="230" height="125" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="115" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Python aiohttp Coroutine Pool</text>
      <line x1="10" y1="34" x2="220" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="115" y="55" class="txt-node-sub" text-anchor="middle">• 1,000 Persistent asyncio tasks</text>
      <text x="115" y="75" class="txt-node-sub" text-anchor="middle">• Ramp Rate: 50 connections/sec</text>
      <text x="115" y="95" class="txt-node-sub" text-anchor="middle">• 30s Sustained holding duration</text>
      <text x="115" y="115" class="txt-node-sub" text-anchor="middle">• Live telemetry and error audit</text>
    </g>

    <!-- Sub-card 3: k6 Alternative -->
    <g transform="translate(15, 322)">
      <rect width="230" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="115" y="24" class="txt-node-title" font-size="14" text-anchor="middle">k6 Stress Runner (Alternative)</text>
      <line x1="10" y1="34" x2="220" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="115" y="55" class="txt-node-code" text-anchor="middle">k6 run --vus 1000 load_test.js</text>
      <text x="115" y="75" class="txt-node-sub" text-anchor="middle">Measures connection latency (TTFB)</text>
      <text x="115" y="95" class="txt-node-sub" text-anchor="middle">Zero 504 Gateway Timeouts</text>
    </g>
  </g>

  <!-- Flow 1: Load Generator -> ALB (100px Gap, Clean Straight Arrow) -->
  <path d="M 305 250 L 405 250" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 305 250 L 405 250" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="355" y="240" class="txt-arrow-label" text-anchor="middle">1,000 Streams</text>

  <!-- Flow 1 Return: ALB -> Generator (Live Stream Data) -->
  <path d="M 405 410 L 305 410" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 405 410 L 305 410" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="355" y="432" class="txt-arrow-label" text-anchor="middle">Stream Data</text>


  <!-- ==================== 2. AWS APPLICATION LOAD BALANCER (MIDDLE) ==================== -->
  <g transform="translate(405, 95)">
    <rect width="260" height="445" rx="14" fill="#effff1" stroke="#000000" stroke-width="2"/>
    
    <text x="130" y="32" class="txt-title" text-anchor="middle">AWS ALB</text>
    <text x="130" y="52" class="txt-node-sub" font-weight="700" text-anchor="middle">Port 80/443 Ingress</text>

    <!-- ALB Stream Settings -->
    <g transform="translate(15, 68)">
      <rect width="230" height="135" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="115" y="24" class="txt-node-title" font-size="14" text-anchor="middle">ALB Stream Settings</text>
      <line x1="12" y1="34" x2="218" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="115" y="55" class="txt-node-code" text-anchor="middle">idle_timeout = 3600s</text>
      <text x="115" y="78" class="txt-node-sub" text-anchor="middle">• Sustains 1,000 Open TCP Pipes</text>
      <text x="115" y="98" class="txt-node-sub" text-anchor="middle">• Zero Premature TCP Resets</text>
      <text x="115" y="118" class="txt-node-sub" text-anchor="middle">• Cross-Zone Load Balancing</text>
    </g>

    <!-- Target Group Forwarding -->
    <g transform="translate(15, 215)">
      <rect width="230" height="125" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="115" y="24" class="txt-node-title" font-size="14" text-anchor="middle">Target Group Routing</text>
      <line x1="12" y1="34" x2="218" y2="34" stroke="#000000" stroke-width="1"/>
      <text x="115" y="54" class="txt-node-code" text-anchor="middle">Algorithm: Round Robin</text>
      <text x="115" y="76" class="txt-node-sub" text-anchor="middle">Target 1 (Node A): 500 streams</text>
      <text x="115" y="96" class="txt-node-sub" text-anchor="middle">Target 2 (Node B): 500 streams</text>
      <text x="115" y="116" class="txt-node-sub" text-anchor="middle">Health Check: GET /health</text>
    </g>

    <!-- Metrics Status Pill -->
    <g transform="translate(15, 355)">
      <rect width="230" height="72" rx="8" fill="#d4f6d9" stroke="#000000" stroke-width="1.5"/>
      <text x="115" y="24" class="txt-node-title" font-size="13" text-anchor="middle">Load Test Health Metric</text>
      <text x="115" y="44" class="txt-node-code" text-anchor="middle">HTTPCode_ELB_5XX: 0</text>
      <text x="115" y="62" class="txt-node-sub" font-size="11" text-anchor="middle">100% Request Success Rate</text>
    </g>
  </g>

  <!-- Flow 2: ALB -> Fleet (100px Gap, Clean Straight Arrow) -->
  <path d="M 665 250 L 765 250" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 665 250 L 765 250" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="715" y="240" class="txt-arrow-label" text-anchor="middle">Dispatch Load</text>

  <!-- Flow 2 Return: Fleet -> ALB -->
  <path d="M 765 410 L 665 410" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 765 410 L 665 410" fill="none" stroke="#000000" stroke-width="2" class="anim-flow" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="715" y="432" class="txt-arrow-label" text-anchor="middle">SSE Chunks</text>


  <!-- ==================== 3. SCALED SSE BACKEND FLEET (RIGHT) ==================== -->
  <g transform="translate(765, 30)">
    <rect width="455" height="520" rx="16" fill="#ebeaff" stroke="#000000" stroke-width="2"/>
    <text x="227" y="32" class="txt-title" text-anchor="middle">SSE Server Fleet (Auto Scaled)</text>

    <!-- Top Dispatcher (Style of Coordinator in Lab 45) -->
    <g transform="translate(77, 50)">
      <rect width="300" height="145" rx="14" fill="#ffeaea" stroke="#000000" stroke-width="2"/>
      
      <text x="150" y="28" class="txt-node-title" text-anchor="middle">Target Group: sse-tg</text>
      <text x="150" y="48" class="txt-node-sub" font-weight="700" text-anchor="middle">Capacity: 1,000 Concurrent Streams</text>

      <g transform="translate(15, 60)">
        <rect width="270" height="70" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="135" y="24" class="txt-node-code" text-anchor="middle">Probe: GET /health &#8594; HTTP 200</text>
        <line x1="10" y1="34" x2="260" y2="34" stroke="#000000" stroke-width="1"/>
        <text x="135" y="52" class="txt-node-sub" font-size="12" text-anchor="middle">Latency: &lt; 2ms | Healthy Threshold: 2</text>
      </g>
    </g>

    <!-- Branching Connectors to Nodes -->
    <!-- Line to Node A -->
    <path d="M 160 195 L 115 275" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M 160 195 L 115 275" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(25, 220)">
      <rect width="125" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="62" y="18" class="txt-badge" text-anchor="middle">Node A: 500 Conn</text>
    </g>

    <!-- Line to Node B -->
    <path d="M 295 195 L 340 275" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M 295 195 L 340 275" fill="none" stroke="#000000" stroke-width="2.5" class="anim-flow" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(305, 220)">
      <rect width="125" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="62" y="18" class="txt-badge" text-anchor="middle">Node B: 500 Conn</text>
    </g>

    <!-- Node A -->
    <g transform="translate(18, 275)">
      <rect width="205" height="175" rx="14" fill="#ffefe0" stroke="#000000" stroke-width="2"/>
      <text x="102" y="26" class="txt-node-title" font-size="15" text-anchor="middle">EC2 Node A</text>
      <text x="102" y="44" class="txt-node-code" font-size="11" text-anchor="middle">Port 8000 (Healthy)</text>
      <line x1="12" y1="52" x2="193" y2="52" stroke="#000000" stroke-width="1"/>

      <g transform="translate(10, 60)">
        <rect width="185" height="102" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="92" y="22" class="txt-node-code" font-size="11" text-anchor="middle">FastAPI + 4 Workers</text>
        <line x1="8" y1="30" x2="177" y2="30" stroke="#000000" stroke-width="1"/>
        <text x="92" y="48" class="txt-node-sub" font-size="11" text-anchor="middle">500 Active Sockets</text>
        <text x="92" y="68" class="txt-node-sub" font-size="11" text-anchor="middle">RAM: 46.1 MB (~18 KB/c)</text>
        <text x="92" y="88" class="txt-node-sub" font-size="11" text-anchor="middle">CPU Usage: 7.8%</text>
      </g>
    </g>

    <!-- Node B -->
    <g transform="translate(232, 275)">
      <rect width="205" height="175" rx="14" fill="#ffefe0" stroke="#000000" stroke-width="2"/>
      <text x="102" y="26" class="txt-node-title" font-size="15" text-anchor="middle">EC2 Node B</text>
      <text x="102" y="44" class="txt-node-code" font-size="11" text-anchor="middle">Port 8000 (Healthy)</text>
      <line x1="12" y1="52" x2="193" y2="52" stroke="#000000" stroke-width="1"/>

      <g transform="translate(10, 60)">
        <rect width="185" height="102" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="92" y="22" class="txt-node-code" font-size="11" text-anchor="middle">FastAPI + 4 Workers</text>
        <line x1="8" y1="30" x2="177" y2="30" stroke="#000000" stroke-width="1"/>
        <text x="92" y="48" class="txt-node-sub" font-size="11" text-anchor="middle">500 Active Sockets</text>
        <text x="92" y="68" class="txt-node-sub" font-size="11" text-anchor="middle">RAM: 44.8 MB (~18 KB/c)</text>
        <text x="92" y="88" class="txt-node-sub" font-size="11" text-anchor="middle">CPU Usage: 7.2%</text>
      </g>
    </g>

    <!-- Bottom Pill Inside Fleet -->
    <g transform="translate(20, 465)">
      <rect width="415" height="38" rx="8" fill="#d4f6d9" stroke="#000000" stroke-width="1.5"/>
      <text x="207" y="24" class="txt-badge" font-size="13" text-anchor="middle">Total Concurrency: 1,000 Streams Sustained with Zero Packet Loss</text>
    </g>
  </g>

  <!-- Bottom Summary Banner Pill -->
  <g transform="translate(45, 565)">
    <rect width="1170" height="42" rx="10" fill="#d4f6d9" stroke="#000000" stroke-width="2"/>
    <text x="585" y="27" class="txt-node-title" font-size="16" text-anchor="middle">High-Concurrency SSE Testing: Kernel Socket Tuning (ulimit -n 65535) + 1,000 Sustained Connections at ~18 KB/conn</text>
  </g>
</svg>
